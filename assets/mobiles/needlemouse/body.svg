<svg xmlns="http://www.w3.org/2000/svg" width="76" height="76" viewBox="-38 -72 76 76">
  <!-- Needlemouse body: a painted wind-up toy horse on a wheeled board, a mouse knight in a thimble
       helmet perched on its neck. The horse (yarn tail and mane, dappled barrel, legs, head), its
       saddle blanket for the rider, the brass wind-up key in its shoulder for the rider's hands,
       the board and axle bosses, and the mouse (cape, body, ear, thimble, snout, tail, the paw that
       grips the needle). The wheels spin; the needle in the mouse's paw is the cannon; the
       pincushion hovering over it is its own part.
       Origin = ground contact center (= rig.ron body frame). Light from upper-left. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <ellipse id="barrel" cx="-4" cy="-27" rx="17" ry="8.4"/>
    <clipPath id="barrelClip"><use href="#barrel"/></clipPath>
    <path id="neck" d="M 2,-33 Q 8,-44 14,-46 L 19.4,-42 Q 14,-36 12.6,-24 Z"/>
    <ellipse id="head" cx="21.4" cy="-40" rx="7.6" ry="4.8" transform="rotate(22 21.4 -40)"/>
    <clipPath id="headClip"><use href="#head"/><use href="#neck"/></clipPath>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the board on its wheels: painted wood, axle bosses -->
    <rect x="-30" y="-15.4" width="60" height="5.6" rx="2" fill="#8a5a30" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -28.6,-14.2 H 28.6" stroke="#c48a5c" stroke-width="1" fill="none"/>
    <rect x="-23" y="-11" width="6" height="3.2" rx="0.8" fill="#6b4a9a" stroke="#2a1a2e" stroke-width="0.7"/>
    <rect x="17" y="-11" width="6" height="3.2" rx="0.8" fill="#6b4a9a" stroke="#2a1a2e" stroke-width="0.7"/>

    <!-- far legs, in shade -->
    <rect x="-14" y="-23" width="4.4" height="9" rx="1.2" fill="#d8d2c4" stroke="#2a1a2e" stroke-width="0.8"/>
    <rect x="9" y="-23" width="4.4" height="9" rx="1.2" fill="#d8d2c4" stroke="#2a1a2e" stroke-width="0.8"/>
    <!-- the yarn tail, in loops -->
    <path d="M -19.6,-31 Q -27,-31 -28,-25 Q -28.6,-20 -25.6,-18.4 Q -24.6,-22 -22.4,-24 Q -21,-27 -19.6,-27 Z" fill="#e98a2c" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -21,-29.4 Q -25.4,-28.4 -26,-23.4 M -22.4,-27.6 Q -24.4,-25.6 -24.6,-22" stroke="#b9621c" stroke-width="0.7" fill="none"/>

    <!-- the horse: neck and head, then the barrel over the neck's root -->
    <use href="#neck" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="1"/>
    <use href="#head" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#headClip)">
      <path d="M 12,-24 Q 15,-36 26,-36 L 32,-30 V -20 Z" fill="#d8d2c4"/>
      <ellipse cx="27.4" cy="-37" rx="3.2" ry="3" fill="#ffc6c6" opacity="0.8"/>
    </g>
    <circle cx="20.4" cy="-41.6" r="1.3" fill="#2a1a2e"/>
    <circle cx="20" cy="-42" r="0.45" fill="#ffffff"/>
    <circle cx="27.6" cy="-37.6" r="0.6" fill="#9e2a36"/>
    <path d="M 16.4,-44.4 L 15,-48.6 L 18.8,-46 Z" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="0.8"/>
    <!-- the yarn mane along the neck -->
    <path d="M 2.4,-34 Q 1.4,-37.6 4.6,-38 Q 5,-41.6 8.2,-41.2 Q 9.4,-44.6 12.4,-43.8 Q 14,-46.8 16.4,-45.4 L 14,-42.6 Q 9,-40 4.6,-34 Z" fill="#e98a2c" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 4.6,-36 Q 6,-37.6 7.6,-38.2 M 9,-39.6 Q 10.6,-41 12.2,-41.4" stroke="#b9621c" stroke-width="0.7" fill="none"/>
    <use href="#barrel" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#barrelClip)">
      <path d="M -22,-23 C -12,-19 4,-19 14,-23 V -16 H -22 Z" fill="#d8d2c4"/>
      <g fill="#d8d2c4"><circle cx="-14" cy="-28" r="1.6"/><circle cx="-9" cy="-24.4" r="1.3"/><circle cx="7" cy="-26.6" r="1.5"/><circle cx="-17.6" cy="-23.6" r="1.1"/></g>
      <path d="M -16,-33.4 Q -6,-36.4 6,-33.6" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    </g>
    <!-- near legs, hooves painted navy -->
    <rect x="-18.6" y="-22" width="4.6" height="8.4" rx="1.2" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="0.8"/>
    <rect x="5" y="-22" width="4.6" height="8.4" rx="1.2" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="0.8"/>
    <rect x="-18.8" y="-17.2" width="5" height="2.8" rx="0.8" fill="#283563" stroke="#2a1a2e" stroke-width="0.6"/>
    <rect x="4.8" y="-17.2" width="5" height="2.8" rx="0.8" fill="#283563" stroke="#2a1a2e" stroke-width="0.6"/>

    <!-- the saddle blanket: purple, gold trim, a tassel, and the team roundel -->
    <g transform="translate(-6 0)">
      <path d="M -15,-34.6 Q -7,-37.4 1,-34.6 L 0.4,-27.4 Q -7,-25.6 -14.4,-27.4 Z" fill="#6b4a9a" stroke="#2a1a2e" stroke-width="0.9"/>
      <path d="M -14.2,-28.6 Q -7,-26.8 -0.2,-28.6" stroke="#f2c23c" stroke-width="1.1" fill="none"/>
      <path d="M -13.6,-33.6 Q -7,-35.8 -0.2,-33.6" stroke="#9a7ac8" stroke-width="0.9" fill="none"/>
      <circle cx="-7.2" cy="-30.6" r="2.6" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="0.7"/>
      <circle cx="-7.2" cy="-30.6" r="1.7" fill="#e8434f"/>
      <path d="M -14.4,-27.6 L -15.6,-23.6" stroke="#2a1a2e" stroke-width="2.2"/>
      <path d="M -14.4,-27.6 L -15.6,-23.6" stroke="#f2c23c" stroke-width="1"/>
    </g>

    <!-- the wind-up key in the horse's back, its bow for the rider's hands -->
    <g transform="translate(-5 0)">
      <path d="M 2.4,-33 L 1.2,-40" stroke="#2a1a2e" stroke-width="2.6"/>
      <path d="M 2.4,-33 L 1.2,-40" stroke="#e9b949" stroke-width="1.2"/>
      <g fill="#e9b949" stroke="#2a1a2e" stroke-width="0.8">
        <circle cx="-1.6" cy="-43" r="2.6"/>
        <circle cx="3.8" cy="-43.8" r="2.6"/>
        <rect x="-0.4" y="-44.6" width="3.2" height="3.2" rx="0.8"/>
      </g>
      <circle cx="-1.6" cy="-43" r="0.9" fill="#2a1a2e"/>
      <circle cx="3.8" cy="-43.8" r="0.9" fill="#2a1a2e"/>
      <path d="M -3.4,-44.4 A 2 2 0 0 1 -1.8,-45.4" stroke="#fff1a8" stroke-width="0.7" fill="none"/>
    </g>

    <!-- the mouse knight, on the horse's neck, drawn a third larger about its paw, set back so its snout clears the needle -->
    <g transform="translate(13.5 -49) scale(1.3) translate(-17 49)">
      <path d="M 8.4,-53 Q 3,-50.6 2.6,-44.2 Q 6,-45 8.6,-46.4 Z" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.8"/>
      <path d="M 7.6,-44.4 Q 4.4,-41 7,-38.4 Q 9.4,-36.8 8.6,-34.4" stroke="#2a1a2e" stroke-width="1.8" fill="none"/>
      <path d="M 7.6,-44.4 Q 4.4,-41 7,-38.4 Q 9.4,-36.8 8.6,-34.4" stroke="#f4a7b4" stroke-width="0.8" fill="none"/>
      <ellipse cx="10.6" cy="-48.4" rx="4.4" ry="5" fill="#9aa0b4" stroke="#2a1a2e" stroke-width="0.9"/>
      <ellipse cx="12" cy="-47.4" rx="2.4" ry="3.4" fill="#d8dce6"/>
      <!-- the mouse's head: ear, snout, eye, whiskers, and the thimble -->
      <circle cx="7.8" cy="-60.2" r="3.3" fill="#9aa0b4" stroke="#2a1a2e" stroke-width="0.8"/>
      <circle cx="7.8" cy="-60.2" r="2" fill="#f4a7b4"/>
      <path d="M 8,-56 Q 9,-60.2 12.6,-59.6 Q 14.4,-58 16.4,-55.8 Q 15.6,-53.4 13.2,-53 Q 9,-52.6 8,-56 Z" fill="#9aa0b4" stroke="#2a1a2e" stroke-width="0.9"/>
      <circle cx="16.6" cy="-55.4" r="1.1" fill="#f4a7b4" stroke="#2a1a2e" stroke-width="0.5"/>
      <circle cx="13.2" cy="-56.4" r="1.15" fill="#2a1a2e"/>
      <circle cx="13.5" cy="-56.8" r="0.4" fill="#ffffff"/>
      <path d="M 14.6,-54.2 L 17.6,-53.4 M 14.4,-53.8 L 17.2,-52.2" stroke="#2a1a2e" stroke-width="0.4" fill="none"/>
      <path d="M 8.2,-58 Q 8.4,-64.2 12.6,-64.4 Q 15.6,-64 15,-58.6 Z" fill="#d8dce6" stroke="#2a1a2e" stroke-width="0.9"/>
      <path d="M 7.6,-58.4 Q 12,-56.8 15.4,-58.8" stroke="#2a1a2e" stroke-width="2.2" fill="none"/>
      <path d="M 7.6,-58.4 Q 12,-56.8 15.4,-58.8" stroke="#b8bccc" stroke-width="1.1" fill="none"/>
      <g fill="#9aa0b4"><circle cx="10.6" cy="-61.4" r="0.45"/><circle cx="12.4" cy="-61.8" r="0.45"/><circle cx="14.2" cy="-61.2" r="0.45"/><circle cx="11.4" cy="-59.8" r="0.45"/><circle cx="13.4" cy="-59.8" r="0.45"/></g>
      <path d="M 10,-62.6 Q 11,-63.6 12.4,-63.6" stroke="#ffffff" stroke-width="0.7" fill="none"/>
    </g>
    <!-- its arm reaching forward to the paw on the needle's grip, at the pivot -->
    <path d="M 10.4,-51 Q 14.6,-51.6 16.6,-49.2" stroke="#2a1a2e" stroke-width="3.2" fill="none"/>
    <path d="M 10.4,-51 Q 14.6,-51.6 16.6,-49.2" stroke="#9aa0b4" stroke-width="1.8" fill="none"/>
    <circle cx="17" cy="-49" r="2" fill="#9aa0b4" stroke="#2a1a2e" stroke-width="0.7"/>
  </g>
</svg>
