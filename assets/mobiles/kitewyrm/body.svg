<svg xmlns="http://www.w3.org/2000/svg" width="86" height="68" viewBox="-56 -66 86 68">
  <!-- Kitewyrm body: a festival paper-dragon kite, floating over the little reel cart it is flown
       from. The cart (a lacquered plank, a string reel), the kite string, the paper tail and its
       ribbon streamers, the gold paper fins on its back, and the kite's round paper body on bamboo
       ribs, a scaled cream belly, the rider's saddle cloth. The head is the cannon; the wheels spin.
       The kite floats 16 px over the ground (sim::tuning::kitewyrm::HOVER): only it is hittable.
       Origin = ground contact center (= rig.ron body frame). Light from upper-left. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- the kite's body: a round paper torso and the neck it lifts its head on -->
    <ellipse id="torso" cx="-10" cy="-38" rx="20" ry="19"/>
    <circle id="neck" cx="12.4" cy="-37.2" r="5"/>
    <g id="kite"><use href="#torso"/><use href="#neck"/></g>
    <clipPath id="kiteClip"><use href="#torso"/><use href="#neck"/></clipPath>
    <!-- the paper tail, rising back from the rump and curling up at its tip -->
    <path id="tail" d="M -27,-47 C -34,-50 -40,-53 -43,-58.6 C -44.4,-61 -47.6,-60.6 -47.4,-57.6 C -47,-52 -42.4,-45.6 -35,-41.4 C -32.6,-40 -30.4,-38.4 -28.6,-36.4 Z"/>
    <clipPath id="tailClip"><use href="#tail"/></clipPath>
    <radialGradient id="kiteLight" cx="-18" cy="-52" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#3a1a2a" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a1a2a" stop-opacity="0.25"/>
    </radialGradient>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- ribbon streamers off the tail's tip, gold over red, fluttering back -->
    <path d="M -47,-56.6 C -50,-54.6 -48.4,-51 -51.4,-48.4 C -52.8,-47.2 -52,-45.2 -50.6,-45.8" stroke="#2a1a2e" stroke-width="3" fill="none"/>
    <path d="M -47,-56.6 C -50,-54.6 -48.4,-51 -51.4,-48.4 C -52.8,-47.2 -52,-45.2 -50.6,-45.8" stroke="#c93a44" stroke-width="1.6" fill="none"/>
    <path d="M -45.6,-54.4 C -47,-50.4 -44.6,-48 -46.8,-44.2 C -47.8,-42.4 -46.4,-40.8 -45.2,-41.8" stroke="#2a1a2e" stroke-width="3" fill="none"/>
    <path d="M -45.6,-54.4 C -47,-50.4 -44.6,-48 -46.8,-44.2 C -47.8,-42.4 -46.4,-40.8 -45.2,-41.8" stroke="#e9b949" stroke-width="1.6" fill="none"/>

    <!-- the paper tail, banded like the body -->
    <use href="#tail" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#tailClip)">
      <path d="M -50,-52 C -44,-48 -36,-44 -28,-42 V -30 H -50 Z" fill="#c93a44"/>
      <path d="M -40.6,-54.4 Q -42.6,-48 -38.8,-43.6 M -34.6,-51.2 Q -36.8,-45.4 -33,-40.6" stroke="#9e2f3a" stroke-width="0.8" fill="none"/>
      <path d="M -44.4,-58.4 Q -40.4,-53.4 -32,-49.6" stroke="#ff8a90" stroke-width="0.9" fill="none"/>
    </g>
    <circle cx="-45.6" cy="-58.8" r="1.4" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.6"/>

    <!-- gold paper fins on the back, behind the rider -->
    <g fill="#e9b949" stroke="#2a1a2e" stroke-width="0.8">
      <path d="M -29.6,-46 L -33.4,-55.4 L -24.4,-51.2 Z"/>
      <path d="M -23.6,-51.6 L -25.4,-60.6 L -17.8,-54.6 Z"/>
    </g>
    <path d="M -31.6,-49.6 L -28.6,-48.4 M -24.4,-55.6 L -21.8,-53.6" stroke="#fff1a8" stroke-width="0.7" fill="none"/>

    <!-- the cart: a lacquered plank on two wheels, the kite's string reel at its front -->
    <path d="M -16.4,-10.6 H 16.4 Q 18,-10.6 18,-9 V -7.4 Q 18,-5.8 16.4,-5.8 H -16.4 Q -18,-5.8 -18,-7.4 V -9 Q -18,-10.6 -16.4,-10.6 Z" fill="#c93a44" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -17,-7.6 H 17 V -6.6 Q 17,-6.2 16.4,-6.2 H -16.4 Q -17,-6.2 -17,-6.6 Z" fill="#9e2f3a"/>
    <path d="M -16.4,-9.6 H 16.4" stroke="#e9b949" stroke-width="0.8"/>
    <rect x="-13.6" y="-7.6" width="3.2" height="2.6" rx="0.6" fill="#5a3a2a" stroke="#2a1a2e" stroke-width="0.6"/>
    <rect x="10.4" y="-7.6" width="3.2" height="2.6" rx="0.6" fill="#5a3a2a" stroke="#2a1a2e" stroke-width="0.6"/>
    <!-- the cart's pull handle, tipped up at its front -->
    <path d="M 16.6,-8.4 L 22.4,-13.6 M 20.6,-15.2 L 24.2,-12" stroke="#2a1a2e" stroke-width="2.4" fill="none"/>
    <path d="M 16.6,-8.4 L 22.4,-13.6 M 20.6,-15.2 L 24.2,-12" stroke="#b9822c" stroke-width="1.1" fill="none"/>

    <!-- the string reel at the plank's front: posts, a spool of cream string, gold flanges, and
         its crank -->
    <path d="M 10,-10.6 L 10.8,-13.4 M 16,-10.6 L 15.2,-13.4" stroke="#5a3a2a" stroke-width="1.4"/>
    <rect x="10.6" y="-15.6" width="5" height="4.2" rx="0.9" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 11.2,-14.3 H 15 M 11.2,-13 H 15" stroke="#ddd0b8" stroke-width="0.6"/>
    <ellipse cx="10.6" cy="-13.5" rx="1" ry="3" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.6"/>
    <ellipse cx="15.6" cy="-13.5" rx="1" ry="3" fill="#b9822c" stroke="#2a1a2e" stroke-width="0.6"/>
    <path d="M 16.2,-13.5 L 18.6,-15.6" stroke="#2a1a2e" stroke-width="1.6"/>
    <path d="M 16.2,-13.5 L 18.6,-15.6" stroke="#e9b949" stroke-width="0.7"/>
    <circle cx="18.8" cy="-15.8" r="0.9" fill="#c93a44" stroke="#2a1a2e" stroke-width="0.5"/>

    <!-- the kite string, taut from the reel up to the kite's chest, with a paper bow on it -->
    <path d="M 13,-15.6 L 8.6,-29.4" stroke="#2a1a2e" stroke-width="0.7" fill="none"/>
    <path d="M 11.4,-20.6 L 8.6,-22.6 L 9.2,-19.4 Z M 11.4,-20.6 L 14.2,-21.6 L 12.6,-18.6 Z" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.5"/>

    <!-- the kite: an outline pass, then the fill, so only its outer edge is inked -->
    <use href="#kite" stroke="#2a1a2e" stroke-width="2"/>
    <use href="#kite" fill="#e8434f"/>
    <g clip-path="url(#kiteClip)">
      <!-- the shaded underside, away from the light -->
      <path d="M -34,-33 C -22,-28 0,-29 22,-38 V -10 H -34 Z" fill="#c93a44"/>
      <!-- the cream belly scales, banded in gold -->
      <path d="M -32,-27.6 C -20,-22.4 0,-23.4 20,-33 V -10 H -32 Z" fill="#f6f0e2"/>
      <path d="M -32,-22.4 C -20,-17.6 0,-18.6 20,-27 V -10 H -32 Z" fill="#ddd0b8"/>
      <path d="M -32,-27.6 C -20,-22.4 0,-23.4 20,-33" stroke="#e9b949" stroke-width="1.3" fill="none"/>
      <path d="M -24,-23.4 Q -21.6,-20.6 -19,-22.6 Q -16.4,-20 -13.8,-22 Q -11.2,-19.6 -8.4,-21.6 Q -5.6,-19.6 -3,-22 Q -0.4,-20.2 2.2,-23 Q 4.6,-21.4 7,-24.6" stroke="#ddd0b8" stroke-width="0.7" fill="none"/>
      <!-- bamboo ribs under the paper, each catching the light on its left -->
      <path d="M -24,-55 Q -30.6,-38 -24.4,-22 M -14,-57 Q -19,-38 -14.4,-20 M -3.6,-56.6 Q -7.6,-38 -3.8,-19.4 M 6.4,-52.6 Q 3.6,-38 6.6,-23" stroke="#9e2f3a" stroke-width="0.9" fill="none"/>
      <path d="M -25.2,-54 Q -31.6,-38 -25.6,-24 M -15.2,-56 Q -20.2,-40 -15.8,-23 M -4.8,-55.6 Q -8.8,-40 -5.2,-24" stroke="#ff8a90" stroke-width="0.6" fill="none"/>
      <!-- the neck's paper collar of gold frills, under the head's joint -->
      <path d="M 8.6,-47.4 Q 6,-44 7.4,-40.6 Q 5.6,-37.6 8,-34.4 L 12,-36 L 12,-45 Z" fill="#e9b949"/>
      <path d="M 7.4,-46 Q 6.4,-43.6 7.4,-41.2" stroke="#fff1a8" stroke-width="0.7" fill="none"/>
      <rect x="-40" y="-66" width="70" height="56" fill="url(#kiteLight)"/>
      <path d="M -26,-48 C -21,-53.4 -12,-55.6 -4,-54" stroke="#ff9aa0" stroke-width="1.3" fill="none"/>
    </g>

    <!-- team roundel on the flank -->
    <circle cx="-17" cy="-35" r="3" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="-17" cy="-35" r="2" fill="#e8434f"/>
    <path transform="translate(-17,-35) scale(0.42)" d="M 0.9,0 A 0.9 0.9 0 0 0 -0.9,0 A 1.8 1.8 0 0 0 2.7,0 A 2.7 2.7 0 0 0 -2.7,0 A 3.6 3.6 0 0 0 4.5,0" stroke="#fff1d0" stroke-width="1.6" fill="none"/>

    <!-- saddle cloth on the back, gold-fringed -->
    <path d="M -19,-53.6 Q -12,-58.2 -5,-55.2 Q -4.6,-52.4 -11.6,-52 Q -18.4,-51.8 -19,-53.6 Z" fill="#3e8a6a" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -17.4,-54.2 Q -12,-56.6 -6.6,-55" stroke="#7cc8a0" stroke-width="0.9" fill="none"/>
    <path d="M -18,-52.6 Q -11.6,-51.6 -5.6,-53" stroke="#e9b949" stroke-width="0.8" fill="none"/>
  </g>
</svg>
