<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="-13 -13 26 26">
  <!-- Tinbadger's SS: the big wind-up beetle, facing +x, its feet on the ground 8 px under its
       middle (the origin), a big brass key turning in its back. -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- legs: three a side, jointed tin -->
    <path d="M -6.4,4.4 L -9,6.2 L -9.4,8 M -1,4.8 L -1.6,8 M 4.4,4.4 L 6.4,6 L 7,8" stroke="#2a1a2e" stroke-width="2" fill="none"/>
    <path d="M -6.4,4.4 L -9,6.2 L -9.4,8 M -1,4.8 L -1.6,8 M 4.4,4.4 L 6.4,6 L 7,8" stroke="#3f8ea2" stroke-width="0.9" fill="none"/>
    <!-- the big key in its back -->
    <path d="M -5,-6.6 L -7.6,-9.4" stroke="#2a1a2e" stroke-width="2"/>
    <path d="M -5,-6.6 L -7.6,-9.4" stroke="#e9b949" stroke-width="0.9"/>
    <ellipse cx="-9.6" cy="-9.4" rx="2.6" ry="1.8" transform="rotate(-40 -9.6 -9.4)" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.7"/>
    <ellipse cx="-7.4" cy="-11.6" rx="2.6" ry="1.8" transform="rotate(-40 -7.4 -11.6)" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle cx="-9.6" cy="-9.4" r="0.7" fill="#2a1a2e"/>
    <circle cx="-7.4" cy="-11.6" r="0.7" fill="#2a1a2e"/>
    <!-- the shell: tin plates, painted with a red stripe, a light along its crown -->
    <path d="M -10.6,4.8 C -10.6,-4.6 -5.4,-9 0,-9 C 5.4,-9 9.2,-4.6 9.2,4.8 Z" fill="#63b7c7" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -10.4,1.6 C -3.6,3 3.2,3 9,1.6 V 4.8 H -10.4 Z" fill="#3f8ea2"/>
    <path d="M -1.6,-8.8 C -2.4,-4 -2.4,0 -1.6,2.8 L 1.4,2.8 C 0.6,0 0.6,-4 1.4,-8.8 Z" fill="#e8434f"/>
    <path d="M -7.6,-2.4 C -7,-5.6 -4.4,-7.6 -1.8,-7.8" stroke="#d4f4f8" stroke-width="1.1" fill="none"/>
    <g fill="#2f6f82"><circle cx="-7.4" cy="2.4" r="0.6"/><circle cx="-4" cy="3" r="0.6"/><circle cx="4" cy="3" r="0.6"/><circle cx="7" cy="2.4" r="0.6"/></g>
    <!-- the head: a tin face with headlamp eyes and two antennae -->
    <path d="M 7.6,-2.4 C 11.6,-2.6 12.6,1.4 11.8,4.8 L 7.6,4.8 Z" fill="#3f8ea2" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="10.2" cy="0.4" r="1.5" fill="#fff1a8" stroke="#2a1a2e" stroke-width="0.5"/>
    <circle cx="10.6" cy="0.2" r="0.6" fill="#2a1a2e"/>
    <path d="M 9,-2.4 L 10.6,-7.4 M 7.6,-2.4 L 7.8,-7.8" stroke="#2a1a2e" stroke-width="0.7" fill="none"/>
    <circle cx="10.8" cy="-8" r="1.1" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.5"/>
    <circle cx="7.8" cy="-8.4" r="1.1" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.5"/>
  </g>
</svg>
