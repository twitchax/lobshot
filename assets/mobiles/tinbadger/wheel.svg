<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="-9 -9 18 18">
  <!-- Tinbadger's cart wheel: an iron-shod wooden wheel with six spokes and a brass hub. Origin =
       axle; spins (the spokes make rotation readable). -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.49" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linecap="round">
    <!-- Ring shading only: it spins, and a baked light would spin with it. -->
    <circle r="7.6" fill="#3e3c52"/>
    <circle r="6.6" fill="#5a5870"/>
    <circle r="5.6" fill="#c98a4f" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle r="4.4" fill="#e8b07a"/>
    <g stroke="#2a1a2e" stroke-width="1.9"><path d="M 0,-4.6 V 4.6 M -4,-2.3 L 4,2.3 M -4,2.3 L 4,-2.3"/></g>
    <g stroke="#9a6235" stroke-width="1"><path d="M 0,-4.6 V 4.6 M -4,-2.3 L 4,2.3 M -4,2.3 L 4,-2.3"/></g>
    <circle r="1.9" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.6"/>
    <circle r="0.7" fill="#8a5a22"/>
  </g>
</svg>
