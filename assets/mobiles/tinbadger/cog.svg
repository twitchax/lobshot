    <path d="M -1.2,-6.4 H 1.2 L 1.6,-4.6 L 3.3,-3.9 L 4.8,-5 L 6.5,-3.3 L 5.4,-1.8 L 6.1,-0.1 L 6.4,0 V 1.2 L 4.6,1.6 L 3.9,3.3 L 5,4.8 L 3.3,6.5 L 1.8,5.4 L 0.1,6.1 L 0,6.4 H -1.2 L -1.6,4.6 L -3.3,3.9 L -4.8,5 L -6.5,3.3 L -5.4,1.8 L -6.1,0.1 L -6.4,0 V -1.2 L -4.6,-1.6 L -3.9,-3.3 L -5,-4.8 L -3.3,-6.5 L -1.8,-5.4 Z" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle r="3.4" fill="#c98a2e" stroke="#2a1a2e" stroke-width="0.5"/>
    <path d="M -2.8,-1.6 A 3 3 0 0 1 -1,-3" stroke="#fff1a8" stroke-width="0.7" fill="none"/>
    <circle r="1.3" fill="#3e3c52" stroke="#2a1a2e" stroke-width="0.5"/>
  </g>
</svg>
