<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="-9 -9 18 18">
  <!-- Tinbadger's mine (S2's shells and the beetles they land as): a little wind-up tin beetle,
       facing +x, its feet on the ground 4 px under its middle (the origin, `sim::mines::Mine::middle`).
       Its antenna bead turns the whole beetle red when it is armed (the client tints it). -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.49" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- legs: three a side, tin wire -->
    <path d="M -4,2 L -5.4,4 M -0.6,2.2 L -1,4 M 2.8,2 L 3.8,4" stroke="#2a1a2e" stroke-width="1.4"/>
    <path d="M -4,2 L -5.4,4 M -0.6,2.2 L -1,4 M 2.8,2 L 3.8,4" stroke="#3f8ea2" stroke-width="0.6"/>
    <!-- the wind-up key in its back -->
    <path d="M -3.4,-3.6 L -5.2,-5.6" stroke="#2a1a2e" stroke-width="1.4"/>
    <path d="M -3.4,-3.6 L -5.2,-5.6" stroke="#e9b949" stroke-width="0.6"/>
    <ellipse cx="-6.4" cy="-6" rx="1.6" ry="1.1" transform="rotate(-40 -6.4 -6)" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.5"/>
    <ellipse cx="-5" cy="-7.4" rx="1.6" ry="1.1" transform="rotate(-40 -5 -7.4)" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.5"/>
    <!-- the domed tin shell, its seam and a rivet row -->
    <path d="M -6.4,2.4 C -6.4,-3 -3.2,-5.4 0,-5.4 C 3.2,-5.4 5.6,-3 5.6,2.4 Z" fill="#63b7c7" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M -6.2,0.6 C -2,1.4 2,1.4 5.4,0.6 V 2.4 H -6.2 Z" fill="#3f8ea2"/>
    <path d="M -4.4,-1.6 C -4,-3.6 -2.4,-4.6 -0.8,-4.6" stroke="#d4f4f8" stroke-width="0.8" fill="none"/>
    <path d="M -0.4,-5.2 V 0.8" stroke="#2f6f82" stroke-width="0.5"/>
    <!-- the head, a bead eye, and the antenna -->
    <circle cx="5.6" cy="0.4" r="2.2" fill="#3f8ea2" stroke="#2a1a2e" stroke-width="0.6"/>
    <circle cx="6.4" cy="0" r="0.7" fill="#2a1a2e"/>
    <path d="M 5,-1.6 L 6.6,-5.2" stroke="#2a1a2e" stroke-width="0.6"/>
    <circle cx="6.8" cy="-5.8" r="1" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.4"/>
  </g>
</svg>
