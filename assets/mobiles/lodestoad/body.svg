<svg xmlns="http://www.w3.org/2000/svg" width="76" height="56" viewBox="-38 -52 76 56">
  <!-- Lodestoad body: a toad driving a little yellow farm tractor wound with copper coil. The
       steel frame, the rear fender and the pan seat the rider sits on, the toad (squatting in the
       cab, its hands on the hood, its chin over it), and the hood with its coil, bolt decal and
       grille, and the post the magnet swivels on. The wheels spin; the horseshoe magnet on the
       post is the cannon.
       Origin = ground contact center (= rig.ron body frame). Light from upper-left. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="hood" d="M 6,-23 Q 6,-25.2 8.2,-25.2 H 27.4 Q 30.6,-25.2 30.6,-22 V -14 Q 30.6,-12.6 29.2,-12.6 H 6 Z"/>
    <clipPath id="hoodClip"><use href="#hood"/></clipPath>
    <path id="toad" d="M -11,-21 C -13.6,-26 -12.6,-35 -6,-39.4 C -1,-42.6 6.6,-42.4 10.6,-38.6 C 13.6,-35.6 15,-31.4 14,-27.4 C 13.2,-24.2 11,-21.8 8,-21 Z"/>
    <clipPath id="toadClip"><use href="#toad"/></clipPath>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the frame: a steel beam from the drawbar to the front axle -->
    <path d="M -30,-21.4 H 27 V -13.4 H -30 Z" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -29.4,-16.4 H 26.4 V -14 H -29.4 Z" fill="#3e3c52"/>
    <path d="M -28.6,-20 H 25.6" stroke="#8a88a6" stroke-width="0.9" fill="none"/>
    <circle cx="-32" cy="-17.4" r="2.2" fill="#8a88a6" stroke="#2a1a2e" stroke-width="0.7"/>

    <!-- the rear fender, arched over the drive wheel -->
    <path d="M -35.6,-13.6 A 17.6 17.6 0 0 1 -0.4,-13.6 L -3,-13.6 A 15 15 0 0 0 -33,-13.6 Z" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -33.2,-17.6 A 15.4 15.4 0 0 1 -20,-28.8" stroke="#fff3b0" stroke-width="1" fill="none"/>
    <path d="M -9,-26.6 A 15.6 15.6 0 0 1 -2.4,-15.4" stroke="#b9822c" stroke-width="1.2" fill="none"/>

    <!-- the pan seat on its sprung post, where the rider sits -->
    <path d="M -21,-21 L -20,-30.6" stroke="#2a1a2e" stroke-width="3" fill="none"/>
    <path d="M -21,-21 L -20,-30.6" stroke="#8a88a6" stroke-width="1.4" fill="none"/>
    <path d="M -28.8,-36.6 Q -30.6,-33.6 -27.6,-31.4 Q -24,-29.6 -18,-30 Q -13.2,-30.4 -12.6,-33 Z" fill="#3e3c52" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -28.8,-36.6 Q -30.6,-40.6 -29,-42.4 L -26.8,-41.8 Q -27.8,-39.4 -26.6,-34.8 Z" fill="#3e3c52" stroke="#2a1a2e" stroke-width="0.8"/>
    <g fill="#8a88a6"><circle cx="-25.4" cy="-32.6" r="0.6"/><circle cx="-22" cy="-32" r="0.6"/><circle cx="-18.6" cy="-32" r="0.6"/></g>
    <path d="M -27.4,-34.4 Q -22,-33 -14.6,-33.4" stroke="#5a5870" stroke-width="0.9" fill="none"/>

    <!-- the toad, squatting in the cab: back and warts, thigh, belly, eyes, smile -->
    <use href="#toad" fill="#5ea848" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#toadClip)">
      <path d="M -14,-32 C -10,-25 -2,-22 6,-22 L 8,-18 L -14,-18 Z" fill="#3f8f4a"/>
      <path d="M 4.6,-29.6 Q 9.6,-26 15,-30 L 16,-18 L 4,-18 Z" fill="#fff1d0"/>
      <path d="M 4.8,-29.4 Q 9.8,-25.8 15,-29.8" stroke="#efcf9e" stroke-width="0.8" fill="none"/>
    </g>
    <path d="M -9.4,-33.6 Q -6,-39.4 1,-40.6" stroke="#9edb6a" stroke-width="1.3" fill="none"/>
    <g fill="#3f8f4a" stroke="#2a1a2e" stroke-width="0.4">
      <circle cx="-7.4" cy="-31.4" r="1.4"/><circle cx="-6.6" cy="-36" r="1.1"/><circle cx="-9.6" cy="-26.4" r="1.1"/><circle cx="0.6" cy="-31" r="0.9"/>
    </g>
    <g fill="#9edb6a"><circle cx="-7.8" cy="-31.9" r="0.45"/><circle cx="-6.9" cy="-36.4" r="0.4"/></g>
    <!-- the toad's warty gland behind its eye -->
    <ellipse cx="-1" cy="-36.4" rx="3.6" ry="1.9" transform="rotate(-18 -1 -36.4)" fill="#4f9a3c" stroke="#2a1a2e" stroke-width="0.6"/>
    <path d="M -3.6,-36.6 Q -1.4,-38.4 1.4,-37.6" stroke="#7cc45a" stroke-width="0.7" fill="none"/>
    <!-- the thigh, folded under it, and its webbed foot on the frame -->
    <ellipse cx="-5" cy="-25.6" rx="6.4" ry="4.2" fill="#4f9a3c" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -7.6,-27.6 Q -4,-29.4 -0.4,-27.4" stroke="#7cc45a" stroke-width="0.9" fill="none"/>
    <path d="M -1.6,-22.6 Q 1,-23.6 3.4,-22.2 L 4.2,-21 L 2.4,-21.6 L 1.4,-20.8 L 0.4,-21.6 L -1.2,-21 Z" fill="#5ea848" stroke="#2a1a2e" stroke-width="0.7"/>
    <!-- the eyes: bulging domes, gold irises, the toad's sideways pupils -->
    <circle cx="2.2" cy="-41.4" r="3.6" fill="#4f9a3c" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="2.6" cy="-42" r="2.2" fill="#ffe14d" stroke="#2a1a2e" stroke-width="0.5"/>
    <ellipse cx="2.8" cy="-42" rx="1.2" ry="0.75" fill="#2a1a2e"/>
    <circle cx="2.2" cy="-42.8" r="0.5" fill="#ffffff"/>
    <circle cx="8.6" cy="-40.4" r="4.4" fill="#5ea848" stroke="#2a1a2e" stroke-width="0.9"/>
    <circle cx="9.2" cy="-41.2" r="2.9" fill="#ffe14d" stroke="#2a1a2e" stroke-width="0.6"/>
    <ellipse cx="9.6" cy="-41.2" rx="1.7" ry="1" fill="#2a1a2e"/>
    <circle cx="8.6" cy="-42.4" r="0.8" fill="#ffffff"/>
    <path d="M 5,-43.4 Q 8,-46.4 12.2,-43.6" stroke="#9edb6a" stroke-width="0.9" fill="none"/>
    <!-- the wide smile, a nostril and a blush -->
    <path d="M 14.6,-31.4 Q 11.4,-27.6 4.6,-29.6" stroke="#2a1a2e" stroke-width="0.9" fill="none"/>
    <circle cx="13.4" cy="-35" r="0.5" fill="#2a1a2e"/>
    <ellipse cx="10.2" cy="-32.8" rx="1.8" ry="1" fill="#ff8fa8" opacity="0.8"/>

    <!-- the hood: yellow paint, a copper coil wound round it, a bolt decal and the grille -->
    <use href="#hood" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#hoodClip)">
      <path d="M 4,-17.4 H 32 V -10 H 4 Z" fill="#b9822c"/>
      <g stroke="#2a1a2e" stroke-width="2.2" fill="none"><path d="M 9.4,-27 V -11 M 12,-27 V -11 M 14.6,-27 V -11"/></g>
      <g stroke="#d9824a" stroke-width="1.3" fill="none"><path d="M 9.4,-27 V -11 M 12,-27 V -11 M 14.6,-27 V -11"/></g>
      <g stroke="#ffc08a" stroke-width="0.6" fill="none"><path d="M 9,-24.4 V -22 M 11.6,-24.4 V -22 M 14.2,-24.4 V -22"/></g>
    </g>
    <path d="M 7.6,-23.6 Q 8,-24.2 9,-24.2 H 26" stroke="#fff3b0" stroke-width="1" fill="none"/>
    <path d="M 19.6,-23.4 L 17.4,-19 H 19.8 L 18,-14.6 L 22.6,-20.2 H 20.2 L 22,-23.4 Z" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.6"/>
    <rect x="26.8" y="-23" width="3.8" height="9.6" rx="0.8" fill="#3e3c52" stroke="#2a1a2e" stroke-width="0.7"/>
    <g stroke="#8a88a6" stroke-width="0.7"><path d="M 27.6,-21.4 H 29.8 M 27.6,-19.2 H 29.8 M 27.6,-17 H 29.8 M 27.6,-14.8 H 29.8"/></g>
    <!-- the toad's hands, gripping the hood's edge -->
    <path d="M 11.4,-26.6 Q 13.4,-27.4 15.6,-25.8" stroke="#2a1a2e" stroke-width="3.2" fill="none"/>
    <path d="M 11.4,-26.6 Q 13.4,-27.4 15.6,-25.8" stroke="#5ea848" stroke-width="1.8" fill="none"/>
    <g fill="#5ea848" stroke="#2a1a2e" stroke-width="0.5"><circle cx="15.6" cy="-25.2" r="1"/><circle cx="17.2" cy="-25" r="0.9"/></g>

    <!-- the magnet's post: a steel column on the hood, its collar under the swivel -->
    <path d="M 18.2,-25.2 V -33.4 H 21.8 V -25.2 Z" fill="#8a88a6" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 18.8,-32.4 V -25.6" stroke="#b4b2cc" stroke-width="0.8" fill="none"/>
    <path d="M 16.4,-33 H 23.6 L 22.6,-35.2 H 17.4 Z" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.7"/>
  </g>
</svg>
