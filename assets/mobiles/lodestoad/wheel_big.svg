<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="-16 -16 32 32">
  <!-- Lodestoad's drive wheel: a tall tractor tyre with chunky chevron lugs and a yellow rim. Origin
       = axle; spins (the lugs and the rim's bolts make rotation readable). -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="lug" d="M -2.4,-14.4 L 0,-12.2 L 2.4,-14.4 L 2.4,-12.6 L 0,-10.6 L -2.4,-12.6 Z"/>
  </defs>
  <g filter="url(#ol)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ring shading only: it spins, and a baked light would spin with it. -->
    <circle r="12.6" fill="#3e3c52"/>
    <g fill="#3e3c52" stroke="#2a1a2e" stroke-width="0.5">
      <use href="#lug"/><use href="#lug" transform="rotate(36)"/><use href="#lug" transform="rotate(72)"/><use href="#lug" transform="rotate(108)"/><use href="#lug" transform="rotate(144)"/>
      <use href="#lug" transform="rotate(180)"/><use href="#lug" transform="rotate(216)"/><use href="#lug" transform="rotate(252)"/><use href="#lug" transform="rotate(288)"/><use href="#lug" transform="rotate(324)"/>
    </g>
    <circle r="11.2" fill="#5a5870"/>
    <circle r="10" fill="#3e3c52"/>
    <circle r="7.4" fill="#b9822c" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle r="6.2" fill="#e9b949"/>
    <g stroke="#b9822c" stroke-width="1.4"><path d="M 0,-6 V 6 M -6,0 H 6 M -4.2,-4.2 L 4.2,4.2 M -4.2,4.2 L 4.2,-4.2"/></g>
    <circle r="3.4" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.7"/>
    <g fill="#fff1a8"><circle cx="0" cy="-4.8" r="0.8"/><circle cx="0" cy="4.8" r="0.8"/><circle cx="-4.8" cy="0" r="0.8"/><circle cx="4.8" cy="0" r="0.8"/></g>
    <circle r="1.6" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.6"/>
  </g>
</svg>
