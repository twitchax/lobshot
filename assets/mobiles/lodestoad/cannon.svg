<svg xmlns="http://www.w3.org/2000/svg" width="66" height="24" viewBox="-33 -12 66 24">
  <!-- Lodestoad's cannon: a big red horseshoe magnet on a swivel, its open end forward, silver
       poles crackling with a spark between them. Origin = pivot (the swivel); drawn at aim 0
       (pointing +x). Muzzle = (26, 0), between the poles. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.79" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="shoe" d="M 18,-8 H 5 A 8 8 0 0 0 5,8 H 18 V 2.8 H 5 A 2.8 2.8 0 0 1 5,-2.8 H 18 Z"/>
    <clipPath id="shoeClip"><use href="#shoe"/></clipPath>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the horseshoe: painted red, its underside in shadow, a shine along its top arm -->
    <use href="#shoe" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#shoeClip)">
      <path d="M -6,4.6 H 20 V 10 H -6 Z" fill="#b93a2c"/>
      <path d="M -6,-1 Q -4,4 2,5 L -6,8 Z" fill="#b93a2c"/>
    </g>
    <path d="M 5.6,-6.4 H 16.4" stroke="#ff8a7a" stroke-width="1.2" fill="none"/>
    <path d="M -1.4,-3.6 A 6.2 6.2 0 0 1 2.6,-6.2" stroke="#ff8a7a" stroke-width="1.1" fill="none"/>
    <!-- the silver poles -->
    <rect x="17.4" y="-8" width="6.4" height="5.2" rx="0.8" fill="#e6f0ff" stroke="#2a1a2e" stroke-width="0.9"/>
    <rect x="17.4" y="2.8" width="6.4" height="5.2" rx="0.8" fill="#b4b2cc" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 18.6,-6.8 H 22.6" stroke="#ffffff" stroke-width="0.9"/>
    <path d="M 18.6,6.8 H 22.6" stroke="#8a88a6" stroke-width="0.9"/>
    <!-- the spark it holds between its poles: where shots leave -->
    <circle cx="26" cy="0" r="2.6" fill="#8ff0ff" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 23.4,-3 L 25,-1 L 24,0.6 L 26.4,1.6 M 26,-2.4 L 27.6,-0.4" stroke="#e6fdff" stroke-width="0.8" fill="none"/>
    <!-- the swivel: a steel hub and its bolt -->
    <circle r="3.6" fill="#8a88a6" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle r="1.4" fill="#5a5870"/>
  </g>
</svg>
