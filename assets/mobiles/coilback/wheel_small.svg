<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="-7 -7 14 14">
  <!-- Road wheel. Origin = axle; spins. -->
  <defs>
    <!-- Outline: the silhouette's alpha blurred, then thresholded low, grows it by about 0.7 units
         with round corners (feMorphology's square kernel left square ones at sharp joins), and is
         filled dark behind the art. -->
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.43" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)">
    <!-- Ring shading only: it spins. -->
    <circle r="5" fill="#433a59"/>
    <circle r="4.2" fill="#5b5075"/>
    <circle r="3.4" fill="#2bb3a3" stroke="#2a1a2e" stroke-width="0.6"/>
    <rect x="-0.55" y="-3" width="1.1" height="6" fill="#1d5f66"/>
    <rect x="-3" y="-0.55" width="6" height="1.1" fill="#1d5f66"/>
    <circle r="1.1" fill="#2a1a2e"/>
  </g>
</svg>
