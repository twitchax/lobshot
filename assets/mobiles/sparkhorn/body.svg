<svg xmlns="http://www.w3.org/2000/svg" width="72" height="64" viewBox="-36 -62 72 64">
  <!-- Sparkhorn body: a rhino beetle that rolls on its legs. Capacitor, wing cases, near legs
       (each ends at a wheel axle), thorax shield with its short horn, neck, saddle, switch. The
       head and its tesla-coil horn are the cannon. Origin = ground contact center (= rig.ron body frame).
       Light from upper-left. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="elytra" d="M -31,-22 C -33,-38 -22,-53 -8,-53 C 5,-53 13,-44 14,-31 L 14,-20 C 1,-16.6 -20,-16.6 -31,-22 Z"/>
    <clipPath id="elytraClip"><use href="#elytra"/></clipPath>
    <path id="shield" d="M 7,-39 C 12,-43.4 19,-41 22.6,-35 C 25,-31 25,-25 22,-20 L 8,-18 Z"/>
    <clipPath id="shieldClip"><use href="#shield"/></clipPath>
    <radialGradient id="shellLight" cx="-16" cy="-46" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8c4ff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#a8c4ff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#0d1226" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1226" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- capacitor stack at the back: insulator discs and a copper cap -->
    <g transform="translate(-24,-44) rotate(-28)">
      <rect x="-2.2" y="-12" width="4.4" height="12" fill="#a85e30" stroke="#2a1a2e" stroke-width="0.8"/>
      <rect x="-4" y="-4.4" width="8" height="2.2" rx="1.1" fill="#f2ead8" stroke="#2a1a2e" stroke-width="0.7"/>
      <rect x="-3.6" y="-8" width="7.2" height="2.2" rx="1.1" fill="#f2ead8" stroke="#2a1a2e" stroke-width="0.7"/>
      <rect x="-3.2" y="-11.6" width="6.4" height="2.2" rx="1.1" fill="#f2ead8" stroke="#2a1a2e" stroke-width="0.7"/>
      <circle cy="-14.4" r="2.8" fill="#8ff0ff" stroke="#2a1a2e" stroke-width="0.8"/>
      <circle cx="-0.8" cy="-15.2" r="0.9" fill="#ffffff"/>
    </g>

    <!-- wing cases: midnight blue with an electric sheen -->
    <use href="#elytra" fill="#3a4a86" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#elytraClip)">
      <path d="M -40,-27 C -26,-22 -6,-21 20,-26 V -10 H -40 Z" fill="#283563"/>
      <path d="M -30,-34 C -26,-44 -16,-49 -4,-49.6 C 4,-50 9,-46 11,-42" stroke="#4fd1c5" stroke-width="3.2" fill="none" opacity="0.85"/>
      <path d="M -29,-38 C -25,-46 -16,-50.6 -6,-51" stroke="#a8c4ff" stroke-width="1.2" fill="none"/>
      <path d="M -30,-27 C -20,-24 -4,-24 12,-27" stroke="#1b2445" stroke-width="1" fill="none"/>
      <path d="M -26,-31 C -16,-28.6 -2,-28.6 12,-31.6" stroke="#6f86d0" stroke-width="0.7" fill="none"/>
      <rect x="-34" y="-56" width="50" height="40" fill="url(#shellLight)"/>
    </g>
    <ellipse cx="-17" cy="-44" rx="3.4" ry="1.6" transform="rotate(-35 -17 -44)" fill="#e6f0ff"/>
    <circle cx="-12" cy="-48" r="0.8" fill="#e6f0ff"/>
    <!-- a lightning-bolt decal and the team roundel -->
    <path d="M -2,-41 L -6.4,-34 L -3.2,-34 L -5.6,-27.6 L 1,-36 L -2.4,-36 L 0.4,-41 Z" fill="#ffe14d" stroke="#2a1a2e" stroke-width="0.6"/>
    <circle cx="-18" cy="-30" r="3" fill="#d98a4a" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="-18" cy="-30" r="2" fill="#e8434f"/>
    <path transform="translate(-18,-30) scale(0.42)" d="M 0.9,0 A 0.9 0.9 0 0 0 -0.9,0 A 1.8 1.8 0 0 0 2.7,0 A 2.7 2.7 0 0 0 -2.7,0 A 3.6 3.6 0 0 0 4.5,0" stroke="#fff1d0" stroke-width="1.6" fill="none"/>

    <!-- near legs, each down to a wheel axle -->
    <path d="M -16,-19 L -24,-21 L -23,-7" stroke="#2a1a2e" stroke-width="5.4" fill="none"/>
    <path d="M -16,-19 L -24,-21 L -23,-7" stroke="#3a4a86" stroke-width="3.8" fill="none"/>
    <circle cx="-24" cy="-21" r="2.2" fill="#d98a4a" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M -2,-17 L -1,-12 L 0,-7" stroke="#2a1a2e" stroke-width="5.4" fill="none"/>
    <path d="M -2,-17 L -1,-12 L 0,-7" stroke="#3a4a86" stroke-width="3.8" fill="none"/>
    <path d="M 13,-19 L 18,-16 L 23,-7" stroke="#2a1a2e" stroke-width="5.4" fill="none"/>
    <path d="M 13,-19 L 18,-16 L 23,-7" stroke="#3a4a86" stroke-width="3.8" fill="none"/>
    <circle cx="18" cy="-16" r="2.2" fill="#d98a4a" stroke="#2a1a2e" stroke-width="0.7"/>

    <!-- thorax shield and its short horn, hooked forward -->
    <path d="M 10.6,-40 C 12.4,-46.4 19.6,-50.6 29.4,-48.6 C 24,-47.4 20.6,-44.6 19.2,-39.4 Z" fill="#283563" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 13.4,-43.6 C 15.8,-47 20.6,-48.8 26,-48.6" stroke="#6f86d0" stroke-width="0.9" fill="none"/>
    <use href="#shield" fill="#3a4a86" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#shieldClip)">
      <path d="M 4,-26 C 12,-24 20,-25 28,-29 V -14 H 4 Z" fill="#283563"/>
      <path d="M 9,-38.4 C 13,-41 18,-39.6 21,-35" stroke="#a8c4ff" stroke-width="1.1" fill="none"/>
    </g>
    <path d="M 8,-38 L 8,-19" stroke="#1b2445" stroke-width="1.2"/>

    <!-- neck: the head (the cannon) turns on it -->
    <ellipse cx="22" cy="-22" rx="4.6" ry="6" fill="#1b2445" stroke="#2a1a2e" stroke-width="0.9"/>

    <!-- knife switch for the rider's hands -->
    <path d="M -3,-52 L -3.6,-59.6" stroke="#2a1a2e" stroke-width="2.6" fill="none"/>
    <path d="M -3,-52 L -3.6,-59.6" stroke="#d98a4a" stroke-width="1.2" fill="none"/>
    <circle cx="-3.7" cy="-60.2" r="1.8" fill="#8ff0ff" stroke="#2a1a2e" stroke-width="0.8"/>
    <!-- saddle -->
    <path d="M -17,-52.6 Q -10,-56.6 -3,-53.1 Q -3,-50.6 -10,-50.6 Q -17,-50.6 -17,-52.6 Z" fill="#d98a4a" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -15,-53.2 Q -10,-55.2 -5.5,-53.4" stroke="#ffc08a" stroke-width="0.9" fill="none"/>
  </g>
</svg>
