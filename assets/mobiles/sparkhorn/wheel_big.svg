<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="-10 -10 20 20">
  <!-- Drive wheel. Origin = axle; spins (spokes + bolts make rotation readable). -->
  <defs>
    <!-- Outline: the silhouette's alpha blurred, then thresholded low, grows it by about 0.8 units
         with round corners (feMorphology's square kernel left square ones at sharp joins), and is
         filled dark behind the art. -->
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.49" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linecap="round">
    <!-- Shading is in rings, never crescents: the wheel spins, and a baked light would spin with it. -->
    <circle r="7.9" fill="#433a59"/>
    <circle r="6.9" fill="#5b5075"/>
    <circle r="5.8" fill="#b9822c" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle r="4.8" fill="#e9b949"/>
    <g stroke="#8a5a22" stroke-width="1.3"><path d="M 0,-4.8 V 4.8 M -4.8,0 H 4.8"/></g>
    <g fill="#fff1a8"><circle cx="0" cy="-3.6" r="0.75"/><circle cx="0" cy="3.6" r="0.75"/><circle cx="-3.6" cy="0" r="0.75"/><circle cx="3.6" cy="0" r="0.75"/></g>
    <circle r="2.2" fill="#2bb3a3" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle r="0.9" fill="#1d7f80"/>
  </g>
</svg>
