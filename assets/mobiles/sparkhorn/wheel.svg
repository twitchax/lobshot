<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="-8 -8 16 16">
  <!-- Sparkhorn's foot wheel. Origin = axle; spins (the spokes make rotation readable). -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.49" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linecap="round">
    <!-- Ring shading only: it spins, and a baked light would spin with it. -->
    <circle r="6.6" fill="#2e2a40"/>
    <circle r="5.6" fill="#433a59"/>
    <circle r="4.4" fill="#a85e30" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle r="3.6" fill="#d98a4a"/>
    <g stroke="#2a1a2e" stroke-width="1"><path d="M 0,-3.6 V 3.6 M -3.1,-1.8 L 3.1,1.8 M -3.1,1.8 L 3.1,-1.8"/></g>
    <circle r="1.7" fill="#8ff0ff" stroke="#2a1a2e" stroke-width="0.6"/>
  </g>
</svg>
