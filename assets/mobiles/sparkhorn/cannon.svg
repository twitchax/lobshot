<svg xmlns="http://www.w3.org/2000/svg" width="44" height="22" viewBox="-11 -11 44 22">
  <!-- Sparkhorn's head and tesla-coil horn: the beetle raises its head to aim. Origin = pivot (the
       head's center, on the neck); drawn at aim 0 (pointing +x). Muzzle = (27.6, 0), the
       discharge ball. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.79" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="horn" d="M 4,-5.4 C 11,-5 18,-3.8 24.6,-2.2 L 24.6,2.2 C 18,3.6 11,4.8 4,5.4 Z"/>
    <clipPath id="hornClip"><use href="#horn"/></clipPath>
    <clipPath id="headClip"><circle r="7.4"/></clipPath>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- mandibles, under the horn -->
    <path d="M 4.8,4.4 C 7.4,5 8.8,6.4 8.6,8.2 M 1.6,6 C 2.6,6.6 3,7.2 2.8,7.8" stroke="#2a1a2e" stroke-width="2.4" fill="none"/>
    <path d="M 4.8,4.4 C 7.4,5 8.8,6.4 8.6,8.2 M 1.6,6 C 2.6,6.6 3,7.2 2.8,7.8" stroke="#d98a4a" stroke-width="1.1" fill="none"/>
    <!-- the horn: a copper coil wound on a midnight core -->
    <use href="#horn" fill="#283563" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#hornClip)">
      <path d="M 9,6 L 11,-6 M 12,6 L 14,-6 M 15,6 L 17,-6 M 18,6 L 20,-6 M 21,6 L 23,-6" stroke="#d98a4a" stroke-width="1.7"/>
      <path d="M 4,2 C 11,2.6 18,1.8 26,0.8 V 6 H 4 Z" fill="#0d1226" opacity="0.35"/>
      <path d="M 6,-3.8 C 12,-3.6 18,-2.6 23.6,-1.6" stroke="#ffc08a" stroke-width="0.8" fill="none"/>
    </g>
    <rect x="6" y="-6" width="2.6" height="12" rx="1.2" fill="#f2ead8" stroke="#2a1a2e" stroke-width="0.8"/>
    <rect x="22.4" y="-3.4" width="2.2" height="6.8" rx="1" fill="#f2ead8" stroke="#2a1a2e" stroke-width="0.7"/>
    <!-- discharge ball -->
    <circle cx="27.6" r="3.8" fill="#8ff0ff" stroke="#2a1a2e" stroke-width="0.9"/>
    <circle cx="27.6" r="2.2" fill="#e6fdff"/>
    <circle cx="26.4" cy="-1.4" r="0.9" fill="#ffffff"/>
    <!-- the head, and its big glowing eye -->
    <circle r="7.4" fill="#3a4a86" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#headClip)">
      <path d="M -8,2.6 C -3,5 3,5 8,2 V 8 H -8 Z" fill="#283563"/>
      <path d="M -5.6,-3.2 A 6.2 6.2 0 0 1 -1.4,-6.2" stroke="#a8c4ff" stroke-width="1.1" fill="none"/>
    </g>
    <circle cx="-0.2" cy="0.4" r="3.8" fill="#8ff0ff" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="0.8" cy="0.6" r="2.2" fill="#1b2445"/>
    <circle cx="1.5" cy="-0.4" r="0.9" fill="#ffffff"/>
    <circle cx="-0.3" cy="1.8" r="0.45" fill="#e6fdff"/>
  </g>
</svg>
