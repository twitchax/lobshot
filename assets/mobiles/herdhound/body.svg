<svg xmlns="http://www.w3.org/2000/svg" width="76" height="66" viewBox="-46 -62 76 66">
  <!-- Herdhound body: a shaggy sheepdog on a pull-toy chassis. The wind-up key at its rump, the
       steel skirt, the coat (cream, with the breed's slate saddle over the back and rump), the
       herding whistle, the rider's saddle and the shepherd's-crook lever. The head is the cannon,
       the collar its own part over the neck joint; the wheels spin.
       Origin = ground contact center (= rig.ron body frame). Light from upper-left. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- the coat, piece by piece: rump, back, chest and neck, a leg over each wheel with locks at
         its hem, a belly tucked up between them, a tousled rump and the ruff at its chest -->
    <circle id="rump" cx="-20" cy="-35" r="13.5"/>
    <circle id="back" cx="-5" cy="-37" r="13"/>
    <circle id="chest" cx="8" cy="-30" r="11"/>
    <circle id="neck" cx="18.5" cy="-39.5" r="6.5"/>
    <ellipse id="belly" cx="-2" cy="-26" rx="22" ry="7.4"/>
    <path id="hind" d="M -30.6,-30 L -30.8,-14 Q -30.4,-9.4 -27.4,-10.4 Q -25.6,-13.2 -24,-10.2 Q -21.8,-7.6 -19.8,-10.4 Q -18,-13 -16.4,-10.2 Q -14.2,-7.8 -12.4,-10.8 Q -10.4,-13 -9.4,-16 L -9,-30 Z"/>
    <path id="fore" d="M 6,-27 L 6.4,-15 Q 7,-10.2 9.6,-10.8 Q 11.2,-13.2 12.8,-10.2 Q 15,-7.6 17,-10.4 Q 18.8,-13 20.4,-10.2 Q 22.6,-7.8 24.4,-10.8 Q 26.6,-12.6 26.4,-16 L 25.6,-27 Z"/>
    <path id="tuck" d="M -10,-24 L -9.6,-18 Q -7.6,-15.6 -6,-18.2 Q -4,-15.4 -2,-18.2 Q 0,-15.6 2,-18.2 Q 4,-15.4 6,-18 L 6.4,-24 Z"/>
    <path id="tousle" d="M -32,-40 Q -35.6,-45.4 -31,-46.6 Q -30.6,-51.6 -25.8,-50.4 Q -23.6,-54.4 -19.4,-51.8 Q -16,-52.6 -15,-48 Z"/>
    <path id="ruff" d="M 14,-28.6 Q 20,-29.4 23.6,-27.4 Q 28.4,-27 27.4,-23.4 Q 30,-21 26.8,-18.6 L 14,-18 Z"/>
    <g id="coat">
      <use href="#rump"/><use href="#back"/><use href="#chest"/><use href="#neck"/><use href="#belly"/>
      <use href="#hind"/><use href="#fore"/><use href="#tuck"/><use href="#tousle"/><use href="#ruff"/>
    </g>
    <clipPath id="coatClip">
      <use href="#rump"/><use href="#back"/><use href="#chest"/><use href="#neck"/><use href="#belly"/>
      <use href="#hind"/><use href="#fore"/><use href="#tuck"/><use href="#tousle"/><use href="#ruff"/>
    </clipPath>
    <radialGradient id="coatLight" cx="-16" cy="-46" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#3a2a40" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2a40" stop-opacity="0.25"/>
    </radialGradient>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- wind-up key in the rump: brass, its bow turned edge-on -->
    <path d="M -38.6,-32.4 H -31 V -30 H -38.6 Z" fill="#b9822c" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M -38.6,-32.4 H -31 V -31.6 H -38.6 Z" fill="#fff1a8"/>
    <g fill="#e9b949" stroke="#2a1a2e" stroke-width="0.8">
      <circle cx="-41.4" cy="-35.2" r="3.2"/>
      <circle cx="-41.4" cy="-27.2" r="3.2"/>
      <rect x="-42.6" y="-34" width="2.6" height="5.6" rx="0.8"/>
    </g>
    <circle cx="-41.4" cy="-35.2" r="1.1" fill="#2a1a2e"/>
    <circle cx="-41.4" cy="-27.2" r="1.1" fill="#2a1a2e"/>
    <path d="M -43.4,-36.6 A 2.4 2.4 0 0 1 -41.6,-37.8" stroke="#fff1a8" stroke-width="0.8" fill="none"/>

    <!-- steel skirt, under the coat's fringe -->
    <path d="M -28,-16 H 25 Q 28,-16 28,-13.4 V -11.6 Q 28,-9 25,-9 H -28 Q -31,-9 -31,-11.6 V -13.4 Q -31,-16 -28,-16 Z" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -29,-14.4 H 26" stroke="#8a88a6" stroke-width="0.8"/>

    <!-- the coat: an outline pass, then the fills over it, so only its outer edge is inked -->
    <use href="#coat" stroke="#2a1a2e" stroke-width="2"/>
    <use href="#coat" fill="#f6f0e2"/>
    <g clip-path="url(#coatClip)">
      <!-- cream underside and fringe, away from the light -->
      <path d="M -40,-21 C -20,-18 4,-18 32,-23 V 0 H -40 Z" fill="#ddd0b8"/>
      <path d="M -40,-13.8 C -20,-11.4 4,-11.4 32,-14.4 V 0 H -40 Z" fill="#b8a688"/>
      <path d="M -11,-30 Q -8,-22 -9.4,-12 H -6 V -30 Z M 8,-30 Q 4.6,-22 6.4,-12 H 2 V -30 Z" fill="#ddd0b8"/>
      <path d="M 16,-36 C 20,-31 22,-26 22,-18 H 34 V -36 Z" fill="#ddd0b8"/>
      <!-- the slate saddle over the back and rump, its edge ragged with locks -->
      <path d="M 5,-60 C 4,-52 2,-46 0,-42 Q 3,-38 -1.2,-36.4 Q 0.8,-32.6 -3.6,-32 Q -2.6,-28 -7.4,-28.6 Q -8.2,-24.6 -12.2,-26.4 Q -14.6,-22.8 -17.6,-25.4 Q -21,-22.2 -23.6,-25 Q -27,-22.2 -29.4,-25.2 Q -32.8,-22.6 -34,-26 L -40,-26 V -60 Z" fill="#8a88a6"/>
      <path d="M -40,-31 C -30,-28 -18,-28.4 -8,-31.6 Q -2.6,-28 -7.4,-28.6 Q -8.2,-24.6 -12.2,-26.4 Q -14.6,-22.8 -17.6,-25.4 Q -21,-22.2 -23.6,-25 Q -27,-22.2 -29.4,-25.2 Q -32.8,-22.6 -34,-26 L -40,-26 Z" fill="#6c6a86"/>
      <!-- locks: light strands where the light falls, dark ones in the shade -->
      <path d="M -27,-45 Q -24.8,-41.4 -25.6,-37.6 M -19,-47 Q -16.8,-43.4 -17.6,-39.6 M -10,-48 Q -7.8,-44.4 -8.6,-40.6 M -31,-37 Q -29.4,-33.4 -30.2,-30.4" stroke="#b4b2cc" stroke-width="0.9" fill="none"/>
      <path d="M -22,-35 Q -20.4,-32 -21.2,-29 M -14,-37 Q -12.4,-34 -13.2,-31 M -4,-41 Q -2.4,-38 -3.4,-35" stroke="#6c6a86" stroke-width="0.8" fill="none"/>
      <path d="M 4,-34 Q 5.8,-30.4 5,-26.6 M 20,-28 Q 21.6,-24.6 20.8,-21.4 M -4,-27 Q -2.4,-24 -3.2,-21 M 8,-25 Q 9.6,-22 8.8,-19" stroke="#ddd0b8" stroke-width="0.8" fill="none"/>
      <path d="M -26,-12.6 Q -25,-15 -25.6,-17.2 M -20,-12 Q -19,-14.4 -19.6,-16.6 M -14,-12.4 Q -13,-14.8 -13.6,-17 M 11,-12.4 Q 12,-14.8 11.4,-17 M 17,-12 Q 18,-14.4 17.4,-16.6 M 23,-12.6 Q 24,-15 23.4,-17.2" stroke="#9a8a70" stroke-width="0.7" fill="none"/>
      <path d="M -29,-44 C -25,-48.6 -15,-50.2 -7,-48.2" stroke="#d4d2e6" stroke-width="1.3" fill="none"/>
      <path d="M 9,-42 C 11,-44.6 14,-45.8 17,-45.6" stroke="#ffffff" stroke-width="1.3" fill="none"/>
      <rect x="-40" y="-60" width="72" height="60" fill="url(#coatLight)"/>
    </g>

    <!-- team roundel on the saddle -->
    <circle cx="-20" cy="-36" r="3" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="-20" cy="-36" r="2" fill="#e8434f"/>
    <path transform="translate(-20,-36) scale(0.42)" d="M 0.9,0 A 0.9 0.9 0 0 0 -0.9,0 A 1.8 1.8 0 0 0 2.7,0 A 2.7 2.7 0 0 0 -2.7,0 A 3.6 3.6 0 0 0 4.5,0" stroke="#fff1d0" stroke-width="1.6" fill="none"/>

    <!-- the herding whistle, on the collar's ring (the collar is its own part, over the neck) -->
    <circle cx="16.4" cy="-30.6" r="1.5" fill="none" stroke="#2a1a2e" stroke-width="1.8"/>
    <circle cx="16.4" cy="-30.6" r="1.5" fill="none" stroke="#e9b949" stroke-width="0.8"/>
    <circle cx="16.8" cy="-25.6" r="3.2" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 16.8,-25.6 m -3.2,0 a 3.2 3.2 0 0 0 6.4,0 Z" fill="#b9822c"/>
    <path d="M 19.4,-28.2 L 24.2,-28.4 Q 25,-28.4 25,-27.6 V -26.6 Q 25,-25.8 24.2,-25.8 L 19.8,-25.6 Z" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 19.6,-26.6 H 24.8 V -26 L 19.8,-25.8 Z" fill="#b9822c"/>
    <rect x="17.2" y="-28" width="2.4" height="1.1" rx="0.4" fill="#2a1a2e"/>
    <path d="M 14.6,-27.4 A 2.4 2.4 0 0 1 16.6,-28.4" stroke="#fff1a8" stroke-width="0.8" fill="none"/>

    <!-- axle bosses -->
    <rect x="-22" y="-10.4" width="6" height="3.4" rx="0.8" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.7"/>
    <rect x="14" y="-10.4" width="6" height="3.4" rx="0.8" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.7"/>

    <!-- the shepherd's crook, for the rider's hands -->
    <path d="M -3,-47 L -4.4,-55.6 C -5,-59.8 -0.4,-61.2 1,-58.2 C 1.8,-56.6 0.8,-55 -0.6,-55.4" stroke="#2a1a2e" stroke-width="2.6" fill="none"/>
    <path d="M -3,-47 L -4.4,-55.6 C -5,-59.8 -0.4,-61.2 1,-58.2 C 1.8,-56.6 0.8,-55 -0.6,-55.4" stroke="#e9b949" stroke-width="1.2" fill="none"/>
    <!-- saddle on the back -->
    <path d="M -21,-48.2 Q -13,-52.6 -5,-49.2 Q -5,-46.6 -12.6,-46.4 Q -20,-46.4 -21,-48.2 Z" fill="#8a4b2e" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -19,-48.8 Q -13,-51 -7.6,-49.2" stroke="#c97a4a" stroke-width="0.9" fill="none"/>
  </g>
</svg>
