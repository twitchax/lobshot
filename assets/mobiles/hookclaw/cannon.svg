<svg xmlns="http://www.w3.org/2000/svg" width="46" height="22" viewBox="-7 -11 46 22">
  <!-- Hookclaw's big claw, a crescent boomerang in its grip. Origin = pivot (shoulder joint
       center); drawn at aim 0 (pointing +x). Muzzle = (31, 0), the boomerang. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.79" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- palm, then the fixed finger above and the hinged one below, tips meeting at the boomerang -->
    <path id="palm" d="M 9.4,-5 C 11,-8.6 19,-9.4 23,-7 C 25.6,-5.6 27.6,-3.6 28.4,-1.4 C 26.4,-1.8 24.4,-1.8 22.6,-1.2 L 22.6,1.2 C 24.4,1.8 26,2 27.6,2.8 C 26,4.8 24,6 22,6.6 C 18,8.6 11,8 9.4,5 Z"/>
    <clipPath id="palmClip"><use href="#palm"/></clipPath>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the crescent boomerang, gripped at its back -->
    <path d="M 27,-8.4 A 8.4 8.4 0 0 1 27,8.4 A 10.6 10.6 0 0 0 27,-8.4 Z" fill="#ffcf3a" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 28.4,-6.6 A 6.6 6.6 0 0 1 34,-1.4" stroke="#fff0a8" stroke-width="1.1" fill="none"/>
    <path d="M 33.6,2 A 6.6 6.6 0 0 1 28.6,6.8" stroke="#e6a419" stroke-width="1.4" fill="none"/>
    <path d="M 33.2,-0.9 L 33.2,0.9" stroke="#e8434f" stroke-width="1.8"/>
    <!-- arm -->
    <rect x="2" y="-3.8" width="10" height="7.6" rx="2" fill="#ec5b44" stroke="#2a1a2e" stroke-width="0.9"/>
    <rect x="2.4" y="1" width="9.2" height="2.4" fill="#b93a2c"/>
    <path d="M 3.6,-2.4 H 10" stroke="#ff9a7e" stroke-width="0.9"/>
    <rect x="7" y="-4.2" width="2.4" height="8.4" rx="0.8" fill="#2f62c8" stroke="#2a1a2e" stroke-width="0.7"/>
    <!-- palm and fingers -->
    <use href="#palm" fill="#ec5b44" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#palmClip)">
      <path d="M 6,2.4 C 12,4.4 20,4 30,1 V 11 H 6 Z" fill="#b93a2c"/>
      <path d="M 23.6,-6.6 L 30,-1 V -11 Z M 23,6.4 L 30,1.6 V 11 Z" fill="#5a1f2a"/>
      <path d="M 21,1.2 C 19,3 16,4.6 12,5" stroke="#7f2520" stroke-width="0.8" fill="none"/>
    </g>
    <path d="M 11.4,-6 C 14,-7.6 19.4,-7.8 22.4,-6" stroke="#ff9a7e" stroke-width="1.1" fill="none"/>
    <circle cx="14.4" cy="-1.6" r="0.85" fill="#7f2520"/><circle cx="17.6" cy="-2.2" r="0.85" fill="#7f2520"/><circle cx="20.4" cy="-3.4" r="0.7" fill="#7f2520"/>
    <!-- shoulder -->
    <circle r="5" fill="#ec5b44" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 5,0 A 5 5 0 0 1 -5,0 A 5.5 3.8 0 0 0 5,0 Z" fill="#b93a2c"/>
    <circle r="1.9" fill="#2f62c8" stroke="#2a1a2e" stroke-width="0.6"/>
    <path d="M -3.6,-1.8 A 4 4 0 0 1 -1.2,-3.8" stroke="#ffd1c0" stroke-width="1" fill="none"/>
  </g>
</svg>
