<svg xmlns="http://www.w3.org/2000/svg" width="72" height="62" viewBox="-36 -60 72 62">
  <!-- Hookclaw body: a hermit crab living in a glazed jar on its side. Far legs, jar, the dark
       mouth, the crab's face, near legs, saddle, lever. The big claw is the cannon; the jar's lip
       is lip.svg, drawn over the claw.
       Origin = ground contact center (= rig.ron body frame). Light from upper-left. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- the jar: a round belly, a pinched neck, mouth forward -->
    <path id="jar" d="M -10,-52 C 0,-52 6,-46 8,-39 C 9.4,-37 10.6,-36.6 12,-36.6 L 12,-21.4 C 10.6,-21.4 9.4,-21 8,-19 C 6,-12 0,-8 -10,-8 C -24,-8 -32,-17 -32,-30 C -32,-43 -24,-52 -10,-52 Z"/>
    <radialGradient id="jarLight" cx="-18" cy="-44" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#3a2a40" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2a40" stop-opacity="0.28"/>
    </radialGradient>
    <clipPath id="jarClip"><use href="#jar"/></clipPath>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- far legs -->
    <path d="M 14,-14 L 21,-19 L 23,-1.6" stroke="#2a1a2e" stroke-width="5.2" fill="none"/>
    <path d="M 14,-14 L 21,-19 L 23,-1.6" stroke="#b93a2c" stroke-width="3.6" fill="none"/>
    <path d="M 2,-12 L -13,-16 L -19,-1.6" stroke="#2a1a2e" stroke-width="5.2" fill="none"/>
    <path d="M 2,-12 L -13,-16 L -19,-1.6" stroke="#b93a2c" stroke-width="3.6" fill="none"/>

    <!-- the jar: cream glaze, cobalt bands, a wave band -->
    <use href="#jar" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#jarClip)">
      <path d="M -40,-24 C -28,-19 -8,-17 16,-22 V 0 H -40 Z" fill="#ddd0b8"/>
      <path d="M -40,-15 C -28,-11 -8,-10 16,-14 V 0 H -40 Z" fill="#b8a688" opacity="0.6"/>
      <!-- bands wrap the girth, so they bow with it -->
      <path d="M -22,-60 C -27.4,-44 -27.4,-16 -22,0" stroke="#2f62c8" stroke-width="3.6" fill="none"/>
      <path d="M 4,-60 C 7,-44 7,-16 4,0" stroke="#2f62c8" stroke-width="3.6" fill="none"/>
      <path d="M -15,-60 C -18,-44 -18,-16 -15,0 M -2,-60 C 0,-44 0,-16 -2,0" stroke="#2f62c8" stroke-width="1" fill="none"/>
      <path d="M -15.6,-38 q 1.6,-2.2 3.2,0 t 3.2,0 t 3.2,0 t 3.2,0 M -16,-30 q 1.6,-2.2 3.2,0 t 3.2,0 t 3.2,0 t 3.2,0 M -16,-22 q 1.6,-2.2 3.2,0 t 3.2,0 t 3.2,0 t 3.2,0" stroke="#2f62c8" stroke-width="1" fill="none"/>
      <path d="M -26.6,-38 C -24.6,-46 -18,-50.4 -10,-50.6" stroke="#ffffff" stroke-width="1.8" fill="none"/>
      <path d="M 8.6,-37 C 9.6,-30 9.6,-26 8.6,-21" stroke="#b8a688" stroke-width="1.4" fill="none"/>
      <rect x="-34" y="-54" width="48" height="48" fill="url(#jarLight)"/>
    </g>
    <!-- the jar's foot ring, at its back -->
    <path d="M -30.4,-38 C -32.6,-33 -32.6,-27 -30.4,-22" stroke="#2a1a2e" stroke-width="3.4" fill="none"/>
    <path d="M -30.4,-38 C -32.6,-33 -32.6,-27 -30.4,-22" stroke="#2f62c8" stroke-width="1.8" fill="none"/>
    <ellipse cx="-21" cy="-44" rx="2.6" ry="1.4" transform="rotate(-40 -21 -44)" fill="#ffffff"/>
    <!-- the dark mouth; its lip is its own part, drawn over the claw's shoulder so the claw and
         the face come out of the jar -->
    <ellipse cx="14.6" cy="-29" rx="2.6" ry="10.6" fill="#4a2a3a" stroke="#2a1a2e" stroke-width="0.8"/>
    <!-- team roundel -->
    <circle cx="-9" cy="-31" r="3" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="-9" cy="-31" r="2" fill="#e8434f"/>
    <path transform="translate(-9,-31) scale(0.42)" d="M 0.9,0 A 0.9 0.9 0 0 0 -0.9,0 A 1.8 1.8 0 0 0 2.7,0 A 2.7 2.7 0 0 0 -2.7,0 A 3.6 3.6 0 0 0 4.5,0" stroke="#fff1d0" stroke-width="1.6" fill="none"/>

    <!-- face: a coral shell-plate leaning out of the mouth, eyes on stalks -->
    <path d="M 13,-28.4 C 18,-30.6 26.4,-29.6 29.4,-23.4 C 31.4,-18 27.6,-12.8 21,-12.4 C 16.6,-12.2 13,-13.8 13,-16 Z" fill="#ec5b44" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 13,-19 C 18,-15.6 25,-15 30.4,-19.6 C 29.6,-15.2 26,-12.6 21,-12.4 C 16.6,-12.2 13,-13.8 13,-16 Z" fill="#b93a2c"/>
    <path d="M 15.6,-27 C 20,-28.4 24.8,-27.2 27,-24" stroke="#ff9a7e" stroke-width="1.1" fill="none"/>
    <path d="M 18.8,-26.6 L 18.8,-28.6 M 22.4,-25.6 L 22.6,-26.6" stroke="#2a1a2e" stroke-width="2.6"/>
    <path d="M 18.8,-26.6 L 18.8,-28.6 M 22.4,-25.6 L 22.6,-26.6" stroke="#ec5b44" stroke-width="1.3"/>
    <circle cx="19" cy="-29.8" r="2.1" fill="#ffffff" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle cx="19.6" cy="-29.7" r="1.2" fill="#2a1a2e"/>
    <circle cx="22.6" cy="-28.1" r="2.3" fill="#ffffff" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle cx="23.3" cy="-28" r="1.35" fill="#2a1a2e"/>
    <circle cx="23.6" cy="-28.6" r="0.45" fill="#ffffff"/>
    <!-- mouth parts and a grin -->
    <path d="M 24.6,-19.4 Q 26.4,-17.8 28.2,-19.6" stroke="#2a1a2e" stroke-width="0.8" fill="none"/>
    <path d="M 26,-17.4 L 26.4,-15.6 M 27.6,-17.8 L 28.4,-16.2" stroke="#7f2520" stroke-width="0.8"/>
    <ellipse cx="22.6" cy="-21.6" rx="1.6" ry="0.8" fill="#ff9a7e"/>
    <g fill="#7f2520"><circle cx="16" cy="-22" r="0.7"/><circle cx="18" cy="-18" r="0.7"/></g>

    <!-- near legs: short, arched, on dark tips -->
    <path d="M 19,-13.6 L 28,-17 L 31,-4" stroke="#2a1a2e" stroke-width="6" fill="none"/>
    <path d="M 19,-13.6 L 28,-17 L 31,-4" stroke="#ec5b44" stroke-width="4.4" fill="none"/>
    <path d="M 29.4,-14.4 L 31.4,-6" stroke="#b93a2c" stroke-width="1.3" fill="none"/>
    <path d="M 29,-5 L 33.4,-5 L 31.8,0 Z" fill="#5a1f2a" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle cx="28" cy="-17" r="2.1" fill="#ff9a7e" stroke="#2a1a2e" stroke-width="0.6"/>

    <path d="M 6,-12 L -6,-17 L -11,-4" stroke="#2a1a2e" stroke-width="6" fill="none"/>
    <path d="M 6,-12 L -6,-17 L -11,-4" stroke="#ec5b44" stroke-width="4.4" fill="none"/>
    <path d="M -7,-14.4 L -10,-6" stroke="#b93a2c" stroke-width="1.3" fill="none"/>
    <path d="M -13.2,-5 L -8.8,-5 L -11.6,0 Z" fill="#5a1f2a" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle cx="-6" cy="-17" r="2.1" fill="#ff9a7e" stroke="#2a1a2e" stroke-width="0.6"/>

    <!-- control lever -->
    <path d="M -4,-50.6 L -4.6,-58.6" stroke="#2a1a2e" stroke-width="2.6" fill="none"/>
    <path d="M -4,-50.6 L -4.6,-58.6" stroke="#2f62c8" stroke-width="1.2" fill="none"/>
    <circle cx="-4.7" cy="-59.2" r="1.7" fill="#ec5b44" stroke="#2a1a2e" stroke-width="0.8"/>
    <!-- saddle -->
    <path d="M -19,-51.6 Q -12,-55.6 -5,-52.1 Q -5,-49.6 -12,-49.6 Q -19,-49.6 -19,-51.6 Z" fill="#2f62c8" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -17,-52.2 Q -12,-54.2 -7.5,-52.4" stroke="#78a3f0" stroke-width="0.9" fill="none"/>
  </g>
</svg>
