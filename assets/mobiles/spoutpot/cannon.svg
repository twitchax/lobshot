<svg xmlns="http://www.w3.org/2000/svg" width="40" height="20" viewBox="-8 -10 40 20">
  <!-- Spoutpot's twin hose nozzle: a brass swivel, a short run of red hose, and two brass nozzles
       side by side, one for each of S2's streams. Origin = pivot (swivel center); drawn at aim 0
       (pointing +x). Muzzle = (25, 0), between the two mouths. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.79" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="nozzle" d="M 14,-1.6 L 21.6,-1.2 L 23.4,-0.6 V 0.6 L 21.6,1.2 L 14,1.6 Z"/>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the hose run, ribbed -->
    <rect x="3" y="-3.6" width="9.6" height="7.2" rx="2.4" fill="#d94a3c" stroke="#2a1a2e" stroke-width="0.9"/>
    <rect x="3.6" y="1" width="8.4" height="2" rx="1" fill="#a8332a"/>
    <path d="M 4.4,-2.2 H 11.4" stroke="#ff8a7a" stroke-width="0.9"/>
    <path d="M 6.4,-3.2 V 3.2 M 9.2,-3.2 V 3.2" stroke="#a8332a" stroke-width="0.7"/>
    <!-- the manifold that splits it in two -->
    <rect x="11.4" y="-5.6" width="3.6" height="11.2" rx="1.2" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 12,1.4 H 14.4 V 5 H 12 Z" fill="#b9822c"/>
    <path d="M 12.2,-4.6 V -2" stroke="#fff1a8" stroke-width="0.7"/>
    <!-- two nozzles, upper and lower -->
    <g transform="translate(0,-3)">
      <use href="#nozzle" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.8"/>
      <path d="M 14.6,0.4 L 21.6,0.6 L 23,0.4 V 0.6 L 21.6,1.1 L 14.6,1.4 Z" fill="#b9822c"/>
      <path d="M 15,-0.8 L 21,-0.6" stroke="#fff1a8" stroke-width="0.6"/>
      <ellipse cx="23.8" cy="0" rx="1.1" ry="2.3" fill="#d9a13a" stroke="#2a1a2e" stroke-width="0.8"/>
      <ellipse cx="24.2" cy="0" rx="0.5" ry="1.4" fill="#2a1a2e"/>
    </g>
    <g transform="translate(0,3)">
      <use href="#nozzle" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.8"/>
      <path d="M 14.6,0.4 L 21.6,0.6 L 23,0.4 V 0.6 L 21.6,1.1 L 14.6,1.4 Z" fill="#b9822c"/>
      <path d="M 15,-0.8 L 21,-0.6" stroke="#fff1a8" stroke-width="0.6"/>
      <ellipse cx="23.8" cy="0" rx="1.1" ry="2.3" fill="#d9a13a" stroke="#2a1a2e" stroke-width="0.8"/>
      <ellipse cx="24.2" cy="0" rx="0.5" ry="1.4" fill="#2a1a2e"/>
    </g>
    <!-- a drop of water at each mouth -->
    <path d="M 25.6,-3.6 Q 27.6,-3 26.8,-1.8 Q 25.8,-1.4 25.6,-2.6 Z" fill="#4aa8f0" stroke="#2a1a2e" stroke-width="0.5"/>
    <path d="M 25.6,2.4 Q 27.6,3 26.8,4.2 Q 25.8,4.6 25.6,3.4 Z" fill="#4aa8f0" stroke="#2a1a2e" stroke-width="0.5"/>
    <!-- the swivel -->
    <circle r="5.2" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 5.2,0 A 5.2 5.2 0 0 1 -5.2,0 A 5.6 4 0 0 0 5.2,0 Z" fill="#b9822c"/>
    <circle r="2" fill="#3b7fc6" stroke="#2a1a2e" stroke-width="0.6"/>
    <path d="M -3.6,-2 A 4.2 4.2 0 0 1 -1.4,-4" stroke="#fff8d0" stroke-width="1" fill="none"/>
  </g>
</svg>
