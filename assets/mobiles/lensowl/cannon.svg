<svg xmlns="http://www.w3.org/2000/svg" width="48" height="20" viewBox="-12 -10 48 20">
  <!-- Lensowl's telescope: a brass refractor on its trunnion, the eyepiece behind for the rider and
       the objective lens in front. Origin = pivot (the trunnion); drawn at aim 0 (pointing +x).
       Muzzle = (30, 0), the objective lens. Light from upper-left. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.79" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="tube" d="M -7,-3 L 22,-4.6 L 22,4.6 L -7,3 Z"/>
    <clipPath id="tubeClip"><use href="#tube"/></clipPath>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- eyepiece and focuser, behind the trunnion -->
    <rect x="-8.2" y="-1.8" width="2.4" height="3.6" rx="0.8" fill="#1b2445" stroke="#2a1a2e" stroke-width="0.7"/>
    <rect x="-7.6" y="-1.4" width="0.8" height="2.8" fill="#3a4a86"/>
    <!-- the tube: brass, banded, darker underneath -->
    <use href="#tube" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#tubeClip)">
      <path d="M -9,1.2 L 23,1.8 V 6 H -9 Z" fill="#b9822c"/>
      <path d="M -6,-2 L 21,-3.4" stroke="#fff1a8" stroke-width="0.9" fill="none"/>
    </g>
    <rect x="4" y="-4.4" width="2.4" height="8.8" rx="0.8" fill="#283563" stroke="#2a1a2e" stroke-width="0.7"/>
    <rect x="15" y="-4.9" width="2.4" height="9.8" rx="0.8" fill="#283563" stroke="#2a1a2e" stroke-width="0.7"/>
    <!-- the dew shield and its lens -->
    <path d="M 21.4,-5.6 L 28.4,-6 L 28.4,6 L 21.4,5.6 Z" fill="#283563" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 22.4,-4.4 L 27.6,-4.8" stroke="#5a6cb0" stroke-width="0.8" fill="none"/>
    <ellipse cx="29.2" rx="1.8" ry="5.4" fill="#8ff0ff" stroke="#2a1a2e" stroke-width="0.8"/>
    <ellipse cx="29" cy="-2" rx="0.7" ry="1.6" fill="#e6fdff"/>
    <!-- the trunnion: a brass boss on the pivot -->
    <circle r="3.6" fill="#b9822c" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle r="1.6" fill="#fff1a8" stroke="#2a1a2e" stroke-width="0.5"/>
  </g>
</svg>
