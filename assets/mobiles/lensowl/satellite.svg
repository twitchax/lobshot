<svg xmlns="http://www.w3.org/2000/svg" width="34" height="30" viewBox="-17 -25 34 30">
  <!-- Lensowl's satellite: a little clockwork moon. A cream moon, cratered, in a brass cog ring with
       two tiny fins, and its lens underneath, glowing. It hovers over Lensowl, upright whatever
       the slope; it never leans or mirrors. Origin = the lens, where its lasers leave. Light from
       upper-left. -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.62" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="moonClip"><circle cy="-11" r="7.6"/></clipPath>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- fins, either side -->
    <path d="M -9,-11 L -15,-14.4 Q -16.2,-11 -14.6,-8 L -9,-8.6 Z" fill="#b9822c" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 9,-11 L 15,-14.4 Q 16.2,-11 14.6,-8 L 9,-8.6 Z" fill="#b9822c" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -10,-11.6 L -14.4,-13.8" stroke="#fff1a8" stroke-width="0.7" fill="none"/>
    <path d="M 10,-11.6 L 14.4,-13.8" stroke="#e9b949" stroke-width="0.7" fill="none"/>
    <!-- the cog ring: teeth, then the ring -->
    <g fill="#e9b949" stroke="#2a1a2e" stroke-width="0.7">
      <rect x="-1.6" y="-23" width="3.2" height="3.4" rx="0.6"/>
      <rect x="-1.6" y="-23" width="3.2" height="3.4" rx="0.6" transform="rotate(45 0 -11)"/>
      <rect x="-1.6" y="-23" width="3.2" height="3.4" rx="0.6" transform="rotate(-45 0 -11)"/>
      <rect x="-1.6" y="-23" width="3.2" height="3.4" rx="0.6" transform="rotate(90 0 -11)"/>
      <rect x="-1.6" y="-23" width="3.2" height="3.4" rx="0.6" transform="rotate(-90 0 -11)"/>
      <rect x="-1.6" y="-23" width="3.2" height="3.4" rx="0.6" transform="rotate(135 0 -11)"/>
      <rect x="-1.6" y="-23" width="3.2" height="3.4" rx="0.6" transform="rotate(-135 0 -11)"/>
    </g>
    <circle cy="-11" r="9.6" fill="#b9822c" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -6.6,-17.6 A 9 9 0 0 1 3.4,-19.6" stroke="#fff1a8" stroke-width="1" fill="none"/>
    <!-- the moon, its far side shaded, its craters -->
    <circle cy="-11" r="7.6" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="0.8"/>
    <g clip-path="url(#moonClip)">
      <circle cx="4" cy="-9" r="8" fill="#d9cba8"/>
      <circle cx="-2.4" cy="-13.6" r="2" fill="#e2d6b8" stroke="#c4b48e" stroke-width="0.5"/>
      <circle cx="2.6" cy="-9.4" r="1.5" fill="#c4b48e"/>
      <circle cx="-1.6" cy="-7.6" r="1" fill="#e2d6b8" stroke="#c4b48e" stroke-width="0.4"/>
      <path d="M -5.2,-14.6 A 6 6 0 0 1 -2,-17" stroke="#ffffff" stroke-width="1" fill="none"/>
    </g>
    <!-- the lens housing and its glow -->
    <path d="M -3.6,-3.4 L 3.6,-3.4 L 2.6,-0.4 L -2.6,-0.4 Z" fill="#b9822c" stroke="#2a1a2e" stroke-width="0.7"/>
    <ellipse cy="0" rx="2.6" ry="1.6" fill="#8ff0ff" stroke="#2a1a2e" stroke-width="0.7"/>
    <ellipse cx="-0.8" cy="-0.4" rx="0.9" ry="0.5" fill="#e6fdff"/>
  </g>
</svg>
