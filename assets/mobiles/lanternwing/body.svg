<svg xmlns="http://www.w3.org/2000/svg" width="80" height="68" viewBox="-40 -66 80 68">
  <!-- Lanternwing body: wings, legs, plump armored body, fuzzy head, lantern mount, saddle.
       Origin = ground contact center (= rig.ron body frame). Light from upper-left. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="foreWing" d="M -2,-36 C -5,-51 -16,-61 -28,-63 C -34,-64 -39,-61 -39,-55 C -39,-49 -36,-45 -32,-42 C -24,-38 -12,-36 -2,-36 Z"/>
    <path id="hindWing" d="M -6,-33 C -16,-40 -29,-44 -36,-40 C -40,-37 -38,-29 -33,-26 C -25,-22 -14,-26 -6,-30 Z"/>
    <clipPath id="foreClip"><use href="#foreWing"/></clipPath>
    <clipPath id="hindClip"><use href="#hindWing"/></clipPath>
    <path id="hull" d="M -31,-24 C -32,-31 -24,-37 -12,-38.4 C -2,-39.4 8,-38.4 13,-32 C 17,-27 15,-18 8,-15 C 0,-12 -16,-12 -25,-15 C -29,-17 -31,-20 -31,-24 Z"/>
    <clipPath id="hullClip"><use href="#hull"/></clipPath>
    <!-- the head's fur: a scalloped ball -->
    <path id="head" d="M 21,-31 Q 25,-31.4 26.4,-28.6 Q 30,-27.4 29.6,-23.8 Q 31.4,-20.4 29,-17.6 Q 29,-13.6 25,-13 Q 22,-10.4 18.6,-12.4 Q 14.4,-12 13.6,-15.6 Q 10.6,-18 12.4,-21.4 Q 11.4,-25.4 14.6,-27.2 Q 15.6,-30.8 19,-30.4 Q 20,-31.2 21,-31 Z"/>
    <clipPath id="headClip"><use href="#head"/></clipPath>
    <!-- the wings' glow (their shield) and the hull's soft light, over the cel steps -->
    <radialGradient id="wingGlow" cx="-18" cy="-50" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#fff3b0" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hindGlow" cx="-22" cy="-35" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hullLight" cx="-16" cy="-36" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6d9ff" stop-opacity="0.4"/>
      <stop offset="0.45" stop-color="#e6d9ff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#2a1a50" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a1a50" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- far wings, peeking above the near ones -->
    <use href="#foreWing" transform="translate(5,-2)" fill="#c9528c" stroke="#2a1a2e" stroke-width="0.9"/>
    <use href="#hindWing" transform="translate(4,-1)" fill="#9a3470" stroke="#2a1a2e" stroke-width="0.9"/>

    <!-- near hind wing -->
    <use href="#hindWing" fill="#f07bb0" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#hindClip)">
      <path d="M -40,-30 C -30,-30 -16,-30 -6,-28 V -20 H -40 Z" fill="#c9528c"/>
      <path d="M -12,-33 C -20,-37 -28,-38 -34,-35" stroke="#fff3b0" stroke-width="3.2" fill="none"/>
      <path d="M -6,-31 L -30,-28 M -7,-32 L -26,-40" stroke="#9a3470" stroke-width="0.6" fill="none"/>
      <rect x="-40" y="-46" width="36" height="24" fill="url(#hindGlow)"/>
    </g>
    <!-- near fore wing: the glow band and an eyespot -->
    <use href="#foreWing" fill="#f07bb0" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#foreClip)">
      <path d="M -40,-46 C -28,-42 -14,-39 -2,-38 V -30 H -40 Z" fill="#c9528c"/>
      <path d="M -6,-41 C -11,-51 -21,-57 -33,-58" stroke="#fff3b0" stroke-width="5" fill="none"/>
      <path d="M -6,-41 C -11,-51 -21,-57 -33,-58" stroke="#ffffff" stroke-width="1.4" fill="none" opacity="0.8"/>
      <path d="M -3,-37 L -20,-59 M -3,-37 L -35,-50 M -3,-37 L -30,-42" stroke="#9a3470" stroke-width="0.6" fill="none"/>
      <path d="M -5,-44 C -9,-53 -18,-60 -27,-61.6" stroke="#ffb3d4" stroke-width="1" fill="none"/>
      <path d="M -37.6,-56 C -37.4,-50 -35,-46 -31,-43.4" stroke="#ffd6ea" stroke-width="1.1" fill="none"/>
      <rect x="-40" y="-66" width="40" height="32" fill="url(#wingGlow)"/>
    </g>
    <circle cx="-29" cy="-48" r="3.4" fill="#fff3b0" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="-29" cy="-48" r="1.8" fill="#5a3a8e"/>
    <circle cx="-29.7" cy="-48.7" r="0.6" fill="#ffffff"/>

    <!-- tail tuft -->
    <path d="M -28,-27 Q -33,-29 -34,-25 Q -37,-23 -34,-20.6 Q -34,-17 -29,-18 Z" fill="#fff1d2" stroke="#2a1a2e" stroke-width="0.8"/>

    <!-- the armored body: plates, segment seams, belly shadow -->
    <use href="#hull" fill="#7d55b8" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#hullClip)">
      <path d="M -34,-20 C -20,-15 0,-15 18,-22 V -8 H -34 Z" fill="#5a3a8e"/>
      <path d="M -20,-38 C -23,-30 -23,-20 -20,-12 M -9,-39 C -12,-30 -12,-21 -9,-12" stroke="#3e2766" stroke-width="1" fill="none"/>
      <path d="M -26,-30 C -22,-35 -14,-37.4 -6,-37.6" stroke="#b294e6" stroke-width="1.6" fill="none"/>
      <ellipse cx="9" cy="-36" rx="8" ry="3" fill="#3e2766" opacity="0.5"/>
      <rect x="-34" y="-40" width="52" height="30" fill="url(#hullLight)"/>
    </g>
    <circle cx="-14" cy="-34.6" r="1" fill="#e6d9ff"/>
    <g fill="#3e2766"><circle cx="-20.6" cy="-27" r="0.7"/><circle cx="-21" cy="-20" r="0.7"/><circle cx="-9.6" cy="-31" r="0.7"/><circle cx="-10" cy="-18" r="0.7"/></g>
    <!-- team roundel -->
    <circle cx="-2" cy="-25" r="3" fill="#d9824a" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="-2" cy="-25" r="2" fill="#e8434f"/>
    <path transform="translate(-2,-25) scale(0.42)" d="M 0.9,0 A 0.9 0.9 0 0 0 -0.9,0 A 1.8 1.8 0 0 0 2.7,0 A 2.7 2.7 0 0 0 -2.7,0 A 3.6 3.6 0 0 0 4.5,0" stroke="#fff1d0" stroke-width="1.6" fill="none"/>

    <!-- legs: chunky, jointed, on copper boots -->
    <path d="M -18,-16 L -25,-18 L -26,-4" stroke="#2a1a2e" stroke-width="6" fill="none"/>
    <path d="M -18,-16 L -25,-18 L -26,-4" stroke="#7d55b8" stroke-width="4.2" fill="none"/>
    <path d="M -24,-16 L -24.8,-6" stroke="#3e2766" stroke-width="1.2" fill="none"/>
    <circle cx="-25" cy="-18" r="2.4" fill="#d9824a" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M -30.4,0 Q -30.4,-4.4 -26,-4.4 Q -21.6,-4.4 -21.6,0 Z" fill="#d9824a" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -29,-1.6 Q -28.4,-3.4 -26.4,-3.6" stroke="#ffc08a" stroke-width="0.8" fill="none"/>

    <path d="M -4,-14 L -4.6,-9 L -2,-4" stroke="#2a1a2e" stroke-width="6" fill="none"/>
    <path d="M -4,-14 L -4.6,-9 L -2,-4" stroke="#7d55b8" stroke-width="4.2" fill="none"/>
    <circle cx="-4.6" cy="-9" r="2.4" fill="#d9824a" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M -6.4,0 Q -6.4,-4.4 -2,-4.4 Q 2.4,-4.4 2.4,0 Z" fill="#d9824a" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -5,-1.6 Q -4.4,-3.4 -2.4,-3.6" stroke="#ffc08a" stroke-width="0.8" fill="none"/>

    <path d="M 9,-16 L 18,-18 L 21,-4" stroke="#2a1a2e" stroke-width="6" fill="none"/>
    <path d="M 9,-16 L 18,-18 L 21,-4" stroke="#7d55b8" stroke-width="4.2" fill="none"/>
    <path d="M 19.4,-15.6 L 21,-6" stroke="#3e2766" stroke-width="1.2" fill="none"/>
    <circle cx="18" cy="-18" r="2.4" fill="#d9824a" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 16.6,0 Q 16.6,-4.4 21,-4.4 Q 25.4,-4.4 25.4,0 Z" fill="#d9824a" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 18,-1.6 Q 18.6,-3.4 20.6,-3.6" stroke="#ffc08a" stroke-width="0.8" fill="none"/>

    <!-- fur collar: ties the head into the body -->
    <path d="M 10.6,-35 Q 14.6,-35.6 15,-32 Q 18.4,-30.4 16.6,-27.4 Q 18.6,-24 16,-21.6 Q 17.6,-18 14.4,-16.6 Q 13.6,-13.6 10,-14.6 Q 8,-17 9.4,-19.6 Q 7.4,-22.4 9.6,-25 Q 7.6,-28.2 10,-30.2 Q 8.6,-33.4 10.6,-35 Z"
          fill="#efcf9e" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 11,-33 Q 13.4,-32.4 13.6,-30 M 10.4,-27 Q 12.8,-26.4 13.2,-24" stroke="#fff1d2" stroke-width="1" fill="none"/>
    <!-- fuzzy head -->
    <use href="#head" fill="#fff1d2" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#headClip)">
      <path d="M 10,-17 C 16,-14 24,-13 32,-18 V -8 H 10 Z" fill="#efcf9e"/>
      <path d="M 14,-26 Q 17,-29.6 21,-29.6" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    </g>
    <ellipse cx="23.4" cy="-21.4" rx="4.2" ry="4.8" fill="#2a1a50" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 20.6,-19.2 Q 23.4,-16.6 26.2,-19.2 Q 23.4,-17.8 20.6,-19.2 Z" fill="#8a7ce0"/>
    <circle cx="24.6" cy="-23.2" r="1.3" fill="#ffffff"/>
    <circle cx="22.4" cy="-20" r="0.55" fill="#ffffff"/>
    <ellipse cx="26.6" cy="-15.8" rx="1.6" ry="0.8" fill="#ff8fc0" opacity="0.9"/>
    <path d="M 27.6,-17.6 Q 28.6,-17 29.2,-17.8" stroke="#2a1a2e" stroke-width="0.6" fill="none"/>
    <!-- feathered antennae, far one first, combed underneath, reaching forward under the lantern -->
    <path d="M 22,-29 C 27,-32.4 33,-33 37,-31 C 35.4,-30 35,-29.4 34,-29.8 C 33.2,-29 32.4,-28.8 31.2,-29.2 C 30.4,-28.4 29.4,-28.2 28.4,-28.6 C 27.4,-27.8 26,-27.8 25,-28 C 24,-27.6 23,-27.8 22,-29 Z"
          fill="#efcf9e" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 24.6,-27 C 30,-29.4 36,-29.2 39.4,-26.4 C 37.6,-25.8 37.2,-25.2 36.2,-25.8 C 35.4,-25 34.4,-24.8 33.2,-25.4 C 32.2,-24.6 31,-24.6 30,-25 C 29,-24.2 27.6,-24.4 26.6,-24.8 C 25.6,-24.6 24.8,-25.4 24.6,-27 Z"
          fill="#fff1d2" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 25.6,-26.4 C 30,-28 35,-27.8 38.4,-26.2" stroke="#f07bb0" stroke-width="0.7" fill="none"/>

    <!-- lantern mount: a copper cup, and the rider's handlebar off its back -->
    <path d="M 4.6,-40.6 L 2.4,-45" stroke="#2a1a2e" stroke-width="2.8" fill="none"/>
    <path d="M 4.6,-40.6 L 2.4,-45" stroke="#d9824a" stroke-width="1.3" fill="none"/>
    <circle cx="2.2" cy="-45.6" r="1.8" fill="#f07bb0" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 5,-42 L 19,-42 L 17,-36.4 Q 12,-34 7,-36.4 Z" fill="#d9824a" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 18,-38.6 L 17,-36.4 Q 12,-34 7,-36.4 L 6.2,-38.6 Q 12,-36 18,-38.6 Z" fill="#a85a32"/>
    <ellipse cx="12" cy="-38.8" rx="5.2" ry="1.4" fill="#7a3a22" opacity="0.5"/>
    <!-- saddle -->
    <path d="M -11,-37.6 Q -4,-41.6 3,-38.2 Q 3,-35.6 -4,-35.6 Q -11,-35.6 -11,-37.6 Z" fill="#fff1d2" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -9,-38.2 Q -4,-40.2 0.5,-38.4" stroke="#ffffff" stroke-width="0.9" fill="none"/>
  </g>
</svg>
