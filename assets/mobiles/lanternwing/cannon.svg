<svg xmlns="http://www.w3.org/2000/svg" width="40" height="26" viewBox="-8 -14 40 26">
  <!-- Lanternwing's lantern cannon. Origin = pivot (ball joint center); drawn at aim 0 (pointing
       +x). Muzzle = (27.6, 0), the lens. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.79" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <rect id="glass" x="10" y="-5" width="14" height="10" rx="3"/>
    <clipPath id="glassClip"><use href="#glass"/></clipPath>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- carry ring -->
    <path d="M 13.4,-5.6 C 13.4,-10.4 20.6,-10.4 20.6,-5.6" stroke="#2a1a2e" stroke-width="2.6" fill="none"/>
    <path d="M 13.4,-5.6 C 13.4,-10.4 20.6,-10.4 20.6,-5.6" stroke="#d9824a" stroke-width="1.2" fill="none"/>
    <!-- neck -->
    <rect x="3" y="-2.4" width="7" height="4.8" fill="#a85a32" stroke="#2a1a2e" stroke-width="0.8"/>
    <rect x="3" y="-2.4" width="7" height="1.4" fill="#ffc08a"/>
    <!-- glowing glass and its cage -->
    <use href="#glass" fill="#ffe98a" stroke="#2a1a2e" stroke-width="0.8"/>
    <g clip-path="url(#glassClip)">
      <rect x="8" y="1.6" width="18" height="5" fill="#f7c04a"/>
      <ellipse cx="17" cy="-0.6" rx="4.6" ry="2.6" fill="#fffbe0"/>
    </g>
    <!-- the laser's crystal, glowing inside -->
    <path d="M 15.4,0 L 17,-3.6 L 18.6,0 L 17,3.4 Z" fill="#f07bb0" stroke="#c9528c" stroke-width="0.5"/>
    <path d="M 15.9,-0.2 L 17,-2.8 L 17,0.2 Z" fill="#ffd6ea"/>
    <path d="M 14.6,-5 V 5 M 19.4,-5 V 5" stroke="#2a1a2e" stroke-width="1.8"/>
    <path d="M 14.6,-5 V 5 M 19.4,-5 V 5" stroke="#a85a32" stroke-width="0.8"/>
    <!-- back cap and front hood -->
    <path d="M 10.6,-6.6 H 8 Q 5.6,-6.6 5.6,-3.6 V 3.6 Q 5.6,6.6 8,6.6 H 10.6 Z" fill="#d9824a" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 6.4,2.4 Q 6.4,5.6 8.4,5.6 H 10.6 V 2.4 Z" fill="#a85a32"/>
    <path d="M 23.4,-6.4 L 26.6,-7.8 V 7.8 L 23.4,6.4 Z" fill="#d9824a" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 23.4,2.6 L 26.6,3.4 V 7.8 L 23.4,6.4 Z" fill="#a85a32"/>
    <path d="M 24,-5.8 L 26,-6.8" stroke="#ffc08a" stroke-width="0.8"/>
    <!-- the lens: where the beam leaves -->
    <ellipse cx="27" cy="0" rx="1.6" ry="6.2" fill="#fffbe0" stroke="#2a1a2e" stroke-width="0.8"/>
    <ellipse cx="27.4" cy="0" rx="0.7" ry="3.4" fill="#ffe98a"/>
    <!-- ball joint -->
    <circle r="5.4" fill="#d9824a" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 5.4,0 A 5.4 5.4 0 0 1 -5.4,0 A 5.9 4.2 0 0 0 5.4,0 Z" fill="#a85a32"/>
    <circle r="2" fill="#f07bb0" stroke="#2a1a2e" stroke-width="0.6"/>
    <path d="M -3.8,-2 A 4.4 4.4 0 0 1 -1.4,-4.2" stroke="#ffe0c0" stroke-width="1" fill="none"/>
  </g>
</svg>
