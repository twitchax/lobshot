<svg xmlns="http://www.w3.org/2000/svg" width="42" height="18" viewBox="-7 -9 42 18">
  <!-- Marblemole's marble chute: a wooden trough on an iron hinge, charged marbles queued in it.
       Origin = pivot (the hinge bolt); drawn at aim 0 (pointing +x). Muzzle = (28, 0), the marble
       at the lip. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.79" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- far wall of the trough -->
    <path d="M 3,-1.2 H 25.6" stroke="#2a1a2e" stroke-width="2.4"/>
    <path d="M 3,-1.2 H 25.6" stroke="#6e4224" stroke-width="1"/>
    <!-- queued marbles: their tops show over the near wall -->
    <g stroke="#2a1a2e" stroke-width="0.7">
      <circle cx="9.6" cy="-0.4" r="3" fill="#5ce1ff"/>
      <circle cx="16" cy="-0.4" r="3" fill="#ff5fa8"/>
    </g>
    <g fill="#ffffff"><circle cx="8.6" cy="-1.6" r="0.9"/><circle cx="15" cy="-1.6" r="0.9"/></g>
    <!-- the near wall -->
    <path d="M 2,-0.6 H 24.4 L 25.6,4.6 H 3 Q 2,4.6 2,3.6 Z" fill="#c98a4f" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 2.6,2.6 H 25 L 25.6,4.6 H 3 Z" fill="#9a6235"/>
    <path d="M 3.4,0.6 H 23.6" stroke="#e8b07a" stroke-width="0.8"/>
    <rect x="11.6" y="-1.2" width="2.4" height="6.4" rx="0.6" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.7"/>
    <rect x="20.4" y="-1.2" width="2.4" height="6.4" rx="0.6" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.7"/>
    <!-- the marble at the lip, charged: where it leaves -->
    <circle cx="28" r="3.4" fill="#9b6bff" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 25.6,1.4 A 3 3 0 0 0 30.4,1.6" stroke="#6a3fd0" stroke-width="1.1" fill="none"/>
    <circle cx="26.9" cy="-1.3" r="1" fill="#ffffff"/>
    <path d="M 28.4,-2.4 L 29.4,-0.6 L 28.4,-0.4 L 29.6,1.6" stroke="#ffe14d" stroke-width="0.7" fill="none"/>
    <!-- hinge -->
    <circle r="4.4" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 4.4,0 A 4.4 4.4 0 0 1 -4.4,0 A 4.8 3.2 0 0 0 4.4,0 Z" fill="#3e3c52"/>
    <circle r="1.6" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.6"/>
    <path d="M -3,-1.6 A 3.4 3.4 0 0 1 -1,-3.2" stroke="#b4b2cc" stroke-width="0.9" fill="none"/>
  </g>
</svg>
