<svg xmlns="http://www.w3.org/2000/svg" width="60" height="24" viewBox="-30 -22 60 24">
  <!-- Coilback tread belt. Origin = ground contact center. Static; wheels spin on top.
       Lugs are a dashed stroke on the belt outline, so they wrap the curved ends. -->
  <defs>
    <!-- Outline: the silhouette's alpha blurred, then thresholded low, grows it by about 1.3 units
         with round corners (feMorphology's square kernel left square ones at sharp joins), and is
         filled dark behind the art. -->
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.79" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)">
    <rect x="-26.6" y="-18.6" width="53.2" height="18.2" rx="9.1" fill="none" stroke="#3d3450" stroke-width="3" stroke-dasharray="2.4 2.2"/>
    <rect x="-26.6" y="-18.6" width="53.2" height="18.2" rx="9.1" fill="#4a4060"/>
    <rect x="-24" y="-16" width="48" height="13" rx="6.5" fill="#2e2540"/>
    <path d="M -17,-17.4 H 17" stroke="#8a7ca6" stroke-width="1" stroke-linecap="round"/>
    <path d="M -17,-1.6 H 17" stroke="#2e2540" stroke-width="0.8"/>
  </g>
</svg>
