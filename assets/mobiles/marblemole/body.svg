<svg xmlns="http://www.w3.org/2000/svg" width="70" height="66" viewBox="-35 -64 70 66">
  <!-- Marblemole body: a mole in a miner's helmet riding a wooden mine cart heaped with marbles.
       The far rim, the heap and the mole (behind the cart's near wall), the wall with its iron
       straps, the mole's paws on the rim, the rider's seat and the brake lever. The marble chute
       is the cannon; the wheels spin.
       Origin = ground contact center (= rig.ron body frame). Light from upper-left. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="wall" d="M -32,-36 L 29,-36 L 24,-11 L -27,-11 Z"/>
    <clipPath id="wallClip"><use href="#wall"/></clipPath>
    <circle id="head" cx="8" cy="-46" r="10"/>
    <clipPath id="headClip"><use href="#head"/></clipPath>
    <radialGradient id="wallLight" cx="-18" cy="-34" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe0b0" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffe0b0" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#3a2014" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2014" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the far rim, seen over the near wall -->
    <path d="M -30,-38.4 L 27.6,-38.4" stroke="#2a1a2e" stroke-width="3" fill="none"/>
    <path d="M -30,-38.4 L 27.6,-38.4" stroke="#6e4224" stroke-width="1.6" fill="none"/>

    <!-- spare marbles heaped at the back -->
    <g stroke="#2a1a2e" stroke-width="0.7">
      <circle cx="-26.4" cy="-42.6" r="2.8" fill="#ff5fa8"/>
      <circle cx="-29" cy="-38.6" r="3" fill="#9b6bff"/>
      <circle cx="-23.4" cy="-38.8" r="3" fill="#5ce1ff"/>
    </g>
    <g fill="#ffffff"><circle cx="-27.2" cy="-43.6" r="0.8"/><circle cx="-29.9" cy="-39.7" r="0.9"/><circle cx="-24.3" cy="-39.9" r="0.9"/></g>
    <path d="M -25.6,-45.6 L -24.6,-47.4 L -25.4,-47.6 L -24.2,-49.6" stroke="#2a1a2e" stroke-width="1.8" fill="none"/>
    <path d="M -25.6,-45.6 L -24.6,-47.4 L -25.4,-47.6 L -24.2,-49.6" stroke="#ffe14d" stroke-width="0.8" fill="none"/>

    <g transform="translate(2,0)">
    <!-- the mole: velvet fur with a tuft stood up by static, a pink nose, buck teeth -->
    <path d="M 3.6,-54.4 L 2,-60 L 5.4,-56.2 L 6.4,-61.4 L 8,-56.4" stroke="#2a1a2e" stroke-width="2.4" fill="none"/>
    <path d="M 3.6,-54.4 L 2,-60 L 5.4,-56.2 L 6.4,-61.4 L 8,-56.4" stroke="#7a6458" stroke-width="1.1" fill="none"/>
    <use href="#head" fill="#7a6458" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#headClip)">
      <path d="M -4,-43 C 2,-38.6 12,-37.6 20,-42 V -30 H -4 Z" fill="#5a463e"/>
      <path d="M 0.4,-49 A 8.6 8.6 0 0 1 4,-53.6" stroke="#a38a7a" stroke-width="1.3" fill="none"/>
    </g>
    <!-- snout -->
    <path d="M 14.4,-50 C 18.6,-50.6 22.4,-49 23,-46.4 C 23.4,-44 20.4,-42 16,-42.2 Z" fill="#a38a7a" stroke="#2a1a2e" stroke-width="0.8"/>
    <ellipse cx="22.4" cy="-47.4" rx="2.8" ry="2.3" fill="#ff8fa8" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="21.6" cy="-48.3" r="0.7" fill="#ffd0dc"/>
    <path d="M 17,-42.6 Q 18.8,-41.4 20.6,-42.4" stroke="#2a1a2e" stroke-width="0.7" fill="none"/>
    <rect x="17.8" y="-42.4" width="2.2" height="2" rx="0.4" fill="#ffffff" stroke="#2a1a2e" stroke-width="0.5"/>
    <!-- squinting eye and a blush: moles barely see -->
    <path d="M 10.6,-48.4 Q 12.4,-50.2 14.2,-48.4" stroke="#2a1a2e" stroke-width="1" fill="none"/>
    <ellipse cx="12.6" cy="-44.6" rx="1.8" ry="0.9" fill="#ff8fa8" opacity="0.8"/>
    <!-- miner's helmet and its lamp -->
    <path d="M -2,-51.4 C -2,-58 3.6,-61 9,-60.6 C 13.8,-60.2 17,-57 17,-52.2 Z" fill="#d94a3c" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -3.8,-51.6 L 18.6,-52.2 L 18.2,-50.2 L -3.4,-49.6 Z" fill="#a8332a" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 1,-55.4 C 2.2,-57.8 5,-59.2 8,-59.4" stroke="#ff8a7a" stroke-width="1.1" fill="none"/>
    <rect x="12.6" y="-58.4" width="4.4" height="4.4" rx="1" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle cx="16.6" cy="-56.2" r="2.1" fill="#fff4b0" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle cx="16.2" cy="-56.8" r="0.7" fill="#ffffff"/>
    </g>

    <!-- the near wall: planks, iron straps, rim -->
    <use href="#wall" fill="#c98a4f" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#wallClip)">
      <path d="M -40,-19.4 H 40 V -8 H -40 Z" fill="#9a6235"/>
      <path d="M -40,-27.6 H 40 M -40,-19.4 H 40" stroke="#6e4224" stroke-width="0.9"/>
      <path d="M -24,-33 H 12 M -20,-25 H 4 M -16,-17 H -2" stroke="#e8b07a" stroke-width="0.8"/>
      <path d="M -10,-35 L -9.6,-29 M 8,-27 L 8.4,-21 M -14,-18.6 L -13.8,-13" stroke="#6e4224" stroke-width="0.6"/>
      <!-- iron straps at the corners, slanted with the wall -->
      <path d="M -30,-38 L -25.6,-38 L -20.6,-9 L -25,-9 Z M 23,-38 L 27.6,-38 L 22.6,-9 L 18,-9 Z" fill="#5a5870"/>
      <path d="M -29,-36 L -28,-36 L -23.2,-11 L -24.2,-11 Z M 24,-36 L 25,-36 L 20,-11 L 19,-11 Z" fill="#8a88a6"/>
      <rect x="-34" y="-36" width="64" height="2.6" fill="#3a2014" opacity="0.35"/>
      <rect x="-34" y="-38" width="64" height="30" fill="url(#wallLight)"/>
    </g>
    <g fill="#2e2c40"><circle cx="-26.4" cy="-30" r="0.7"/><circle cx="-25" cy="-22.4" r="0.7"/><circle cx="-23.6" cy="-15" r="0.7"/>
      <circle cx="22.2" cy="-30" r="0.7"/><circle cx="20.8" cy="-22.4" r="0.7"/><circle cx="19.4" cy="-15" r="0.7"/></g>
    <rect x="-33.4" y="-38" width="64" height="3.4" rx="1.4" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -31.6,-37.1 H 29" stroke="#8a88a6" stroke-width="0.8"/>
    <!-- team roundel -->
    <circle cx="-3" cy="-24" r="3" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="-3" cy="-24" r="2" fill="#e8434f"/>
    <path transform="translate(-3,-24) scale(0.42)" d="M 0.9,0 A 0.9 0.9 0 0 0 -0.9,0 A 1.8 1.8 0 0 0 2.7,0 A 2.7 2.7 0 0 0 -2.7,0 A 3.6 3.6 0 0 0 4.5,0" stroke="#fff1d0" stroke-width="1.6" fill="none"/>

    <g transform="translate(1.4,0)">
    <!-- the mole's big digging paws on the rim -->
    <path d="M 7.4,-39.6 C 7.4,-42.4 12.8,-42.6 13.6,-39.6 L 13.4,-37.2 L 7.2,-37.2 Z" fill="#ffb4b8" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 8.2,-37.2 V -35 M 10.4,-37.2 V -34.8 M 12.6,-37.2 V -35" stroke="#fff0e8" stroke-width="0.9"/>
    <path d="M 15.2,-39.8 C 15.2,-42.6 20.6,-42.8 21.4,-39.8 L 21.2,-37.2 L 15,-37.2 Z" fill="#ffb4b8" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 16,-37.2 V -35 M 18.2,-37.2 V -34.8 M 20.4,-37.2 V -35" stroke="#fff0e8" stroke-width="0.9"/>
    </g>

    <!-- axle boxes -->
    <rect x="-18" y="-12" width="6" height="3.4" rx="0.8" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.7"/>
    <rect x="10" y="-12" width="6" height="3.4" rx="0.8" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.7"/>

    <!-- brake lever, for the rider's hands -->
    <path d="M -6,-37 L -7,-46.6" stroke="#2a1a2e" stroke-width="2.6" fill="none"/>
    <path d="M -6,-37 L -7,-46.6" stroke="#8a88a6" stroke-width="1.2" fill="none"/>
    <circle cx="-7.1" cy="-47.2" r="1.7" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.8"/>
    <!-- seat on the rear rim -->
    <path d="M -21,-39 Q -14,-43 -7,-39.5 Q -7,-37 -14,-37 Q -21,-37 -21,-39 Z" fill="#8a4b2e" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -19,-39.6 Q -14,-41.6 -9.5,-39.8" stroke="#c97a4a" stroke-width="0.9" fill="none"/>
  </g>
</svg>
