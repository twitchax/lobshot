<svg xmlns="http://www.w3.org/2000/svg" width="76" height="68" viewBox="-38 -66 76 68">
  <!-- Sudsotter body: an otter in a shower cap having a bath in a clawfoot tub on wheels. The suds
       heaped in the tub, the otter (behind the near wall, its paws on the rim), the tub's painted
       wall and rolled rim, the brass claw feet gripping the axles, the towel the rider sits on and
       the hot tap they hold. The bath tap is the cannon; the wheels spin.
       Origin = ground contact center (= rig.ron body frame). Light from upper-left. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="tub" d="M -33.6,-46 C -35.4,-38 -33.6,-24 -26,-16 Q -21,-11.4 -14,-11.4 L 13,-11.4 Q 21,-11.4 25.4,-16.4 C 29.4,-21 30.6,-30 30.2,-38 L -26,-38 C -28.6,-39.6 -31.4,-42.4 -33.6,-46 Z"/>
    <clipPath id="tubClip"><use href="#tub"/></clipPath>
    <ellipse id="head" cx="9.6" cy="-47.2" rx="9.4" ry="8.4"/>
    <clipPath id="headClip"><use href="#head"/></clipPath>
    <path id="cap" d="M -0.4,-52.4 C -1,-58.6 4.2,-61.8 9.8,-61.6 C 15.4,-61.4 19.6,-58 19.4,-52.4 Z"/>
    <clipPath id="capClip"><use href="#cap"/></clipPath>
    <radialGradient id="tubLight" cx="-20" cy="-40" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8be8cf" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#8be8cf" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#0d1226" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1226" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the far rim, seen over the suds at the back -->
    <path d="M -27,-40.6 L 27.4,-40.6" stroke="#2a1a2e" stroke-width="2.6" fill="none"/>
    <path d="M -27,-40.6 L 27.4,-40.6" stroke="#f2ead8" stroke-width="1.3" fill="none"/>

    <!-- the otter: shoulders, a broad flat head with a small round ear set low -->
    <path d="M 2.6,-37 C 2,-42 5,-45 10,-45 C 15,-45 18,-42 17.4,-37 Z" fill="#a85a32" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="1.4" cy="-49.4" r="2.4" fill="#a85a32" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="1.4" cy="-49.4" r="1.1" fill="#ff9a7e"/>
    <use href="#head" fill="#a85a32" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#headClip)">
      <path d="M -2,-42.6 C 4,-39.6 11,-39.4 22,-43.4 V -36 H -2 Z" fill="#8a4b2e"/>
      <path d="M 1.8,-45.4 A 8.4 8.4 0 0 1 3,-49.6" stroke="#d9824a" stroke-width="1.2" fill="none"/>
    </g>
    <!-- the big pale muzzle, puffed out with whisker pads, and a wet black nose -->
    <path d="M 11,-44.8 C 10.8,-48.4 15,-49.8 19,-49.2 C 22.6,-48.8 25,-46.8 24.6,-44.2 C 24.2,-41.6 21.6,-40.2 18.4,-40.4 C 14.6,-40.4 11,-41.6 11,-44.8 Z" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 12.6,-42.2 C 14.6,-40.8 18,-40.6 21.4,-41.6" stroke="#efcf9e" stroke-width="1.1" fill="none"/>
    <path d="M 20.8,-48.8 Q 23.6,-50.4 25.4,-48.4 Q 25.9,-46.4 24,-46 Q 21.8,-46 20.8,-47.4 Z" fill="#2a1a2e"/>
    <circle cx="22.4" cy="-48.6" r="0.6" fill="#ffffff"/>
    <path d="M 22.6,-45.8 V -44.6 M 20.4,-43.8 Q 22.4,-42.8 24,-44.2" stroke="#2a1a2e" stroke-width="0.65" fill="none"/>
    <g fill="#d98a4a"><circle cx="17.6" cy="-45.6" r="0.45"/><circle cx="18.8" cy="-44.2" r="0.45"/><circle cx="16.6" cy="-43.8" r="0.45"/><circle cx="19.6" cy="-46.4" r="0.45"/></g>
    <path d="M 19.8,-45.4 L 26.2,-46.4 M 19.8,-43.8 L 25.8,-42.8" stroke="#fffbe0" stroke-width="0.5" fill="none"/>
    <!-- a bright eye and a blush -->
    <ellipse cx="14.6" cy="-49.8" rx="1.6" ry="1.9" fill="#2a1a2e"/>
    <circle cx="15.1" cy="-50.5" r="0.65" fill="#ffffff"/>
    <ellipse cx="13.4" cy="-44.6" rx="1.6" ry="0.9" fill="#ff8fa8" opacity="0.8"/>
    <!-- the shower cap: polka dots, a frilled band -->
    <g transform="translate(0,-0.8)">
    <use href="#cap" fill="#f07bb0" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#capClip)">
      <path d="M 6,-50 C 12,-52 17.6,-55 19,-60 L 24,-60 L 24,-50 Z" fill="#c9528c"/>
      <g fill="#ffd6ea"><circle cx="4.4" cy="-56.4" r="1.1"/><circle cx="9.4" cy="-59.2" r="1"/><circle cx="11.6" cy="-55.2" r="1.1"/><circle cx="16.4" cy="-57.4" r="0.9"/></g>
      <path d="M 1.6,-55.2 C 2.6,-58.4 5.4,-60.2 8.6,-60.4" stroke="#ffd6ea" stroke-width="1.1" fill="none"/>
    </g>
    <path d="M -1.6,-52.6 Q -0.6,-54.4 0.8,-52.8 Q 2,-54.6 3.4,-52.9 Q 4.6,-54.7 6,-53 Q 7.2,-54.8 8.6,-53.1 Q 9.8,-54.9 11.2,-53.1 Q 12.4,-54.9 13.8,-53 Q 15,-54.8 16.4,-52.9 Q 17.6,-54.6 19,-52.8 Q 20.2,-54.4 21,-52.4 Q 20.4,-51.2 19,-51.6 Q 17.6,-50.8 16.4,-51.8 Q 15,-51 13.8,-52 Q 12.4,-51.2 11.2,-52.1 Q 9.8,-51.2 8.6,-52.1 Q 7.2,-51.2 6,-52 Q 4.6,-51 3.4,-51.9 Q 2,-50.8 0.8,-51.7 Q -0.6,-51 -1.6,-51.9 Z" fill="#ffd6ea" stroke="#2a1a2e" stroke-width="0.6"/>
    </g>

    <!-- suds heaped over the rim -->
    <g stroke="#2a1a2e" stroke-width="0.55">
      <circle cx="-30.6" cy="-45.4" r="2.6" fill="#ffffff"/>
      <circle cx="-26.4" cy="-46.6" r="3.6" fill="#ffffff"/>
      <circle cx="-25" cy="-42.4" r="3.4" fill="#ffffff"/>
      <circle cx="-20.4" cy="-45" r="3.8" fill="#ffffff"/>
      <circle cx="-7.6" cy="-42.6" r="2.6" fill="#ffffff"/>
      <circle cx="-4.2" cy="-41.2" r="3.2" fill="#ffffff"/>
      <circle cx="-0.6" cy="-43" r="3" fill="#ffffff"/>
      <circle cx="3.4" cy="-40.2" r="2.8" fill="#ffffff"/>
      <circle cx="8.2" cy="-39.8" r="2.6" fill="#ffffff"/>
      <circle cx="14.4" cy="-39.4" r="2.4" fill="#ffffff"/>
      <circle cx="20" cy="-39.8" r="2.6" fill="#ffffff"/>
      <circle cx="24.2" cy="-40.2" r="2.6" fill="#ffffff"/>
      <circle cx="26.4" cy="-42.4" r="1.4" fill="#ffffff"/>
    </g>
    <g fill="none" stroke-width="0.8">
      <path d="M -28.6,-47.4 A 2.6 2.6 0 0 1 -26.8,-49.2" stroke="#8ff0ff"/>
      <path d="M -22.6,-46.4 A 2.6 2.6 0 0 1 -20.4,-48" stroke="#ffd6ea"/>
      <path d="M -5.8,-42 A 2 2 0 0 1 -4.4,-43.4" stroke="#8ff0ff"/>
      <path d="M 6.6,-40.6 A 1.8 1.8 0 0 1 7.8,-41.8" stroke="#ffd6ea"/>
      <path d="M 18.4,-40.6 A 1.8 1.8 0 0 1 19.6,-41.8" stroke="#8ff0ff"/>
    </g>
    <g fill="#e6d9ff"><path d="M -23,-41 A 3.4 3.4 0 0 1 -28.2,-41.6 A 3.4 3.4 0 0 0 -23,-41 Z"/><path d="M 22.6,-39 A 3.4 3.4 0 0 1 16.2,-39.4 A 3.6 3.6 0 0 0 22.6,-39 Z"/></g>
    <!-- a bubble or two drifting up -->
    <circle cx="-31.4" cy="-52.4" r="1.6" fill="#ffffff" stroke="#2a1a2e" stroke-width="0.5"/>
    <circle cx="25.6" cy="-56.6" r="1.3" fill="#ffffff" stroke="#2a1a2e" stroke-width="0.5"/>

    <!-- the tub's near wall: painted, with a gold pinstripe -->
    <use href="#tub" fill="#2bb3a3" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#tubClip)">
      <path d="M -40,-22 C -10,-17.4 12,-17.4 40,-22 V -8 H -40 Z" fill="#1d7f80"/>
      <path d="M -31,-34.4 C -12,-33.4 12,-33.4 28.4,-34.4" stroke="#e9b949" stroke-width="0.9" fill="none"/>
      <path d="M -31.6,-36 C -30.6,-30 -27.6,-24 -23,-19.4" stroke="#8be8cf" stroke-width="1.2" fill="none"/>
      <rect x="-40" y="-50" width="80" height="42" fill="url(#tubLight)"/>
    </g>
    <!-- the rolled rim -->
    <path d="M 30.2,-38 L -26,-38 C -28.6,-39.6 -31.4,-42.4 -33.6,-46" stroke="#2a1a2e" stroke-width="4.4" fill="none"/>
    <path d="M 30.2,-38 L -26,-38 C -28.6,-39.6 -31.4,-42.4 -33.6,-46" stroke="#f6f0e2" stroke-width="2.8" fill="none"/>
    <path d="M 28,-38.7 L -25,-38.7 C -27.4,-40.2 -30,-42.6 -32,-45.6" stroke="#ffffff" stroke-width="0.9" fill="none"/>
    <!-- team roundel -->
    <circle cx="-6" cy="-26" r="3" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="-6" cy="-26" r="2" fill="#e8434f"/>
    <path transform="translate(-6,-26) scale(0.42)" d="M 0.9,0 A 0.9 0.9 0 0 0 -0.9,0 A 1.8 1.8 0 0 0 2.7,0 A 2.7 2.7 0 0 0 -2.7,0 A 3.6 3.6 0 0 0 4.5,0" stroke="#fff1d0" stroke-width="1.6" fill="none"/>

    <!-- the otter's paws on the rim -->
    <path d="M 4.6,-39.2 C 4.6,-42 9.6,-42.2 10.2,-39.2 L 10,-37 L 4.4,-37 Z" fill="#8a4b2e" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 5.4,-37.4 V -36 M 7.4,-37.4 V -35.8 M 9.4,-37.4 V -36" stroke="#efcf9e" stroke-width="0.8"/>
    <path d="M 12.8,-39.4 C 12.8,-42.2 17.8,-42.4 18.4,-39.4 L 18.2,-37 L 12.6,-37 Z" fill="#8a4b2e" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 13.6,-37.4 V -36 M 15.6,-37.4 V -35.8 M 17.6,-37.4 V -36" stroke="#efcf9e" stroke-width="0.8"/>

    <!-- brass claw feet, gripping the axles -->
    <g id="foot" stroke="#2a1a2e" stroke-width="0.8">
      <path d="M -21,-16 C -20,-13.4 -21.8,-11.8 -21.6,-9.6 L -12.6,-9.6 C -12.4,-11.8 -14,-13.4 -13,-16 Z" fill="#e9b949"/>
      <path d="M -19.6,-15.2 C -19,-13.4 -20.2,-12 -20.2,-10.4" stroke="#fff3b0" stroke-width="0.8" fill="none"/>
      <path d="M -14.6,-15.2 C -15.2,-13.4 -14,-12 -14,-10.4" stroke="#b9822c" stroke-width="0.8" fill="none"/>
      <circle cx="-20.4" cy="-9" r="1.9" fill="#e9b949"/>
      <circle cx="-17" cy="-8.4" r="1.9" fill="#e9b949"/>
      <circle cx="-13.6" cy="-9" r="1.9" fill="#e9b949"/>
      <path d="M -21.6,-7.6 L -21.2,-6.4 M -17.8,-7 L -17.4,-5.8 M -14.4,-7.6 L -14,-6.4" stroke="#f6f0e2" stroke-width="0.9"/>
    </g>
    <use href="#foot" transform="translate(32,0)"/>
    <!-- the hot tap, for the rider's hands -->
    <path d="M -9.4,-39 L -10,-47.6" stroke="#2a1a2e" stroke-width="2.6" fill="none"/>
    <path d="M -9.4,-39 L -10,-47.6" stroke="#e9b949" stroke-width="1.2" fill="none"/>
    <circle cx="-10.1" cy="-48.4" r="1.8" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="-10.6" cy="-49" r="0.6" fill="#ffd6ea"/>
    <!-- a folded towel on the back rim: the rider's seat -->
    <path d="M -25,-39.6 Q -25,-43.4 -21,-43.4 H -12.6 Q -10.8,-43.4 -10.8,-41.6 V -38.6 Q -17,-37.4 -25,-39.6 Z" fill="#2f62c8" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -22,-43.2 V -38.6 M -18.6,-43.3 V -38.4 M -15.2,-43.3 V -38.4" stroke="#a8c4ff" stroke-width="0.9"/>
    <path d="M -23.6,-42 Q -18,-42.8 -12,-42.2" stroke="#f6f0e2" stroke-width="0.7" fill="none"/>
  </g>
</svg>
