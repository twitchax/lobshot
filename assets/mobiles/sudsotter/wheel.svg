<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="-10 -10 20 20">
  <!-- Sudsotter's wheel: a fat rubber tyre with a white wall and a brass hub. Origin = axle; spins
       (the spokes make rotation readable). -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.49" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linecap="round">
    <!-- Ring shading only: it spins, and a baked light would spin with it. -->
    <circle r="8.2" fill="#3e3c52"/>
    <circle r="7" fill="#5a5870"/>
    <circle r="5.6" fill="#f6f0e2" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle r="4.2" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.6"/>
    <g stroke="#b9822c" stroke-width="1.2"><path d="M 0,-4 V 4 M -4,0 H 4 M -2.8,-2.8 L 2.8,2.8 M -2.8,2.8 L 2.8,-2.8"/></g>
    <circle r="1.6" fill="#fff3b0" stroke="#2a1a2e" stroke-width="0.6"/>
  </g>
</svg>
