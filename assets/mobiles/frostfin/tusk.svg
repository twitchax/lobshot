<svg xmlns="http://www.w3.org/2000/svg" width="40" height="10" viewBox="-5 -5 40 10">
  <!-- Frostfin's tusk: a spiral of ivory in a steel collar, frosted at the tip, where ice gathers
       into the ball it throws. Origin = pivot (the collar's bolt, in the socket on the upper lip);
       drawn at aim 0 (pointing +x). Muzzle = (30, 0), the ball of ice at the tip. -->
  <defs>
    <filter id="ol" x="-15%" y="-25%" width="130%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.79" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="horn" d="M 1,-2.5 C 10,-2.1 19,-1.5 27.6,-0.9 L 27.6,0.9 C 19,1.5 10,2.1 1,2.5 Z"/>
    <clipPath id="hornClip"><use href="#horn"/></clipPath>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the tusk: ivory, wound in a left-hand spiral -->
    <use href="#horn" fill="#f2ead8" stroke="#2a1a2e" stroke-width="0.8"/>
    <g clip-path="url(#hornClip)">
      <path d="M 0,0.9 C 10,1.2 19,0.6 28,0.2 V 3 H 0 Z" fill="#efcf9e"/>
      <path d="M 5,3 L 7.4,-3 M 9.4,3 L 11.6,-3 M 13.8,3 L 15.8,-3 M 18.2,3 L 20,-3 M 22.4,3 L 24,-3" stroke="#c9a46a" stroke-width="0.8"/>
      <path d="M 3,-1.5 C 10,-1.3 18,-0.9 26,-0.5" stroke="#fffbe0" stroke-width="0.6" fill="none"/>
      <path d="M 20,-3 C 23,-1.6 25.4,-1.2 28,-1.4 V 3 C 25,2 22,2.6 20,3 Z" fill="#c8f6ff" opacity="0.75"/>
    </g>
    <!-- the ball of ice at the tip -->
    <circle cx="30" r="2.6" fill="#8ff0ff" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="30" r="1.4" fill="#e6fdff"/>
    <circle cx="29.1" cy="-1" r="0.6" fill="#ffffff"/>
    <!-- the steel collar and its bolt -->
    <rect x="-1.2" y="-3.4" width="4" height="6.8" rx="1.2" fill="#8a88a6" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 0,-2.4 V 2.4" stroke="#5a5870" stroke-width="0.8"/>
    <circle r="1.3" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.6"/>
  </g>
</svg>
