<svg xmlns="http://www.w3.org/2000/svg" width="36" height="18" viewBox="-7 -9 36 18">
  <!-- Frostfin's snow cannon: a red flared barrel with brass rings, snow caked on its mouth, an
       icicle loaded in it. Origin = pivot (the brass swivel in the cup on the narwhal's back);
       drawn at aim 0 (pointing +x). Muzzle = (25, 0), the icicle's tip. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.79" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="barrel" d="M 1,-3.8 L 19.6,-4.8 L 22,-5.4 L 22,5.4 L 19.6,4.8 L 1,3.8 Z"/>
    <clipPath id="barrelClip"><use href="#barrel"/></clipPath>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the icicle, its tip out of the mouth: where it leaves -->
    <path d="M 18,-2.6 L 25,0 L 18,2.6 Z" fill="#8ff0ff" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 19,-1.4 L 23.6,-0.2" stroke="#e6fdff" stroke-width="0.8"/>
    <!-- barrel -->
    <use href="#barrel" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#barrelClip)">
      <path d="M 0,1.2 L 23,1.6 V 6 H 0 Z" fill="#b93a2c"/>
      <path d="M 2,-2.6 L 19,-3.4" stroke="#ff9a7e" stroke-width="1" fill="none"/>
    </g>
    <rect x="7.4" y="-4.5" width="2.4" height="9" rx="0.8" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.7"/>
    <rect x="13.6" y="-5.2" width="2.4" height="10.4" rx="0.8" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 8.2,-3.8 V -1 M 14.4,-4.2 V -1.4" stroke="#fff3b0" stroke-width="0.6"/>
    <!-- snow caked on the mouth, heaped on its top lip -->
    <path d="M 19,-6.6 C 20.6,-7.8 23.2,-7.4 23.8,-5.4 C 24.4,-3.6 24.4,3.4 23.6,4.8 C 23,5.8 21.6,6 20.8,5.2 L 21,3.4 L 21,-3.4 C 19.8,-3.8 18.4,-5.4 19,-6.6 Z" fill="#f2f7ff" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 20,-6.2 C 21.4,-6.8 22.8,-6.2 23.1,-5" stroke="#ffffff" stroke-width="0.7" fill="none"/>
    <!-- swivel -->
    <circle r="4.4" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 4.4,0 A 4.4 4.4 0 0 1 -4.4,0 A 4.8 3.2 0 0 0 4.4,0 Z" fill="#b9822c"/>
    <circle r="1.6" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.6"/>
    <path d="M -3,-1.6 A 3.4 3.4 0 0 1 -1,-3.2" stroke="#fff3b0" stroke-width="0.9" fill="none"/>
  </g>
</svg>
