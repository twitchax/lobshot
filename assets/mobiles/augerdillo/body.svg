<svg xmlns="http://www.w3.org/2000/svg" width="78" height="62" viewBox="-39 -56 78 62">
  <!-- Augerdillo body: an armadillo curled up on a tracked drill rig. The rig's teal hull with its
       gold trim and hazard-striped plow, the armadillo's banded shell on the deck (the mortar's yoke
       on its back, the rider's pad and drill lever on its front), its long head in a miner's
       headlamp poking out ahead, tall ears, claws over the rim and a ringed tail hanging over the
       rig's tail end. The mortar is the cannon; the track is its own part, and its wheels spin.
       Origin = ground contact center (= rig.ron body frame). Light from upper-left. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="hull" d="M -30.4,-25.4 H 18.6 L 26.4,-14.6 Q 27.2,-12.2 24.6,-12.2 H -28 Q -30.4,-12.2 -30.4,-14.8 Z"/>
    <clipPath id="hullClip"><use href="#hull"/></clipPath>
    <path id="plow" d="M 18.6,-25.4 L 22.6,-25.4 L 30.6,-14.2 Q 31.4,-12.2 29,-12.2 L 24.6,-12.2 Q 27.2,-12.2 26.4,-14.6 Z"/>
    <clipPath id="plowClip"><use href="#plow"/></clipPath>
    <path id="shell" d="M -27.4,-25 C -28.4,-33.4 -20,-46.2 -6,-46.8 C 7.6,-47.2 16.6,-39 17.8,-25 Z"/>
    <clipPath id="shellClip"><use href="#shell"/></clipPath>
    <path id="head" d="M 12.4,-35.2 C 18,-38.2 25.4,-34.4 32.2,-27.6 C 35.4,-25.4 36.6,-22.8 34.6,-21.6 C 28.4,-19.8 19.4,-20.8 12.6,-23.8 Z"/>
    <clipPath id="headClip"><use href="#head"/></clipPath>
    <path id="tail" d="M -24.6,-31 C -31,-31.4 -35.4,-28.4 -36.2,-22.4 C -36.4,-19.8 -35.4,-17.8 -34,-18.2 C -33.8,-22.6 -31.2,-26.6 -24.8,-26.4 Z"/>
    <clipPath id="tailClip"><use href="#tail"/></clipPath>
    <radialGradient id="shellLight" cx="-12" cy="-46" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4dc" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#fff4dc" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#3a2a1e" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2a1e" stop-opacity="0.25"/>
    </radialGradient>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the rig's hull: teal, darker below its gold trim, rivets along its foot -->
    <use href="#hull" fill="#2bb3a3" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#hullClip)">
      <path d="M -32,-19.6 H 30 V -10 H -32 Z" fill="#1d7f80"/>
      <path d="M -29,-24 H 18.4" stroke="#8be8cf" stroke-width="1.1" fill="none"/>
      <path d="M -32,-20.6 H 30" stroke="#b9822c" stroke-width="2.2"/>
      <path d="M -32,-21 H 30" stroke="#e9b949" stroke-width="1.2"/>
    </g>
    <g fill="#145a5c"><circle cx="-26" cy="-14.6" r="0.7"/><circle cx="-14" cy="-14.6" r="0.7"/><circle cx="-2" cy="-14.6" r="0.7"/><circle cx="10" cy="-14.6" r="0.7"/><circle cx="20" cy="-14.6" r="0.7"/></g>
    <!-- the plow on the rig's nose: hazard stripes -->
    <use href="#plow" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#plowClip)">
      <path d="M 18,-21.6 L 24,-27.6 L 26,-25.6 L 20,-19.6 Z M 20.6,-16 L 28.6,-24 L 30.6,-22 L 22.6,-14 Z M 23.6,-11 L 32,-19.4 L 34,-17.4 L 25.6,-9 Z" fill="#3e3c52"/>
    </g>
    <!-- team roundel -->
    <circle cx="-20" cy="-17" r="3" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="-20" cy="-17" r="2" fill="#e8434f"/>
    <path transform="translate(-20,-17) scale(0.42)" d="M 0.9,0 A 0.9 0.9 0 0 0 -0.9,0 A 1.8 1.8 0 0 0 2.7,0 A 2.7 2.7 0 0 0 -2.7,0 A 3.6 3.6 0 0 0 4.5,0" stroke="#fff1d0" stroke-width="1.6" fill="none"/>

    <!-- the ringed tail, hanging over the rig's tail end -->
    <use href="#tail" fill="#e8b07a" stroke="#2a1a2e" stroke-width="0.8"/>
    <g clip-path="url(#tailClip)">
      <path d="M -38,-24 C -35,-27 -30,-27.6 -24,-27 V -24 H -38 Z" fill="#c98a4f"/>
      <path d="M -29.4,-31.6 L -28.8,-26 M -33,-30 L -31.4,-25.2 M -35.4,-26.8 L -33.2,-23.6" stroke="#9a6235" stroke-width="0.8" fill="none"/>
    </g>

    <!-- the shell: a front shield, banded middle and rear shield, lit from the upper left -->
    <use href="#shell" fill="#e8b07a" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#shellClip)">
      <path d="M -32,-30.6 C -14,-26.6 4,-26.6 22,-31 V -20 H -32 Z" fill="#c98a4f"/>
      <!-- the bands, each a ridge with a lit crest -->
      <path d="M -13.2,-25 C -14.2,-33 -13.8,-40.6 -12,-46.4 M -8.4,-25 C -9,-33.2 -8.6,-41 -7,-47 M -3.6,-25 C -3.8,-33.2 -3.4,-41.2 -2,-47 M 1.2,-25 C 1.4,-33 1.8,-40.8 3,-46.6" stroke="#9a6235" stroke-width="1" fill="none"/>
      <path d="M -12.2,-26 C -13,-33.4 -12.6,-40.4 -11,-45.6 M -7.4,-26 C -7.9,-33.4 -7.5,-40.8 -6,-46.2 M -2.6,-26 C -2.7,-33.4 -2.3,-41 -1,-46.2 M 2.2,-26 C 2.5,-33.2 2.9,-40.6 4,-45.8" stroke="#efcf9e" stroke-width="0.7" fill="none"/>
      <!-- scutes on the shields -->
      <g fill="#c98a4f">
        <rect x="-24.6" y="-36.4" width="3" height="2.2" rx="0.8"/><rect x="-20.2" y="-40.6" width="3" height="2.2" rx="0.8"/><rect x="-19.6" y="-34.6" width="3" height="2.2" rx="0.8"/><rect x="-24.8" y="-30.6" width="3" height="2.2" rx="0.8"/><rect x="-19.8" y="-29.2" width="3" height="2.2" rx="0.8"/>
        <rect x="6.6" y="-39.6" width="3" height="2.2" rx="0.8"/><rect x="11.2" y="-35.4" width="3" height="2.2" rx="0.8"/><rect x="6.8" y="-33.4" width="3" height="2.2" rx="0.8"/><rect x="11.8" y="-29.6" width="3" height="2.2" rx="0.8"/><rect x="6.6" y="-28" width="3" height="2.2" rx="0.8"/>
      </g>
      <rect x="-32" y="-50" width="52" height="26" fill="url(#shellLight)"/>
      <path d="M -24.4,-36 C -22,-42 -15.4,-45.4 -9.6,-46" stroke="#fff4dc" stroke-width="1.2" fill="none"/>
    </g>
    <!-- the shell's scalloped hem on the deck -->
    <path d="M -27.6,-25.4 Q -25.4,-23.2 -23.2,-25.4 Q -21,-23.2 -18.8,-25.4 Q -16.6,-23.2 -14.4,-25.4 Q -12.2,-23.2 -10,-25.4 Q -7.8,-23.2 -5.6,-25.4 Q -3.4,-23.2 -1.2,-25.4 Q 1,-23.2 3.2,-25.4 Q 5.4,-23.2 7.6,-25.4 Q 9.8,-23.2 12,-25.4 Q 14.2,-23.2 16.4,-25.4 Q 17.4,-24.4 18,-25.4" fill="#9a6235" stroke="#2a1a2e" stroke-width="0.7"/>

    <!-- the mortar's yoke on the back of the shell: a steel saddle plate, cheeks up to the hub -->
    <path d="M -20.6,-41 C -17.4,-43.2 -12.4,-43.4 -8.6,-41.4 L -9.4,-38.8 C -12.6,-40.6 -17,-40.4 -19.6,-38.6 Z" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -19.2,-40.4 C -16.6,-42 -12.6,-42.2 -10,-40.8" stroke="#8a88a6" stroke-width="0.7" fill="none"/>
    <path d="M -19.4,-41.4 L -18.8,-50.4 L -15,-51.6 L -11.2,-50.4 L -10.6,-41.4" fill="#8a88a6" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -17.6,-42.2 L -17.2,-49.4" stroke="#b4b2cc" stroke-width="0.7" fill="none"/>

    <!-- the rider's pad on the front of the shell, and the drill lever before it -->
    <path d="M 0.4,-45.2 Q 6.8,-48.2 13,-44.6 Q 12.6,-42.6 6.8,-43 Q 0.6,-43 0.4,-45.2 Z" fill="#8a4b2e" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 2.2,-45.2 Q 6.8,-47 11,-45" stroke="#c97a4a" stroke-width="0.9" fill="none"/>
    <path d="M 13.8,-41.6 L 14.6,-50.4" stroke="#2a1a2e" stroke-width="2.4" fill="none"/>
    <path d="M 13.8,-41.6 L 14.6,-50.4" stroke="#8a88a6" stroke-width="1.1" fill="none"/>
    <circle cx="14.7" cy="-51" r="1.7" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle cx="14.2" cy="-51.6" r="0.5" fill="#ff9a7e"/>

    <!-- tall ears, the far one darker -->
    <path d="M 17,-34.4 C 14.2,-38 13.2,-42.6 14.2,-45.6 C 16.8,-44 18.6,-39.6 19.4,-35.4 Z" fill="#c99a86" stroke="#2a1a2e" stroke-width="0.8"/>
    <!-- the long head, a headlamp strapped on, and a pink snout -->
    <use href="#head" fill="#e7c2ad" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#headClip)">
      <path d="M 10,-26.2 C 18,-24.4 27,-24.6 38,-26.4 V -18 H 10 Z" fill="#c99a86"/>
      <path d="M 18.4,-35.4 C 23.6,-35 28.4,-31.6 31.6,-28" stroke="#fff4dc" stroke-width="1" fill="none"/>
      <!-- scaly cap down its brow -->
      <path d="M 13,-36 C 18,-38.6 24.6,-35.6 29.4,-30 L 26.4,-28.8 C 22.6,-32.6 18,-34.2 13.4,-33 Z" fill="#e8b07a"/>
      <path d="M 17.6,-36.4 L 18.6,-33.6 M 21.6,-35.4 L 22,-32.4 M 25.4,-33.4 L 25,-30.6" stroke="#9a6235" stroke-width="0.6" fill="none"/>
      <!-- the lamp's strap -->
      <path d="M 24.4,-36 L 19.8,-21" stroke="#3e3c52" stroke-width="1.6" fill="none"/>
    </g>
    <path d="M 22.4,-25.4 Q 24,-24.4 25.8,-25.2" stroke="#8f6456" stroke-width="0.6" fill="none"/>
    <ellipse cx="34.8" cy="-23.2" rx="2.1" ry="1.7" fill="#ff8fa8" stroke="#2a1a2e" stroke-width="0.7"/>
    <ellipse cx="35.3" cy="-23.8" rx="0.6" ry="0.4" fill="#ffd6ea"/>
    <circle cx="23.2" cy="-29.2" r="2" fill="#2a1a2e"/>
    <circle cx="23.9" cy="-29.9" r="0.8" fill="#ffffff"/>
    <circle cx="22.6" cy="-28.5" r="0.35" fill="#ffffff"/>
    <ellipse cx="21.2" cy="-26.4" rx="1.7" ry="0.9" fill="#ff8fa8" opacity="0.7"/>
    <!-- the near ear -->
    <path d="M 19.4,-34.8 C 17.8,-39 17.8,-44 19.6,-47 C 22,-44.6 22.8,-39.8 22.4,-35.6 Z" fill="#e7c2ad" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 20.2,-36.6 C 19.4,-39.6 19.6,-42.8 20.4,-44.6" stroke="#ff9a7e" stroke-width="0.9" fill="none"/>

    <!-- the miner's headlamp on its brow, ahead of the ears -->
    <rect x="23" y="-36.6" width="5.6" height="4.2" rx="1.1" transform="rotate(32 25.8 -34.5)" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle cx="27.6" cy="-33.2" r="2.1" fill="#fff4b0" stroke="#2a1a2e" stroke-width="0.6"/>
    <circle cx="27.2" cy="-33.8" r="0.7" fill="#ffffff"/>
    <path d="M 29.6,-35.2 L 31.4,-36.4 M 30.2,-33 L 32.4,-33.2" stroke="#fff4b0" stroke-width="0.7" fill="none"/>

    <!-- claws over the hull's rim -->
    <path d="M 12.4,-26.2 C 14.6,-27.4 18.4,-27 19.8,-25.4 L 19.4,-23.6 L 18.2,-24.4 L 17.2,-23 L 16,-24 L 14.8,-22.8 L 13.8,-24 C 12.6,-24.2 12,-25.2 12.4,-26.2 Z" fill="#c99a86" stroke="#2a1a2e" stroke-width="0.7"/>
  </g>
</svg>
