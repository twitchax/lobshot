<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="-13 -13 26 26">
  <!-- Flarecrow's cart wheel: an iron tire on a wooden wheel with six spokes and a brass hub.
       Origin = axle; spins (the spokes make rotation readable). -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.49" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linecap="round"><g transform="scale(1.14)">
    <!-- Ring shading only: it spins, and a baked light would spin with it. -->
    <circle r="9.2" fill="#3e3c52"/>
    <circle r="8.1" fill="#5a5870"/>
    <g fill="#2e2c40"><circle cx="8.6" r="0.5"/><circle cx="-8.6" r="0.5"/><circle cy="8.6" r="0.5"/><circle cy="-8.6" r="0.5"/><circle cx="6.1" cy="6.1" r="0.5"/><circle cx="-6.1" cy="6.1" r="0.5"/><circle cx="6.1" cy="-6.1" r="0.5"/><circle cx="-6.1" cy="-6.1" r="0.5"/></g>
    <circle r="7.2" fill="#9a6236" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle r="6" fill="#3a2a2e"/>
    <g stroke="#2a1a2e" stroke-width="2.4"><path d="M 0,-6 V 6 M -5.2,-3 L 5.2,3 M -5.2,3 L 5.2,-3"/></g>
    <g stroke="#c98a4f" stroke-width="1.3"><path d="M 0,-6 V 6 M -5.2,-3 L 5.2,3 M -5.2,3 L 5.2,-3"/></g>
    <circle r="2.4" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle r="1" fill="#8a5a22"/>
  </g></g>
</svg>
