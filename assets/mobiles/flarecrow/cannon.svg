<svg xmlns="http://www.w3.org/2000/svg" width="34" height="18" viewBox="-6 -9 34 18">
  <!-- Flarecrow's flare mortar: a stubby red tube with brass bands and a brass lip, a lit signal
       flare loaded in its mouth. Origin = pivot (the brass swivel on the cart's tail post); drawn
       at aim 0 (pointing +x). Muzzle = (24, 0), the flare's lit cap.
       It only ever aims over the back (130 to 170), turned more than half round, so it is lit from
       +y: that side faces up when it fires. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.79" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="tube" d="M 1,-5 L 17.6,-5.4 L 17.6,5.4 L 1,5 Z"/>
    <clipPath id="tubeClip"><use href="#tube"/></clipPath>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the flare, its lit cap out of the mouth: where it leaves -->
    <rect x="17" y="-3.4" width="5.6" height="6.8" rx="1" fill="#ff6a2b" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 18,2 H 21.6" stroke="#ffb27e" stroke-width="0.9"/>
    <path d="M 21.4,-3.4 H 22.8 Q 24.4,-3.4 24.4,0 Q 24.4,3.4 22.8,3.4 H 21.4 Z" fill="#fff1a8" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 25.4,0 L 26.4,-1.2 L 26.4,1.2 Z M 24.8,-2.6 L 26,-3.6 M 24.8,2.6 L 26,3.6" stroke="#ffd34a" stroke-width="0.7" fill="#ffd34a"/>
    <!-- tube -->
    <use href="#tube" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#tubeClip)">
      <path d="M 0,-6 H 18 V -1.6 L 0,-1.2 Z" fill="#b93a2c"/>
      <path d="M 2,3 L 16.8,3.4" stroke="#ff9a7e" stroke-width="1.1" fill="none"/>
    </g>
    <rect x="6" y="-5.6" width="2.6" height="11.2" rx="0.8" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.7"/>
    <rect x="11.2" y="-5.8" width="2.6" height="11.6" rx="0.8" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 6.8,-4.8 V -1.4 M 12,-5 V -1.6" stroke="#b9822c" stroke-width="0.8"/>
    <path d="M 6.8,1.4 V 4.6 M 12,1.6 V 4.8" stroke="#fff3b0" stroke-width="0.6"/>
    <!-- the brass lip -->
    <rect x="16.4" y="-6.6" width="3.2" height="13.2" rx="1.2" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 17.4,-5.6 V -1.6" stroke="#b9822c" stroke-width="0.9"/>
    <path d="M 17.4,1.6 V 5.4" stroke="#fff1a8" stroke-width="0.7"/>
    <!-- swivel -->
    <circle r="4.6" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 4.6,0 A 4.6 4.6 0 0 0 -4.6,0 A 4.8 3.2 0 0 1 4.6,0 Z" fill="#b9822c"/>
    <circle r="1.6" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.6"/>
    <path d="M 3,1.6 A 3.4 3.4 0 0 1 1,3.2" stroke="#fff3b0" stroke-width="0.9" fill="none"/>
  </g>
</svg>
