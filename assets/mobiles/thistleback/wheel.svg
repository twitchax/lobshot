<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="-11 -11 22 22">
  <!-- Thistleback's barrow wheel: a knobbly rubber tire on a spoked rim. Origin = axle; spins (the
       knobs and spokes make rotation readable). -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.49" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linecap="round">
    <!-- Ring shading only: it spins, and a baked light would spin with it. -->
    <circle r="9.3" fill="#3e3c52"/>
    <circle r="8.2" fill="#4c4a64"/>
    <g stroke="#2e2c40" stroke-width="1"><path d="M 8,0 L 9.2,0"/><path d="M 6.9,4 L 8,4.6"/><path d="M 4,6.9 L 4.6,8"/><path d="M 0,8 L 0,9.2"/><path d="M -4,6.9 L -4.6,8"/><path d="M -6.9,4 L -8,4.6"/><path d="M -8,0 L -9.2,0"/><path d="M -6.9,-4 L -8,-4.6"/><path d="M -4,-6.9 L -4.6,-8"/><path d="M 0,-8 L 0,-9.2"/><path d="M 4,-6.9 L 4.6,-8"/><path d="M 6.9,-4 L 8,-4.6"/></g>
    <circle r="7.2" fill="#5a5870"/>
    <circle r="6.2" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle r="5.2" fill="#c98a2e"/>
    <g stroke="#6e4224" stroke-width="1.3"><path d="M 0,-5.2 V 5.2 M -5.2,0 H 5.2 M -3.7,-3.7 L 3.7,3.7 M -3.7,3.7 L 3.7,-3.7"/></g>
    <circle r="2" fill="#3f8f4a" stroke="#2a1a2e" stroke-width="0.6"/>
    <circle r="0.8" fill="#2c6a38"/>
  </g>
</svg>
