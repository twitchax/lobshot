<svg xmlns="http://www.w3.org/2000/svg" width="80" height="62" viewBox="-40 -58 80 62">
  <!-- Tuskrack body: a walrus riding a tank-sled. The front ski on its sprung strut, the walrus
       sitting in the sled's tub (behind its near wall), the tub with its frost-blue paint, gold
       trim and headlamp, then what hangs over the tub's rim: the walrus's flipper, its tusks, the
       rack's harness and the rider's saddle. The rocket rack is the cannon; the snow track is its
       own part, and its wheels spin.
       Origin = ground contact center (= rig.ron body frame). Light from upper-left. -->
  <defs>
    <filter id="ol" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="14" intercept="-0.25"/></feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/><feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="tub" d="M -35.4,-25 L 17,-25 C 24,-25 29.6,-21.6 32,-15.6 L 33,-12.6 L -31,-12.6 C -33.8,-12.6 -35.4,-14.6 -35.4,-17.4 Z"/>
    <clipPath id="tubClip"><use href="#tub"/></clipPath>
    <path id="walrus" d="M -28,-22 C -29.6,-31 -24.6,-39 -15,-41.8 C -7,-44 1,-44.6 8.6,-43 C 13.4,-45.4 21.8,-44.6 25.4,-38.8 C 28.4,-34.4 28.2,-29.4 25.4,-25.6 L 23,-22 Z"/>
    <clipPath id="walrusClip"><use href="#walrus"/></clipPath>
    <radialGradient id="tubLight" cx="-20" cy="-26" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6f6ff" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#e6f6ff" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#14203a" stop-opacity="0"/>
      <stop offset="1" stop-color="#14203a" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <!-- the front ski: a sprung strut down to a gold runner curled up at the tip -->
    <path d="M 21.4,-14 L 23.4,-3.4" stroke="#2a1a2e" stroke-width="3.6" fill="none"/>
    <path d="M 21.4,-14 L 23.4,-3.4" stroke="#8a88a6" stroke-width="1.8" fill="none"/>
    <path d="M 20.6,-11.6 L 24.4,-12.2 M 21.2,-9 L 25,-9.6 M 21.8,-6.4 L 25.6,-7" stroke="#2a1a2e" stroke-width="1" fill="none"/>
    <path d="M 9,-1.4 H 30 C 34.6,-1.4 37.2,-4 36.8,-7.8 C 36.6,-9.8 34.8,-10.8 33.4,-9.8" stroke="#2a1a2e" stroke-width="4.6" fill="none"/>
    <path d="M 9,-1.4 H 30 C 34.6,-1.4 37.2,-4 36.8,-7.8 C 36.6,-9.8 34.8,-10.8 33.4,-9.8" stroke="#e9b949" stroke-width="2.8" fill="none"/>
    <path d="M 10.4,-2.2 H 29.6 C 33.4,-2.2 35.6,-4.2 35.8,-7" stroke="#fff1a8" stroke-width="0.8" fill="none"/>
    <rect x="20.4" y="-4.6" width="6.2" height="3" rx="0.8" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.7"/>

    <!-- the walrus, sitting in the tub: one round body, head and all -->
    <use href="#walrus" fill="#b98a78" stroke="#2a1a2e" stroke-width="0.9"/>
    <g clip-path="url(#walrusClip)">
      <path d="M -32,-31 C -12,-27.6 8,-28.4 32,-33 V -18 H -32 Z" fill="#9a6c5c"/>
      <path d="M -21.6,-38.6 C -14,-42.6 -4,-43.6 5.4,-42.4" stroke="#e0b8a6" stroke-width="1.3" fill="none"/>
      <path d="M 12.4,-42.4 C 16.8,-44 21.4,-43 24,-39.6" stroke="#e0b8a6" stroke-width="1.1" fill="none"/>
      <!-- skin folds at the neck -->
      <path d="M 9.4,-42.2 C 10.6,-38 10.6,-33 9.4,-28.6 M 5.6,-43 C 6.6,-39 6.6,-34.6 5.8,-30.6" stroke="#8f6456" stroke-width="0.7" fill="none"/>
      <path d="M -19,-34 Q -16,-35.6 -13,-34.2 M -12,-38 Q -9,-39.6 -6,-38.2" stroke="#8f6456" stroke-width="0.6" fill="none"/>
    </g>
    <!-- heavy brow and a small bright eye -->
    <path d="M 14.8,-40.4 Q 17.8,-42.2 20.8,-40.2" stroke="#2a1a2e" stroke-width="1.6" fill="none"/>
    <path d="M 14.8,-40.4 Q 17.8,-42.2 20.8,-40.2" stroke="#8f6456" stroke-width="0.7" fill="none"/>
    <circle cx="18" cy="-37.4" r="1.9" fill="#2a1a2e"/>
    <circle cx="18.6" cy="-38.1" r="0.75" fill="#ffffff"/>
    <circle cx="17.4" cy="-36.6" r="0.35" fill="#ffffff"/>
    <ellipse cx="15.6" cy="-34.2" rx="1.9" ry="1" fill="#ff8fa8" opacity="0.75"/>

    <!-- the tub: near wall, trim, rivets, headlamp -->
    <use href="#tub" fill="#4a78a8" stroke="#2a1a2e" stroke-width="1"/>
    <g clip-path="url(#tubClip)">
      <path d="M -40,-17.4 H 40 V -10 H -40 Z" fill="#345d8c"/>
      <path d="M -34,-23.6 H 17.6 C 22.6,-23.6 26.6,-21.6 28.6,-18.4" stroke="#a8d4f4" stroke-width="1.1" fill="none"/>
      <path d="M -40,-20.2 H 40" stroke="#b9822c" stroke-width="2.2"/>
      <path d="M -40,-20.6 H 40" stroke="#e9b949" stroke-width="1.2"/>
      <rect x="-40" y="-26" width="80" height="16" fill="url(#tubLight)"/>
    </g>
    <g fill="#24395c"><circle cx="-28" cy="-15" r="0.7"/><circle cx="-17" cy="-15" r="0.7"/><circle cx="-6" cy="-15" r="0.7"/><circle cx="5" cy="-15" r="0.7"/><circle cx="16" cy="-15" r="0.7"/><circle cx="26" cy="-15" r="0.7"/></g>
    <rect x="-36.4" y="-26.6" width="54" height="3" rx="1.3" fill="#d8ecfa" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -34.6,-26 Q -31,-28.6 -27.4,-26.4 Q -23.6,-28.4 -20,-26.4" fill="#ffffff" stroke="#2a1a2e" stroke-width="0.6"/>
    <!-- headlamp in the cowl's nose -->
    <circle cx="28.6" cy="-19.4" r="2.6" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.7"/>
    <circle cx="28.9" cy="-19.4" r="1.7" fill="#fff4b0"/>
    <circle cx="28.4" cy="-20" r="0.6" fill="#ffffff"/>
    <!-- team roundel -->
    <circle cx="-23" cy="-17.6" r="3" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="-23" cy="-17.6" r="2" fill="#e8434f"/>
    <path transform="translate(-23,-17.6) scale(0.42)" d="M 0.9,0 A 0.9 0.9 0 0 0 -0.9,0 A 1.8 1.8 0 0 0 2.7,0 A 2.7 2.7 0 0 0 -2.7,0 A 3.6 3.6 0 0 0 4.5,0" stroke="#fff1d0" stroke-width="1.6" fill="none"/>

    <!-- the walrus's flipper, flopped over the rim -->
    <path d="M 3,-29.6 C 7.6,-29.4 12.4,-27.4 14.8,-23.4 C 11.6,-22 6,-23 2.4,-25.6 Z" fill="#9a6c5c" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 8,-24.2 L 9.4,-22.8 M 11,-24 L 12.4,-22.6" stroke="#6e4a3e" stroke-width="0.7" fill="none"/>
    <!-- whiskered muzzle and the tusks, hanging over the cowl -->
    <path d="M 20.2,-28.6 C 20.6,-22.4 21.6,-18.2 23.2,-14.8 C 24.4,-17.8 25,-22.4 24.6,-28.6 Z" fill="#fff4dc" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 23.4,-28 C 23.8,-23 23.6,-19.6 23.2,-16.8" stroke="#e3cfa6" stroke-width="1" fill="none"/>
    <path d="M 24.6,-28.6 C 25.2,-22.6 26.4,-18.6 28,-15.6 C 29,-18.6 29.4,-22.8 28.8,-28.6 Z" fill="#fff4dc" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 27.6,-28 C 28,-23.2 27.8,-20 27.6,-17.6" stroke="#e3cfa6" stroke-width="1" fill="none"/>
    <ellipse cx="20.6" cy="-30.8" rx="4.4" ry="3.4" fill="#e7c2ad" stroke="#2a1a2e" stroke-width="0.8"/>
    <ellipse cx="25.4" cy="-31.4" rx="4.2" ry="3.4" fill="#e7c2ad" stroke="#2a1a2e" stroke-width="0.8"/>
    <g fill="#8f6456"><circle cx="18.6" cy="-31.4" r="0.45"/><circle cx="20.4" cy="-30" r="0.45"/><circle cx="22" cy="-31.6" r="0.45"/><circle cx="24.4" cy="-30.4" r="0.45"/><circle cx="26.2" cy="-32" r="0.45"/><circle cx="27.4" cy="-30.4" r="0.45"/></g>
    <path d="M 29.2,-31.6 L 32,-32.4 M 29.4,-30.2 L 32.2,-30 M 16.6,-30.8 L 14.2,-30.2" stroke="#2a1a2e" stroke-width="0.6" fill="none"/>
    <ellipse cx="25" cy="-34.6" rx="2.2" ry="1.3" fill="#5a3a34" stroke="#2a1a2e" stroke-width="0.6"/>

    <!-- the rack's harness: a leather strap round the walrus, an iron plate on its back and the
         stubby post the rack swivels on -->
    <path d="M -9.4,-43.2 C -11.6,-37 -11.6,-30.6 -10.2,-25 L -5.6,-25 C -7,-30.6 -7,-37 -4.8,-43.6 Z" fill="#8a4b2e" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -8.6,-41.6 C -10.2,-36.6 -10.2,-31 -9.2,-26.4" stroke="#c97a4a" stroke-width="0.6" stroke-dasharray="1.2 1.1" fill="none"/>
    <rect x="-10.6" y="-33.4" width="4.6" height="3.6" rx="0.8" fill="none" stroke="#2a1a2e" stroke-width="2"/>
    <rect x="-10.6" y="-33.4" width="4.6" height="3.6" rx="0.8" fill="none" stroke="#e9b949" stroke-width="1"/>
    <path d="M -2.8,-43.4 L -1.8,-52.4 L 1.8,-52.4 L 2.8,-43.4 Z" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -1.2,-51.2 L -1.8,-44.6" stroke="#8a88a6" stroke-width="0.7" fill="none"/>
    <path d="M -8.6,-44.4 L 7.8,-44.6 L 6.4,-42 L -7.2,-41.8 Z" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -7,-43.6 L 6.4,-43.8" stroke="#8a88a6" stroke-width="0.7" fill="none"/>
    <!-- the fireworks plunger the rider sets the rack off with -->
    <path d="M -16.6,-44.4 V -48" stroke="#2a1a2e" stroke-width="2.2" fill="none"/>
    <path d="M -16.6,-44.4 V -48" stroke="#8a88a6" stroke-width="1" fill="none"/>
    <rect x="-19.6" y="-49.4" width="6" height="2.2" rx="1" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.7"/>
    <rect x="-20" y="-45" width="6.8" height="4.6" rx="0.9" fill="#c98a4f" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -19.2,-43.6 H -14" stroke="#e8b07a" stroke-width="0.7" fill="none"/>
    <path d="M -18.4,-41.6 L -17.6,-43 L -16.8,-41.6 L -16,-43" stroke="#ffe14d" stroke-width="0.6" fill="none"/>
    <!-- the rider's saddle on the walrus's rump -->
    <path d="M -31,-36.4 Q -24.6,-41.4 -17.6,-39.2 Q -17.6,-36.8 -24.2,-36.6 Q -31,-35.6 -31,-36.4 Z" fill="#8a4b2e" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -29.2,-37.2 Q -24.2,-39.6 -19.6,-38.6" stroke="#c97a4a" stroke-width="0.9" fill="none"/>
  </g>
</svg>
