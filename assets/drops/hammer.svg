<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="-14 -14 28 28">
  <!-- Hammer: lands hard on whatever is under it. A big iron hammer, head down. Origin = the center. -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d">
        <feFuncA type="linear" slope="14" intercept="-0.25"/>
      </feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <g transform="rotate(-20)">
      <rect x="-2.2" y="-13" width="4.4" height="14" rx="1.2" fill="#c98a4f" stroke="#2a1a2e" stroke-width="0.8"/>
      <rect x="0.4" y="-12.6" width="1.4" height="13" fill="#9a6235"/>
      <rect x="-2.8" y="-13.8" width="5.6" height="3.2" rx="1" fill="#8a4b2e" stroke="#2a1a2e" stroke-width="0.7"/>
      <rect x="-10" y="0" width="20" height="12" rx="2.4" fill="#8a88a6" stroke="#2a1a2e" stroke-width="0.9"/>
      <rect x="-9.6" y="7.4" width="19.2" height="4.2" rx="1.6" fill="#5a5870"/>
      <rect x="-12.6" y="1.2" width="3.4" height="9.6" rx="1.2" fill="#b4b2cc" stroke="#2a1a2e" stroke-width="0.7"/>
      <rect x="9.2" y="1.2" width="3.4" height="9.6" rx="1.2" fill="#b4b2cc" stroke="#2a1a2e" stroke-width="0.7"/>
      <path d="M -6.6,2.6 H 6" stroke="#e6e4f4" stroke-width="1.2"/>
    </g>
  </g>
</svg>
