<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="-14 -14 28 28">
  <!-- Reverse: the wind turns around. A token: a teal coin with opposing arrows. Origin = the center. -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d">
        <feFuncA type="linear" slope="14" intercept="-0.25"/>
      </feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <circle r="12" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.9"/>
    <circle r="9.6" fill="#2bb3a3" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 9.6,0 A 9.6 9.6 0 0 1 -6,7.5 A 9.6 9.6 0 0 0 9.6,0 Z" fill="#1d7f80"/>
    <path d="M 6.8,6.8 A 9.6 9.6 0 0 1 -6.8,6.8" stroke="#1d7f80" stroke-width="1.6" fill="none"/>
    <path d="M -8.4,-3 A 9 9 0 0 1 -3,-8.4" stroke="#8be8cf" stroke-width="1.4" fill="none"/>
    <path d="M -7.4,-3 L -2.6,-7.6 V -5 H 6.6 V -1 H -2.6 V 1.6 Z" fill="#ffffff" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M 7.4,3 L 2.6,7.6 V 5 H -6.6 V 1 H 2.6 V -1.6 Z" fill="#ffffff" stroke="#2a1a2e" stroke-width="0.8"/>
  </g>
</svg>
