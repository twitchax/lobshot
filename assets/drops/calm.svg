<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="-14 -14 28 28">
  <!-- Calm: the wind dies. A token: a sky coin, its wind struck out. Origin = the center. -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d">
        <feFuncA type="linear" slope="14" intercept="-0.25"/>
      </feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <circle r="12" fill="#e6f4ff" stroke="#2a1a2e" stroke-width="0.9"/>
    <circle r="9.6" fill="#9ad6ff" stroke="#2a1a2e" stroke-width="0.7"/>
    <path d="M 9.6,0 A 9.6 9.6 0 0 1 -6,7.5 A 9.6 9.6 0 0 0 9.6,0 Z" fill="#5fb6e8"/>
    <path d="M 6.8,6.8 A 9.6 9.6 0 0 1 -6.8,6.8" stroke="#5fb6e8" stroke-width="1.6" fill="none"/>
    <path d="M -8.4,-3 A 9 9 0 0 1 -3,-8.4" stroke="#ffffff" stroke-width="1.4" fill="none"/>
    <path d="M -6.4,-3.4 H 3 C 5.4,-3.4 6,-6.4 4,-7 M -6.4,0.4 H 6 M -6.4,4.2 H 2 C 4.4,4.2 5,7 3,7.4" stroke="#2a1a2e" stroke-width="2.4" fill="none"/>
    <path d="M -6.4,-3.4 H 3 C 5.4,-3.4 6,-6.4 4,-7 M -6.4,0.4 H 6 M -6.4,4.2 H 2 C 4.4,4.2 5,7 3,7.4" stroke="#ffffff" stroke-width="1.1" fill="none"/>
    <path d="M -7.4,7.4 L 7.4,-7.4" stroke="#2a1a2e" stroke-width="3.6"/>
    <path d="M -7.4,7.4 L 7.4,-7.4" stroke="#e8434f" stroke-width="2"/>
  </g>
</svg>
