<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="-14 -14 28 28">
  <!-- Dynamite: blows up where it lands, and the wind carries it down. Three sticks, a band, a lit fuse. Origin = the center. -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d">
        <feFuncA type="linear" slope="14" intercept="-0.25"/>
      </feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 0,-8.6 C 0,-11.6 2.6,-12 4,-13.4" stroke="#2a1a2e" stroke-width="2.2" fill="none"/>
    <path d="M 0,-8.6 C 0,-11.6 2.6,-12 4,-13.4" stroke="#c97a4a" stroke-width="1" fill="none"/>
    <g stroke="#2a1a2e" stroke-width="0.8">
      <rect x="-9.6" y="-7" width="6.4" height="18" rx="2" fill="#e8434f"/>
      <rect x="3.2" y="-7" width="6.4" height="18" rx="2" fill="#e8434f"/>
      <rect x="-3.2" y="-9" width="6.4" height="19" rx="2" fill="#ff5a5a"/>
    </g>
    <path d="M -5,-6 V 9.4 M 8,-6 V 9.4 M 1.6,-8 V 8.4" stroke="#b52a3a" stroke-width="1.6"/>
    <path d="M -8.2,-5 V 8 M -1.8,-7 V 7" stroke="#ff9a9a" stroke-width="0.9"/>
    <rect x="-10.6" y="1" width="21.2" height="3.4" rx="1" fill="#8a4b2e" stroke="#2a1a2e" stroke-width="0.8"/>
    <path d="M -9.4,2 H 9.4" stroke="#c97a4a" stroke-width="0.7"/>
    <path d="M 5,-13 m 0,-3.6 L 6.2,-14.4 L 8.6,-15 L 7.2,-12.8 L 8.8,-11 L 6.4,-11.2 L 5.4,-8.8 L 4.4,-11 L 2,-10.6 L 3.2,-12.8 L 1.8,-14.8 L 4.2,-14.4 Z" fill="#ffe14d" stroke="#2a1a2e" stroke-width="0.6"/>
    <circle cx="5.2" cy="-12.8" r="1.2" fill="#ffffff"/>
  </g>
</svg>
