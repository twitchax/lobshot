    <use href="#farSkyline" fill="#35306a"/>
    <g clip-path="url(#farClip)" opacity="0.42">
      <rect width="2000" height="905" fill="url(#farLitA)" opacity="0.5"/>
      <rect width="2000" height="905" fill="url(#farLitB)"/>
      <rect width="2000" height="905" fill="url(#farLitC)"/>
