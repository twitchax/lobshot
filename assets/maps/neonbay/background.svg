<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100">
  <!-- Neonbay background: the harbour at night, seen from the rooftops: the moon up on the left
       (its light agrees with the sprites' and the terrain's, upper left), the city across the bay
       glowing on the far shore, cranes at the docks, a bridge's lights, and the water below. The
       whole map (2000 x 1100), shared by every variant. Soft and low in contrast so the terrain
       reads in front of it, and no per-pixel grain, which would bloat the PNG. The skylines'
       windows are patterns shown through each silhouette; the far shore's waterline is y = 905. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="905" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0c29"/>
      <stop offset="0.32" stop-color="#141645"/>
      <stop offset="0.58" stop-color="#25205c"/>
      <stop offset="0.76" stop-color="#432869"/>
      <stop offset="0.9" stop-color="#7a3d72"/>
      <stop offset="1" stop-color="#a9567a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="330" cy="170" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8ecff" stop-opacity="0.42"/>
      <stop offset="0.22" stop-color="#b9c4f0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#b9c4f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cityGlow" cx="1180" cy="905" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a8a" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#e0607e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e0607e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="760" x2="0" y2="935" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f08aa0" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#f08aa0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f08aa0" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="905" x2="0" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a2f68"/>
      <stop offset="0.25" stop-color="#2a2152"/>
      <stop offset="1" stop-color="#110f2e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f4f0ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f4f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="hazy" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.1"/></filter>
    <filter id="hazier" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <filter id="smear" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2 6"/></filter>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>

    <!-- the skylines' windows: lit ones only, a few to a tile, three tiles of coprime sizes -->
    <pattern id="farLitA" width="21" height="16" patternUnits="userSpaceOnUse"><rect x="4" y="4" width="2.4" height="3.2" fill="#ffd590"/></pattern>
    <pattern id="farLitB" width="34" height="26" patternUnits="userSpaceOnUse"><rect x="15" y="12" width="2.4" height="3.2" fill="#ffe2b0"/><rect x="25" y="4" width="2.4" height="3.2" fill="#ffb98a"/></pattern>
    <pattern id="farLitC" width="55" height="40" patternUnits="userSpaceOnUse"><rect x="38" y="22" width="2.4" height="3.2" fill="#bfe8ff"/><rect x="9" y="30" width="2.4" height="3.2" fill="#ffd590"/></pattern>
    <pattern id="midLitA" width="26" height="20" patternUnits="userSpaceOnUse"><rect x="5" y="5" width="3.2" height="4.2" fill="#ffcf80"/></pattern>
    <pattern id="midLitB" width="44" height="34" patternUnits="userSpaceOnUse"><rect x="19" y="15" width="3.2" height="4.2" fill="#ffe1a8"/><rect x="33" y="5" width="3.2" height="4.2" fill="#ffb07c"/></pattern>
    <pattern id="midLitC" width="70" height="52" patternUnits="userSpaceOnUse"><rect x="50" y="29" width="3.2" height="4.2" fill="#b8e6ff"/><rect x="12" y="40" width="3.2" height="4.2" fill="#ffcf80"/></pattern>
    <path id="farSkyline" d="M -20,905 V 807 H 33 V 805 H 94 V 805 H 153 V 811 H 180 V 808 H 248 V 815 H 313 V 813 H 360 V 809 H 410 V 813 H 437 V 805 H 475 V 814 H 535 V 802 H 596 V 798 H 649 V 766 H 675 V 778 H 710 V 730 H 779 V 696 H 818 V 691 H 868 V 646 H 879 V 590 H 882 L 885,532 L 888,590 H 892 V 646 H 903 V 700 H 936 V 639 H 947 V 602 H 953 L 956,521 L 959,602 H 964 V 639 H 975 V 652 H 988 V 624 H 1009 V 652 H 1022 V 585 H 1049 V 571 H 1076 V 664 H 1087 V 606 H 1099 L 1102,528 L 1105,606 H 1117 V 664 H 1128 V 529 H 1144 V 485 H 1179 V 529 H 1195 V 556 H 1225 V 660 H 1289 V 630 H 1319 V 646 H 1386 V 672 H 1397 V 643 H 1408 L 1411,569 L 1414,643 H 1425 V 672 H 1436 V 710 H 1458 V 666 H 1468 L 1471,614 L 1474,666 H 1483 V 710 H 1505 V 688 H 1558 V 738 H 1604 V 729 H 1632 V 760 H 1660 V 787 H 1722 V 782 H 1781 V 788 H 1834 V 795 H 1865 V 787 H 1898 V 795 H 1937 V 787 H 2007 V 795 H 2075 V 905 Z"/>
    <path id="midSkyline" d="M -20,913 V 844 H 42 V 845 H 133 V 844 H 199 V 845 H 244 V 835 H 317 V 830 H 357 V 802 H 397 V 812 H 474 V 725 H 569 V 712 H 584 V 668 H 603 L 606,618 L 609,668 H 628 V 712 H 643 V 749 H 655 V 694 H 665 L 668,622 L 671,694 H 680 V 749 H 692 V 677 H 707 V 617 H 742 V 677 H 757 V 673 H 777 V 637 H 797 L 800,559 L 803,637 H 823 V 673 H 843 V 676 H 862 V 621 H 870 L 873,571 L 876,621 H 883 V 676 H 902 V 737 H 993 V 791 H 1051 V 777 H 1124 V 824 H 1175 V 807 H 1230 V 835 H 1311 V 831 H 1360 V 800 H 1398 V 797 H 1443 V 799 H 1504 V 790 H 1584 V 789 H 1658 V 792 H 1718 V 771 H 1768 V 822 H 1852 V 846 H 1941 V 840 H 2000 V 851 H 2073 V 913 Z"/>
    <clipPath id="farClip"><use href="#farSkyline"/></clipPath>
    <clipPath id="midClip"><use href="#midSkyline"/></clipPath>
    <clipPath id="waterClip"><rect y="905" width="2000" height="195"/></clipPath>

    <!-- a ship-to-shore crane, its boom out over the water (origin at its feet, middle) -->
    <g id="shoreCrane">
      <path d="M -46,0 L -30,-150 H -22 L -38,0 Z M 38,0 L 22,-150 H 30 L 46,0 Z M -34,-90 H 34 V -82 H -34 Z M -34,-150 H 34 V -140 H -34 Z"/>
      <path d="M -30,-150 L -8,-210 H 0 L -20,-150 Z M 30,-150 L 8,-210 H 0 L 20,-150 Z"/>
      <path d="M -70,-168 H 150 V -158 H -70 Z M -8,-210 L 150,-168 H 136 L -8,-202 Z M -8,-210 L -70,-168 H -58 L -8,-202 Z"/>
      <path d="M 92,-158 V -110 M 98,-158 V -110" stroke="currentColor" stroke-width="1.4"/>
      <path d="M 84,-110 H 106 V -98 H 84 Z"/>
    </g>
  </defs>

