  <g id="layer-moon">
    <circle cx="330" cy="170" r="74" fill="#f2f0ff" opacity="0.16" filter="url(#soft)"/>
    <circle cx="330" cy="170" r="52" fill="#f6f2e2"/>
    <g fill="#d8d2c0" opacity="0.8">
      <circle cx="312" cy="156" r="11"/><circle cx="346" cy="186" r="8"/><circle cx="336" cy="148" r="5"/><circle cx="314" cy="190" r="4.5"/>
    </g>
    <!-- the shadow side, away from the sprites' light -->
    <path d="M 352,123 A 52 52 0 0 1 352,217 A 60 60 0 0 0 352,123 Z" fill="#c9c2b0" opacity="0.6"/>
  </g>

  <g id="layer-clouds">
