  <g id="layer-water">
    <rect y="905" width="2000" height="195" fill="url(#water)"/>
    <!-- the lights on the water: the skylines mirrored, squashed and smeared -->
    <g clip-path="url(#waterClip)" filter="url(#smear)" opacity="0.5">
      <g transform="translate(0,1357.5) scale(1,-0.5)">
        <g clip-path="url(#farClip)">
          <rect width="2000" height="905" fill="url(#farLitB)"/>
          <rect width="2000" height="905" fill="url(#farLitC)"/>
        </g>
        <g clip-path="url(#midClip)">
          <rect width="2000" height="920" fill="url(#midLitB)"/>
          <rect width="2000" height="920" fill="url(#midLitC)"/>
        </g>
      </g>
