<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1000" viewBox="0 0 1900 1000">
  <!-- Tumblehill background: summer farmland rolling away behind the training ground. The whole
       map (1900 x 1000), shared by every variant. Soft and low in contrast so the terrain reads in
       front of it, and no per-pixel grain, which would bloat the PNG. The sun is high on the left,
       so its light agrees with the sprites' (upper left). The pond's surface is y = 740: B's gaps
       look down into it; A's meadow hides it. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c9ae0"/>
      <stop offset="0.32" stop-color="#76b8ec"/>
      <stop offset="0.6" stop-color="#acd8f2"/>
      <stop offset="0.8" stop-color="#d8eff0"/>
      <stop offset="1" stop-color="#eef7e8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="260" cy="140" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbe4" stop-opacity="0.95"/>
      <stop offset="0.12" stop-color="#fff6cc" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#fff2d0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff2d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="500" x2="0" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef8f0" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#eef8f0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#eef8f0" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pond" x1="0" y1="740" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ed2e6"/>
      <stop offset="0.12" stop-color="#5eaed0"/>
      <stop offset="0.5" stop-color="#3a80b0"/>
      <stop offset="1" stop-color="#25507e"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fffbe6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fffbe6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="softer" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="hazy" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="cloudSoft" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <!-- a gentle brush wobble on organic edges only (hills, hedges) -->
    <filter id="brush" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.9"/>
    </filter>
    <!-- a towering summer cumulus: flat-bottomed, cel shaded, lit from the upper left -->
    <g id="cumulus">
      <path d="M -150,0 C -156,-20 -132,-34 -112,-24 C -112,-52 -78,-66 -56,-46 C -50,-84 -6,-96 14,-66 C 30,-92 74,-84 80,-50 C 102,-60 132,-46 128,-18 C 148,-16 160,-4 156,0 Z" fill="#cfe1f0"/>
      <path d="M -150,0 C -156,-20 -132,-34 -112,-24 C -112,-52 -78,-66 -56,-46 C -50,-84 -6,-96 14,-66 C 2,-78 -32,-76 -42,-44 C -58,-56 -90,-44 -92,-18 C -112,-22 -132,-12 -132,0 Z" fill="#fdfeff"/>
      <path d="M -138,-10 C -136,-20 -124,-26 -114,-20 M -102,-32 C -98,-48 -78,-56 -62,-46 M -42,-60 C -34,-78 -8,-84 6,-70" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M -80,0 C -50,-8 -10,-10 30,-8 C 70,-6 110,-8 140,-3 L 156,0 Z" fill="#b8d0e4"/>
    </g>
    <g id="puff">
      <path d="M -70,0 C -74,-12 -60,-20 -48,-14 C -46,-32 -20,-38 -8,-24 C 2,-40 32,-36 36,-18 C 52,-22 66,-12 62,0 Z" fill="#d6e6f2"/>
      <path d="M -70,0 C -74,-12 -60,-20 -48,-14 C -46,-32 -20,-38 -8,-24 C -16,-30 -34,-28 -38,-12 C -48,-16 -58,-10 -58,0 Z" fill="#fdfeff"/>
      <path d="M -30,0 C -10,-4 20,-5 50,-2 L 62,0 Z" fill="#c2d6e8"/>
    </g>
    <!-- trees and farm buildings, flat silhouettes in each layer's color (origin at the foot) -->
    <path id="tree" d="M -2.5,0 V -9 C -18,-8 -22,-24 -12,-32 C -12,-46 8,-50 14,-37 C 26,-32 22,-12 4,-9 V 0 Z"/>
    <path id="oak" d="M -4,0 V -18 C -34,-16 -44,-42 -26,-54 C -30,-76 -2,-88 14,-72 C 36,-80 52,-56 38,-40 C 46,-26 30,-14 6,-18 V 0 Z"/>
    <path id="bush" d="M -16,0 C -20,-8 -12,-16 -4,-12 C 0,-20 12,-18 13,-10 C 20,-10 22,-2 18,0 Z"/>
    <g id="barn">
      <path d="M -34,0 V -30 L -20,-46 H 20 L 34,-30 V 0 Z" fill="#c8564a"/>
      <path d="M -36,-29 L -21,-48 H 21 L 36,-29" fill="none" stroke="#f2ece0" stroke-width="3" stroke-linejoin="round"/>
      <path d="M -12,0 V -22 H 12 V 0 Z" fill="#9c3c36"/>
      <path d="M -12,-22 L 12,0 M 12,-22 L -12,0" stroke="#f2ece0" stroke-width="2"/>
      <path d="M -5,-38 H 5 V -30 H -5 Z" fill="#f2ece0"/>
      <path d="M 34,-30 V 0 H 18 V -30 L 20,-46 Z" fill="#a8463e" opacity="0.6"/>
    </g>
    <g id="silo">
      <path d="M -11,0 V -54 C -11,-66 11,-66 11,-54 V 0 Z" fill="#d8dce4"/>
      <path d="M 4,0 V -56 C 8,-58 11,-56 11,-54 V 0 Z" fill="#b6bccb"/>
      <path d="M -11,-40 H 11 M -11,-24 H 11" stroke="#a4abbc" stroke-width="1.6"/>
    </g>
    <path id="stack" d="M -14,0 C -16,-10 -10,-22 0,-24 C 10,-22 16,-10 14,0 Z"/>
  </defs>

  <g id="layer-sky">
    <rect width="1900" height="1000" fill="url(#sky)"/>
    <rect width="1900" height="1000" fill="url(#sunGlow)"/>
    <g opacity="0.4">
      <path d="M 260,140 L 640,1000 L 840,1000 Z" fill="url(#ray)" filter="url(#soft)"/>
      <path d="M 260,140 L 1100,1000 L 1260,1000 Z" fill="url(#ray)" filter="url(#soft)"/>
      <path d="M 260,140 L 1560,820 L 1640,700 Z" fill="url(#ray)" filter="url(#soft)"/>
    </g>
  </g>

  <g id="layer-sun">
    <circle cx="260" cy="140" r="64" fill="#fffbe0" filter="url(#soft)" opacity="0.85"/>
    <circle cx="260" cy="140" r="42" fill="#fffef2"/>
  </g>

  <g id="layer-high-clouds" filter="url(#softer)" opacity="0.7">
    <ellipse cx="820" cy="80" rx="320" ry="14" fill="#f4f9ff"/>
    <ellipse cx="1480" cy="120" rx="300" ry="16" fill="#eef6fd"/>
    <ellipse cx="1220" cy="44" rx="220" ry="10" fill="#f8fbff"/>
    <ellipse cx="540" cy="290" rx="200" ry="10" fill="#f6fbff"/>
  </g>

  <g id="layer-clouds" filter="url(#cloudSoft)">
    <use href="#cumulus" transform="translate(1330,330)"/>
    <use href="#cumulus" transform="translate(620,250) scale(0.8)"/>
    <use href="#cumulus" transform="translate(1760,250) scale(0.7)"/>
    <use href="#puff" transform="translate(140,360) scale(1.1)"/>
    <use href="#puff" transform="translate(980,430) scale(0.8)"/>
    <use href="#puff" transform="translate(1080,160) scale(0.7)"/>
    <use href="#puff" transform="translate(380,470) scale(0.6)"/>
  </g>

  <!-- a kite on a long string, riding the wind the windsocks show -->
  <g id="layer-kite" opacity="0.85">
    <path d="M 1530,212 C 1500,300 1470,420 1446,620" fill="none" stroke="#7a8aa6" stroke-width="1.2"/>
    <path d="M 1530,212 C 1540,236 1532,254 1546,270 C 1552,286 1540,300 1556,314" fill="none" stroke="#6a7a96" stroke-width="1.4"/>
    <g fill="#ef6a2e" opacity="0.9">
      <path d="M 1538,244 l 6,-4 l 2,7 Z"/><path d="M 1548,280 l 6,-3 l 1,7 Z"/><path d="M 1552,306 l 6,-2 l 0,7 Z"/>
    </g>
    <path d="M 1530,170 L 1552,196 L 1530,212 L 1510,192 Z" fill="#ea4a3c"/>
    <path d="M 1530,170 L 1552,196 L 1530,196 Z" fill="#ffd23e"/>
    <path d="M 1510,192 L 1530,212 L 1530,196 Z" fill="#3d86d8"/>
    <path d="M 1530,170 V 212 M 1510,192 H 1552" stroke="#5a2a2a" stroke-width="1.2" opacity="0.6"/>
  </g>

  <g id="layer-far" filter="url(#hazy)">
    <!-- the farthest downs, blue with distance -->
    <path filter="url(#brush)" d="M -10,600 C 80,572 170,556 270,566 C 360,576 420,600 520,592 C 640,582 700,548 820,546 C 940,544 1010,580 1120,584 C 1230,588 1300,556 1410,552 C 1530,548 1600,580 1700,578 C 1780,576 1840,560 1910,556 L 1910,780 L -10,780 Z" fill="#b2d8cc"/>
    <path filter="url(#brush)" d="M -10,600 C 80,572 170,556 270,566 C 360,576 420,600 520,592 C 640,582 700,548 820,546 C 940,544 1010,580 1120,584 C 1230,588 1300,556 1410,552 C 1530,548 1600,580 1700,578 C 1780,576 1840,560 1910,556" fill="none" stroke="#d0ece0" stroke-width="2" opacity="0.7"/>
    <g fill="#a4cec0">
      <use href="#tree" transform="translate(806,548) scale(0.5)"/>
      <use href="#tree" transform="translate(822,548) scale(0.4)"/>
      <use href="#tree" transform="translate(1400,554) scale(0.45)"/>
      <use href="#silo" transform="translate(566,590) scale(0.42)"/>
      <use href="#barn" transform="translate(542,592) scale(0.36)"/>
    </g>
  </g>

  <g id="layer-mid">
    <!-- the middle hills: a patchwork of fields, hedgerows between them -->
    <path filter="url(#brush)" d="M -10,650 C 90,622 180,606 300,612 C 420,618 470,644 580,640 C 700,636 760,606 880,606 C 1000,606 1060,640 1180,640 C 1290,640 1340,610 1450,604 C 1570,598 1640,628 1750,630 C 1820,632 1870,620 1910,612 L 1910,800 L -10,800 Z" fill="#9ccc8c"/>
    <!-- a wheat field and a fallow one, each the hill's own outline between two hedgerows -->
    <path d="M 300,612 C 420,618 470,644 580,640 L 600,639 L 600,800 L 300,800 Z" fill="#d6d48a" opacity="0.75" filter="url(#brush)"/>
    <path d="M 1180,640 C 1290,640 1340,610 1450,604 L 1460,603 L 1460,800 L 1180,800 Z" fill="#b8d48c" opacity="0.8" filter="url(#brush)"/>
    <g fill="#80b47a">
      <use href="#bush" transform="translate(296,616) scale(0.9)"/><use href="#bush" transform="translate(604,644) scale(0.9)"/>
      <use href="#bush" transform="translate(1176,644) scale(0.9)"/><use href="#bush" transform="translate(1464,608) scale(0.9)"/>
    </g>
    <g fill="#80b47a">
      <use href="#tree" transform="translate(880,610) scale(0.8)"/>
      <use href="#tree" transform="translate(906,612) scale(0.65)"/>
      <use href="#tree" transform="translate(1700,628) scale(0.7)"/>
      <use href="#oak" transform="translate(110,630) scale(0.8)"/>
    </g>
    <!-- the sun catches the crests -->
    <path filter="url(#brush)" d="M -10,650 C 90,622 180,606 300,612 C 420,618 470,644 580,640 C 700,636 760,606 880,606 C 1000,606 1060,640 1180,640 C 1290,640 1340,610 1450,604 C 1570,598 1640,628 1750,630 C 1820,632 1870,620 1910,612" fill="none" stroke="#c8e8ac" stroke-width="2.4" opacity="0.75"/>
    <!-- a farm on the east hill: barn, silo, and stacks in the stubble -->
    <use href="#silo" transform="translate(1560,606) scale(0.9)"/>
    <use href="#barn" transform="translate(1516,610) scale(0.85)"/>
    <g fill="#e0bc62">
      <use href="#stack" transform="translate(430,628) scale(0.7)"/>
      <use href="#stack" transform="translate(470,634) scale(0.6)"/>
      <use href="#stack" transform="translate(520,636) scale(0.65)"/>
    </g>
    <g fill="#c49a46">
      <path d="M 430,628 C 436,622 438,614 436,612 C 440,616 442,624 440,628 Z"/>
      <path d="M 470,634 C 475,629 477,622 475,620 C 479,624 480,630 479,634 Z"/>
      <path d="M 520,636 C 525,631 527,624 525,622 C 529,626 530,632 529,636 Z"/>
    </g>
  </g>

  <rect y="500" width="1900" height="240" fill="url(#haze)"/>

  <g id="layer-near">
    <!-- the near meadow down to the pond's far bank -->
    <path filter="url(#brush)" d="M -10,690 C 120,672 220,666 340,674 C 460,682 560,700 680,700 C 800,700 860,678 950,678 C 1040,678 1100,700 1220,700 C 1340,700 1440,682 1560,674 C 1680,666 1780,672 1910,690 L 1910,760 L -10,760 Z" fill="#88c27a"/>
    <path d="M -10,690 C 120,672 220,666 340,674 C 460,682 560,700 680,700 C 800,700 860,678 950,678 C 1040,678 1100,700 1220,700 C 1340,700 1440,682 1560,674 C 1680,666 1780,672 1910,690" fill="none" stroke="#b8e09a" stroke-width="2.4" opacity="0.7" filter="url(#brush)"/>
    <g fill="#74b06c">
      <use href="#tree" transform="translate(950,680)"/>
      <use href="#tree" transform="translate(982,682) scale(0.8)"/>
      <use href="#bush" transform="translate(700,702)"/><use href="#bush" transform="translate(1200,702)"/>
    </g>
    <!-- a far fence and practice targets on the bank across the pond -->
    <g stroke="#8a9a6a" stroke-width="2.2" stroke-linecap="round" opacity="0.8">
      <path d="M 700,726 V 712 M 730,726 V 712 M 810,726 V 712 M 840,726 V 712 M 1060,726 V 712 M 1090,726 V 712 M 1170,726 V 712 M 1200,726 V 712"/>
      <path d="M 696,717 H 744 M 806,717 H 844 M 1056,717 H 1094 M 1166,717 H 1204"/>
    </g>
    <g opacity="0.7">
      <circle cx="772" cy="702" r="9" fill="#e8ece0"/><circle cx="772" cy="702" r="5" fill="#d88a80"/><circle cx="772" cy="702" r="1.8" fill="#e8d890"/>
      <circle cx="1128" cy="702" r="9" fill="#e8ece0"/><circle cx="1128" cy="702" r="5" fill="#d88a80"/><circle cx="1128" cy="702" r="1.8" fill="#e8d890"/>
      <path d="M 767,710 L 764,724 M 777,710 L 780,724 M 1123,710 L 1120,724 M 1133,710 L 1136,724" stroke="#9a8a6a" stroke-width="2"/>
    </g>
    <!-- the far bank's grass edge -->
    <path d="M -10,732 C 300,727 600,730 950,728 C 1300,726 1600,730 1910,732 L 1910,742 L -10,742 Z" fill="#78b46c"/>
  </g>

  <g id="layer-pond">
    <rect y="740" width="1900" height="260" fill="url(#pond)"/>
    <rect y="738" width="1900" height="4" fill="#e6f8fa" opacity="0.85" filter="url(#hazy)"/>
    <!-- reeds on the far bank, mirrored in the water -->
    <g fill="#5e9a54">
      <path d="M 716,740 C 718,724 720,716 722,710 C 723,718 724,728 724,740 Z M 728,740 C 732,728 736,720 740,716 C 738,724 736,732 736,740 Z"/>
      <path d="M 1164,740 C 1166,726 1168,718 1170,712 C 1171,720 1172,730 1172,740 Z M 1176,740 C 1180,730 1184,722 1188,718 C 1186,726 1184,734 1184,740 Z"/>
    </g>
    <g fill="#9ecfd8" opacity="0.5">
      <path d="M 716,742 C 718,752 720,758 722,762 C 723,756 724,748 724,742 Z M 1164,742 C 1166,750 1168,756 1170,760 C 1171,754 1172,748 1172,742 Z"/>
    </g>
    <!-- ripples and glints -->
    <g stroke="#c8eef4" stroke-width="1.8" stroke-linecap="round" opacity="0.6">
      <path d="M 726,756 h 30 M 770,770 h 22 M 734,788 h 36 M 800,800 h 26 M 1080,758 h 34 M 1130,774 h 24 M 1100,794 h 40 M 300,760 h 60 M 1500,766 h 70"/>
    </g>
    <g stroke="#8ecde0" stroke-width="1.4" stroke-linecap="round" opacity="0.4">
      <path d="M 740,830 h 30 M 790,846 h 22 M 1110,836 h 36 M 720,872 h 24 M 1150,880 h 20 M 760,920 h 30 M 1120,930 h 26"/>
    </g>
    <!-- a duck, out on the water -->
    <g transform="translate(1150,740)">
      <path d="M -11,0 C -12,-6 -6,-9 2,-8 C 3,-13 7,-15 10,-13 C 13,-11 13,-7 10,-6 L 14,-5 L 10,-3 C 10,0 6,2 0,2 C -6,2 -10,1 -11,0 Z" fill="#fbf6ea" stroke="#5a6a7a" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M 10,-6 L 14,-5 L 10,-3 Z" fill="#ff9a3a"/>
      <circle cx="8.6" cy="-10.4" r="0.9" fill="#2a1a2e"/>
      <path d="M -6,-3 C -3,-6 2,-5 3,-2" fill="none" stroke="#c8c0b0" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M -14,4 h 30" stroke="#c8eef4" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <g id="layer-birds" fill="none" stroke="#5a7a9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.65">
    <path d="M 760,380 q 6,-6 11,0 q 5,-6 11,0"/>
    <path d="M 796,398 q 5,-5 8,0 q 4,-5 8,0"/>
    <path d="M 740,404 q 4,-4 7,0 q 3,-4 7,0"/>
    <path d="M 1180,520 q 5,-5 9,0 q 4,-5 9,0"/>
  </g>
</svg>
