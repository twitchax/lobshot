<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40" viewBox="-40 -20 80 40">
  <!-- Teleport: the shot carries its shooter to where it lands. A dotted flight into a portal. One slot per 40 px of width; origin = the center. -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d">
        <feFuncA type="linear" slope="14" intercept="-0.25"/>
      </feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tileClip">
      <rect x="-38.6" y="-18.6" width="77.2" height="37.2" rx="6"/>
    </clipPath>
  </defs>
  <g filter="url(#ol)">
    <rect x="-38.6" y="-18.6" width="77.2" height="37.2" rx="6" fill="#8f6ae0"/>
    <g clip-path="url(#tileClip)">
      <path d="M -38.6,-18.6 H 38.6 V -2 C 20,2 -20,-6 -38.6,0 Z" fill="#b598ff"/>
      <rect x="-38.6" y="14.6" width="77.2" height="4" fill="#6a48b8"/>
      <path d="M -34.6,-16.4 H 34.6" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <g fill="#ffffff" stroke="#2a1a2e" stroke-width="0.7">
      <circle cx="-28" cy="9" r="2.4"/>
      <circle cx="-21" cy="0" r="2.2"/>
      <circle cx="-13" cy="-6.4" r="2"/>
      <circle cx="-4" cy="-9.6" r="1.9"/>
      <circle cx="5" cy="-9.4" r="1.8"/>
    </g>
    <ellipse cx="22" cy="3" rx="11" ry="13" fill="#ff5fd0" stroke="#2a1a2e" stroke-width="0.9"/>
    <ellipse cx="22.6" cy="3" rx="8" ry="9.8" fill="#9b6bff"/>
    <ellipse cx="23" cy="3.2" rx="5.2" ry="6.6" fill="#8ff0ff"/>
    <ellipse cx="23.4" cy="3.4" rx="2.4" ry="3.2" fill="#ffffff"/>
    <path d="M 14,-4 C 16,-9 22,-11 27,-8" stroke="#ffd6f2" stroke-width="1.2" fill="none"/>
    <path d="M 8,-15 L 8.8,-13 L 10.8,-12.4 L 8.8,-11.6 L 8,-9.6 L 7.2,-11.6 L 5.2,-12.4 L 7.2,-13 Z" fill="#fff4b0" stroke="#2a1a2e" stroke-width="0.5"/>
    <path d="M 34,10 L 34.6,11.6 L 36.2,12 L 34.6,12.6 L 34,14.2 L 33.4,12.6 L 31.8,12 L 33.4,11.6 Z" fill="#fff4b0" stroke="#2a1a2e" stroke-width="0.5"/>
  </g>
</svg>
