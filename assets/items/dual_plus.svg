<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40" viewBox="-40 -20 80 40">
  <!-- Dual+: the selected shot, then the other. Two different shells and a plus. One slot per 40 px of width; origin = the center. -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d">
        <feFuncA type="linear" slope="14" intercept="-0.25"/>
      </feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tileClip">
      <rect x="-38.6" y="-18.6" width="77.2" height="37.2" rx="6"/>
    </clipPath>
  </defs>
  <g filter="url(#ol)">
    <rect x="-38.6" y="-18.6" width="77.2" height="37.2" rx="6" fill="#f5b23c"/>
    <g clip-path="url(#tileClip)">
      <path d="M -38.6,-18.6 H 38.6 V -2 C 20,2 -20,-6 -38.6,0 Z" fill="#ffd27a"/>
      <rect x="-38.6" y="14.6" width="77.2" height="4" fill="#c98a24"/>
      <path d="M -34.6,-16.4 H 34.6" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(-19,0.6) rotate(28)">
      <path d="M -5,-3 C -5,-9.6 -2.2,-12.8 0,-13.8 C 2.2,-12.8 5,-9.6 5,-3 Z" fill="#e8434f" stroke="#2a1a2e" stroke-width="0.9"/>
      <path d="M 2,-12 C 3.8,-10 5,-7 5,-3 H 2.4 Z" fill="#000000" opacity="0.22"/>
      <path d="M -3.4,-5 C -3.4,-8.4 -2,-10.8 -0.6,-11.8" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.7"/>
      <rect x="-5" y="-3.4" width="10" height="13" fill="#e9b949" stroke="#2a1a2e" stroke-width="0.9"/>
      <rect x="1.8" y="-3" width="3" height="12.4" fill="#b9822c"/>
      <rect x="-3.6" y="-3" width="1.4" height="12.4" fill="#fff1a8"/>
      <rect x="-5" y="0.4" width="10" height="2" fill="#2bb3a3" stroke="#2a1a2e" stroke-width="0.7"/>
      <rect x="-6.2" y="9" width="12.4" height="3.2" rx="1" fill="#b9822c" stroke="#2a1a2e" stroke-width="0.9"/>
    </g>
    <path transform="translate(0,1)" d="M -2.304,-6.4 H 2.304 V -2.304 H 6.4 V 2.304 H 2.304 V 6.4 H -2.304 V 2.304 H -6.4 V -2.304 H -2.304 Z" fill="#ffffff" stroke="#2a1a2e" stroke-width="0.8"/>
    <circle cx="19" cy="3" r="9" fill="#5a5870" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 28,3 A 9 9 0 0 1 13,10 A 9 9 0 0 0 28,3 Z" fill="#3e3c52"/>
    <ellipse cx="15.4" cy="-0.6" rx="2.8" ry="1.8" transform="rotate(-35 15.4 -0.6)" fill="#b4b2cc"/>
    <rect x="17" y="-8.6" width="4.4" height="3.4" rx="0.8" fill="#8a88a6" stroke="#2a1a2e" stroke-width="0.8"/>
