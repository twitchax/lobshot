<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="-20 -20 40 40">
  <!-- Heal: a small heal. A heart with a plus. One slot per 40 px of width; origin = the center. -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d">
        <feFuncA type="linear" slope="14" intercept="-0.25"/>
      </feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tileClip">
      <rect x="-18.6" y="-18.6" width="37.2" height="37.2" rx="6"/>
    </clipPath>
  </defs>
  <g filter="url(#ol)">
    <rect x="-18.6" y="-18.6" width="37.2" height="37.2" rx="6" fill="#5fcf8a"/>
    <g clip-path="url(#tileClip)">
      <path d="M -18.6,-18.6 H 18.6 V -2 C 10,2 -10,-6 -18.6,0 Z" fill="#8fe8ad"/>
      <rect x="-18.6" y="14.6" width="37.2" height="4" fill="#3a9e62"/>
      <path d="M -14.6,-16.4 H 14.6" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(0,1) scale(1.2)">
      <path d="M 0,10 C -4,6.6 -11,2 -11,-3.6 C -11,-8 -7.6,-10.6 -4.6,-10.6 C -2.4,-10.6 -0.8,-9.4 0,-7.6 C 0.8,-9.4 2.4,-10.6 4.6,-10.6 C 7.6,-10.6 11,-8 11,-3.6 C 11,2 4,6.6 0,10 Z" fill="#ff6f8f" stroke="#2a1a2e" stroke-width="0.9"/>
      <path d="M 11,-3.6 C 11,2 4,6.6 0,10 C 2.6,5.4 7.6,1.4 9.4,-4.4 Z" fill="#d94a6c"/>
      <ellipse cx="-5.6" cy="-5.6" rx="2.6" ry="1.6" transform="rotate(-30 -5.6 -5.6)" fill="#ffb0c4"/>
      <circle cx="-2.6" cy="-8" r="0.8" fill="#ffffff"/>
    </g>
    <path transform="translate(0.4,-0.6)" d="M -1.656,-4.6 H 1.656 V -1.656 H 4.6 V 1.656 H 1.656 V 4.6 H -1.656 V 1.656 H -4.6 V -1.656 H -1.656 Z" fill="#ffffff" stroke="#2a1a2e" stroke-width="0.8"/>
  </g>
</svg>
