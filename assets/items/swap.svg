<svg xmlns="http://www.w3.org/2000/svg" width="80" height="40" viewBox="-40 -20 80 40">
  <!-- Swap: trade places with your weakest living teammate. Two pawns and the arrows between them. One slot per 40 px of width; origin = the center. -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d">
        <feFuncA type="linear" slope="14" intercept="-0.25"/>
      </feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tileClip">
      <rect x="-38.6" y="-18.6" width="77.2" height="37.2" rx="6"/>
    </clipPath>
  </defs>
  <g filter="url(#ol)">
    <rect x="-38.6" y="-18.6" width="77.2" height="37.2" rx="6" fill="#2bb3a3"/>
    <g clip-path="url(#tileClip)">
      <path d="M -38.6,-18.6 H 38.6 V -2 C 20,2 -20,-6 -38.6,0 Z" fill="#6fe0cf"/>
      <rect x="-38.6" y="14.6" width="77.2" height="4" fill="#1d7f80"/>
      <path d="M -34.6,-16.4 H 34.6" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M -29,12 C -29,6 -26,3 -23,3 C -20,3 -17,6 -17,12 Z" fill="#ffcf3a" stroke="#2a1a2e" stroke-width="0.9"/>
    <circle cx="-23" cy="-1.6" r="4.4" fill="#ffcf3a" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -20,12 C -20,8 -21,5.4 -22,4.4 C -19,5 -17.4,8 -17,12 Z" fill="#e6a419"/>
    <circle cx="-24.6" cy="-3" r="1.2" fill="#fff0a8"/>
    <path d="M 17,12 C 17,6 20,3 23,3 C 26,3 29,6 29,12 Z" fill="#ff6f8f" stroke="#2a1a2e" stroke-width="0.9"/>
    <circle cx="23" cy="-1.6" r="4.4" fill="#ff6f8f" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 26,12 C 26,8 25,5.4 24,4.4 C 27,5 28.6,8 29,12 Z" fill="#d94a6c"/>
    <circle cx="21.4" cy="-3" r="1.2" fill="#ffd0dc"/>
    <path d="M -12,-6 C -6,-14 6,-14 10,-8.6 L 12.6,-11 L 13.4,-1.6 L 4.6,-3.4 L 7,-5.6 C 4,-9 -4,-9 -8,-3.6 Z" fill="#ffffff" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M 12,7 C 6,15 -6,15 -10,9.6 L -12.6,12 L -13.4,2.6 L -4.6,4.4 L -7,6.6 C -4,10 4,10 8,4.6 Z" fill="#ffffff" stroke="#2a1a2e" stroke-width="0.9"/>
  </g>
</svg>
