<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="-20 -20 40 40">
  <!-- Dig: this turn's shot carves bigger craters. A shovel in a dug mound. One slot per 40 px of width; origin = the center. -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d">
        <feFuncA type="linear" slope="14" intercept="-0.25"/>
      </feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tileClip">
      <rect x="-18.6" y="-18.6" width="37.2" height="37.2" rx="6"/>
    </clipPath>
  </defs>
  <g filter="url(#ol)">
    <rect x="-18.6" y="-18.6" width="37.2" height="37.2" rx="6" fill="#d09a52"/>
    <g clip-path="url(#tileClip)">
      <path d="M -18.6,-18.6 H 18.6 V -2 C 10,2 -10,-6 -18.6,0 Z" fill="#f0c27e"/>
      <rect x="-18.6" y="14.6" width="37.2" height="4" fill="#a06c34"/>
      <path d="M -14.6,-16.4 H 14.6" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M -15,14 C -12,6 -5,4 0,8 C 5,4 12,6 15,14 Z" fill="#7a4a2a" stroke="#2a1a2e" stroke-width="0.9"/>
    <path d="M -6,10.4 C -3,8.6 3,8.6 6,10.4" stroke="#4a2a1a" stroke-width="1.6" fill="none"/>
    <path d="M -12,10 C -9,7.4 -6,7 -3.6,7.4" stroke="#a8724a" stroke-width="1" fill="none"/>
    <g transform="rotate(32)">
      <rect x="-1.7" y="-17" width="3.4" height="16" rx="1" fill="#c98a4f" stroke="#2a1a2e" stroke-width="0.9"/>
      <rect x="0.4" y="-16.6" width="1.1" height="15.2" fill="#9a6235"/>
      <path d="M -4.4,-19.6 H 4.4 V -16.6 H -4.4 Z" fill="#8a4b2e" stroke="#2a1a2e" stroke-width="0.8"/>
      <path d="M -5.4,-2 H 5.4 V 4 C 5.4,8 2.6,10.6 0,11.6 C -2.6,10.6 -5.4,8 -5.4,4 Z" fill="#b4b2cc" stroke="#2a1a2e" stroke-width="0.9"/>
      <path d="M 2.4,-1.6 H 5.4 V 4 C 5.4,8 2.6,10.6 0,11.6 C 2,8 2.4,5 2.4,-1.6 Z" fill="#8a88a6"/>
      <path d="M -3.6,0 V 4.4" stroke="#ffffff" stroke-width="1" fill="none"/>
    </g>
    <g fill="#7a4a2a" stroke="#2a1a2e" stroke-width="0.6">
      <circle cx="-11" cy="-4" r="1.6"/>
      <circle cx="-7" cy="-9" r="1.2"/>
      <circle cx="11" cy="-2" r="1.4"/>
    </g>
  </g>
</svg>
