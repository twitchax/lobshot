<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="-20 -20 40 40">
  <!-- Wind Flip: the wind turns around. Wind streaks and a U-turn arrow. One slot per 40 px of width; origin = the center. -->
  <defs>
    <filter id="ol" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.82" result="b"/>
      <feComponentTransfer in="b" result="d">
        <feFuncA type="linear" slope="14" intercept="-0.25"/>
      </feComponentTransfer>
      <feFlood flood-color="#2a1a2e"/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tileClip">
      <rect x="-18.6" y="-18.6" width="37.2" height="37.2" rx="6"/>
    </clipPath>
  </defs>
  <g filter="url(#ol)">
    <rect x="-18.6" y="-18.6" width="37.2" height="37.2" rx="6" fill="#5fb6e8"/>
    <g clip-path="url(#tileClip)">
      <path d="M -18.6,-18.6 H 18.6 V -2 C 10,2 -10,-6 -18.6,0 Z" fill="#9ad6ff"/>
      <rect x="-18.6" y="14.6" width="37.2" height="4" fill="#3a86c0"/>
      <path d="M -14.6,-16.4 H 14.6" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </g>
  <g filter="url(#ol)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M -14,-11 H 2 M -12,-6 H -2" stroke="#ffffff" stroke-width="1.6" opacity="0.9"/>
    <path d="M -6,-1.4 H 4 C 10,-1.4 13.4,2 13.4,6.4 C 13.4,11 10,14 4,14 H -2 V 17 L -10,10.6 L -2,4.2 V 7.6 H 4 C 6.4,7.6 7.4,7 7.4,6.4 C 7.4,5.6 6.4,4.6 4,4.6 H -6 Z" fill="#ffffff" stroke="#2a1a2e" stroke-width="1"/>
    <path d="M 4,14 C 10,14 13.4,11 13.4,6.4 C 12,10 9,11.6 4,11.6 H -2 V 14 Z" fill="#c8e6ff"/>
  </g>
</svg>
