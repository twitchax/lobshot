# lobshot: cargo-make tasks. cargo-make is the one entry point for dev commands, and CI runs
# the same tasks, so "green locally" and "green in CI" mean the same thing.
#
#   cargo make ci        fmt-check + clippy (native and wasm, -D warnings) + nextest + client tests + determinism: the gate
#   cargo make test-client  the client's unit tests, on wasm32 in node
#   cargo make uat       ci + the #[ignore]d slow suites
#   cargo make codecov   coverage.lcov via llvm-cov
#   cargo make art       render assets/ into assets/gen/ (SVG to PNG, masks, map manifests)
#   cargo make dist      the release client bundle in dist/ (art, trunk, wasm-opt, brotli and gzip)
#   cargo make dev       a quick wasm-dev bundle, then the server on 127.0.0.1:8080
#   cargo make browser   the release bundle in headless Chrome against the real server
#   cargo xtask <task>   repo tooling (see xtask/)
#
# The client (`lobshot-client`) builds for wasm32 only, so the native tasks exclude it and
# `clippy-wasm` lints it for its real target.

[config]
# Run every task once at the root instead of once per workspace member.
default_to_workspace = false

# ── Tool installation ────────────────────────────────────────────────────────
# Large tools come prebuilt through `cargo binstall`, never built from source. Each install-* task
# runs only when its binary is missing (no network on every `cargo make test`); `tools-latest` moves
# them all to the newest release on purpose. `--force` when they do run: CI's rust-cache can restore
# binstall's install manifest without the binary, after which a plain install no-ops ("already
# installed") and the command fails.

[tasks.install-cargo-binstall]
# In CI the cargo-bins/cargo-binstall action provides it; locally, install it once by hand.
script = "command -v cargo-binstall >/dev/null || echo 'install cargo-binstall: https://github.com/cargo-bins/cargo-binstall'"

[tasks.install-nextest]
condition_script = ["! command -v cargo-nextest >/dev/null 2>&1"]
dependencies = ["install-cargo-binstall"]
command = "cargo"
args = ["binstall", "cargo-nextest", "--no-confirm", "--locked", "--force"]

[tasks.install-llvm-cov]
condition_script = ["! command -v cargo-llvm-cov >/dev/null 2>&1"]
dependencies = ["install-cargo-binstall"]
command = "cargo"
args = ["binstall", "cargo-llvm-cov", "--no-confirm", "--locked", "--force"]

[tasks.install-cargo-edit]
condition_script = ["! command -v cargo-upgrade >/dev/null 2>&1"]
dependencies = ["install-cargo-binstall"]
command = "cargo"
args = ["binstall", "cargo-edit", "--no-confirm", "--locked", "--force"]

[tasks.install-trunk]
condition_script = ["! command -v trunk >/dev/null 2>&1"]
dependencies = ["install-cargo-binstall"]
command = "cargo"
args = ["binstall", "trunk", "--no-confirm", "--locked", "--force"]

[tasks.install-wasmtime]
condition_script = ["! command -v wasmtime >/dev/null 2>&1"]
dependencies = ["install-cargo-binstall"]
command = "cargo"
args = ["binstall", "wasmtime-cli", "--no-confirm", "--locked", "--force"]

[tasks.install-wasm-bindgen-test]
# wasm-bindgen's test runner, which must match the wasm-bindgen in Cargo.lock, so the version comes
# from there. Repo-local in target/tools, never on the PATH: a global wasm-bindgen breaks
# cargo-leptos in other projects.
dependencies = ["install-cargo-binstall"]
script = '''
set -eu
version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)
runner=target/tools/bin/wasm-bindgen-test-runner
if [ -x "$runner" ] && "$runner" --version | grep -qx "wasm-bindgen-test-runner $version"; then
  exit 0
fi
cargo binstall wasm-bindgen-cli --version "$version" --root target/tools --no-confirm --locked --force
'''

[tasks.tools]
dependencies = ["install-nextest", "install-llvm-cov", "install-trunk", "install-wasmtime"]

[tasks.tools-latest]
# Every tool to its newest release, unconditionally. Run once at bootstrap and whenever a tool is
# stale; an old cargo-leptos, for one, can't build the current Leptos.
dependencies = ["install-cargo-binstall"]
command = "cargo"
args = ["binstall", "--no-confirm", "--force", "cargo-make", "cargo-nextest", "cargo-llvm-cov", "cargo-edit", "trunk", "wasmtime-cli"]

# ── Format and lint ──────────────────────────────────────────────────────────

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-check]
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--workspace", "--exclude", "lobshot-client", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.clippy-wasm]
# The client only ever compiles for the browser, and `sim` must too (the client runs it to replay
# events), so both are linted for wasm32 as well.
command = "cargo"
args = ["clippy", "--package", "lobshot-client", "--package", "lobshot-sim", "--target", "wasm32-unknown-unknown", "--all-targets", "--", "-D", "warnings"]

# ── Test ─────────────────────────────────────────────────────────────────────

[tasks.test]
dependencies = ["install-nextest"]
command = "cargo"
args = ["nextest", "run", "--workspace", "--exclude", "lobshot-client"]

[tasks.determinism]
# sim's unit tests, golden replays and formulas compiled for wasm32 and run under wasmtime. The
# goldens pin final state hashes, so passing here and natively means both targets replay every
# recorded game to the same bits (PRD-0002 T-011). wasip1 shares wasm's float semantics with the
# client's wasm32-unknown-unknown and adds the file-free test harness.
dependencies = ["install-wasmtime"]
env = { CARGO_TARGET_WASM32_WASIP1_RUNNER = "wasmtime" }
command = "cargo"
args = ["test", "--package", "lobshot-sim", "--target", "wasm32-wasip1", "--lib", "--test", "golden", "--test", "formula"]

[tasks.test-client]
# The client builds for wasm32 only, so its unit tests run there too, in node (22 or newer) under
# wasm-bindgen's runner. Each test module imports `wasm_bindgen_test` as `test`; the runner skips a
# plain `#[test]`.
dependencies = ["install-wasm-bindgen-test"]
env = { CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER = "${CARGO_MAKE_WORKING_DIRECTORY}/target/tools/bin/wasm-bindgen-test-runner" }
command = "cargo"
args = ["test", "--package", "lobshot-client", "--target", "wasm32-unknown-unknown"]

[tasks.test-ignored]
# Slow or infra-bound suites are `#[ignore = "reason"]`; this runs exactly those. Ignored tests
# named `tool_*`, at any module depth, are not suites but tools run by hand (they print fits or
# rewrite golden files).
dependencies = ["install-nextest"]
command = "cargo"
args = ["nextest", "run", "--workspace", "--exclude", "lobshot-client", "--run-ignored", "ignored-only", "--no-tests", "pass", "-E", "not test(/(^|::)tool_/)"]

[tasks.codecov]
# `clear = true` replaces cargo-make's built-in `codecov` task (a legacy uploader script).
clear = true
dependencies = ["tools"]
command = "cargo"
args = ["llvm-cov", "nextest", "--workspace", "--exclude", "xtask", "--exclude", "lobshot-client", "--lcov", "--output-path", "coverage.lcov"]

# ── Gates ────────────────────────────────────────────────────────────────────

[tasks.ci]
# The gate, run verbatim by CI.
dependencies = ["fmt-check", "clippy", "clippy-wasm", "test", "test-client", "determinism"]

[tasks.uat]
# The acceptance gate PRD UATs point at: ci plus everything too slow for every push. The ignored
# suites include the browser smoke test, which needs the release bundle.
dependencies = ["ci", "dist", "test-ignored"]

[tasks.browser]
# The browser smoke test alone (PRD-0003 uat-003): needs Chrome. To skip the release build, run the
# nextest line below by hand with LOBSHOT_BROWSER_DIST=target/dev-dist (from `cargo make dev`).
dependencies = ["dist", "install-nextest"]
command = "cargo"
args = ["nextest", "run", "--package", "lobshot-server", "--run-ignored", "ignored-only", "-E", "test(/^e2e_browser/)"]

# ── Dependencies ─────────────────────────────────────────────────────────────

[tasks.deps-latest]
# Every dependency to its newest release, then re-lock. `cargo upgrade` keeps each requirement's
# precision, so the house style ("1", "0.8") survives; `--incompatible allow` takes new majors too,
# so run `cargo make ci` afterwards and read the changelogs.
dependencies = ["install-cargo-edit"]
script = '''
set -eu
cargo upgrade --incompatible allow
cargo update
echo "now run: cargo make ci"
'''

# ── Build and run ────────────────────────────────────────────────────────────

[tasks.build-release]
command = "cargo"
args = ["build", "--release"]

[tasks.build-dev-release]
# Release-like codegen without LTO: for perf checks that don't need the full release link.
command = "cargo"
args = ["build", "--profile", "dev-release"]

[tasks.art]
command = "cargo"
args = ["xtask", "art"]

[tasks.dist]
# Runs `art` itself first: the bundle copies assets/gen/.
dependencies = ["install-trunk"]
command = "cargo"
args = ["xtask", "dist"]

[tasks.run]
# Serves whatever `dist/` holds; `cargo make dev` rebuilds it first.
command = "cargo"
args = ["run", "--package", "lobshot-server", "--", "${@}"]

[tasks.dev]
# The quick wasm-dev bundle (about 30 s to rebuild after a client change), served on port 8080.
dependencies = ["install-trunk"]
script = '''
set -eu
cargo xtask dist --dev
cargo run --package lobshot-server -- --dist target/dev-dist
'''

[tasks.docker-build]
command = "docker"
args = ["build", "-t", "lobshot:latest", "."]
